<style>
@font-face { font-family: "Barlow"; font-weight: 400; font-display: swap; src: url(pod-files/barlow-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Barlow"; font-weight: 500; font-display: swap; src: url(pod-files/barlow-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: "Barlow"; font-weight: 600; font-display: swap; src: url(pod-files/barlow-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: "Barlow"; font-weight: 700; font-display: swap; src: url(pod-files/barlow-latin-700-normal.woff2) format("woff2"); }
@font-face { font-family: "Barlow Condensed"; font-weight: 600; font-display: swap; src: url(pod-files/barlow-condensed-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: "Barlow Condensed"; font-weight: 700; font-display: swap; src: url(pod-files/barlow-condensed-latin-700-normal.woff2) format("woff2"); }
@font-face { font-family: "Plex Mono"; font-weight: 500; font-display: swap; src: url(pod-files/ibm-plex-mono-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: "Plex Mono"; font-weight: 600; font-display: swap; src: url(pod-files/ibm-plex-mono-latin-600-normal.woff2) format("woff2"); }

/* Farbsystem: Beton (Büro), Asphalt (Fahrer-App), Warnamber für Fahreraktionen und "neu",
   Frachtbrief-Blau für Büroaktionen, CMR-Rot für Abweichungen. */
:root {
  color-scheme: light;
  --bg: #E3E7EA;
  --bg-2: #D3D9DE;
  --surface: #FFFFFF;
  --surface-2: #F3F5F7;
  --surface-3: #EAEEF1;
  --line: #CDD4DA;
  --line-2: #E1E6EA;
  --ink: #16202A;
  --ink-2: #4C5864;
  --ink-3: #66717D;
  --blue: #1D56B8;
  --blue-2: #17479A;
  --blue-soft: #E2EBFA;
  --amber: #F2AE00;
  --amber-2: #D99A00;
  --amber-ink: #241A00;
  --amber-soft: #FFF1C9;
  --red: #B4301B;
  --red-soft: #FBE5E0;
  --green: #16744A;
  --green-soft: #DCF0E4;
  --check: #865600;
  --check-soft: #FCEDCC;
  --asphalt: #1E2731;
  --asphalt-2: #2B3642;
  --asphalt-3: #3A4754;
  --app-bg: #EDEFF1;
  --shadow-1: 0 1px 2px rgba(22, 32, 42, .08), 0 0 0 1px rgba(22, 32, 42, .05);
  --shadow-2: 0 18px 48px rgba(16, 26, 38, .22), 0 2px 8px rgba(16, 26, 38, .12);
  --f-body: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-cond: "Barlow Condensed", "Barlow", "Arial Narrow", system-ui, sans-serif;
  --ph: min(780px, calc(100vh - 64px));
  --pw: calc(var(--ph) * .4872);
}
@supports (height: 100dvh) { :root { --ph: min(780px, calc(100dvh - 64px)); } }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button, a, select, label, input, textarea, [role="button"] { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 4px; }
.app :focus-visible { outline-color: var(--amber-2); }
.sr-only { position: absolute !important; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.num { font-variant-numeric: tabular-nums; }
.cond { font-family: var(--f-cond); }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Bühne ---------- */
.stage { display: grid; grid-template-columns: minmax(0, 1fr); height: 100vh; height: 100dvh; }
body.ph-on .stage { grid-template-columns: minmax(0, 1fr) auto; }
.phone-col { display: none; }
body.ph-on .phone-col { display: flex; }
.phone-col { flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 12px 22px; background: var(--bg-2); border-left: 1px solid var(--line); min-width: 0; }
.pc-cap { display: flex; align-items: center; gap: 8px; width: var(--pw); color: var(--ink-2); font-size: 13px; }
.pc-cap strong { color: var(--ink); font-weight: 600; }
.pc-cap .sp { flex: 1; }
.pc-cap .pc-close { display: none; }

/* ---------- Handy-Rahmen ---------- */
.phone { position: relative; width: var(--pw); height: var(--ph); border-radius: calc(var(--pw) * .145); background: #11161B; padding: calc(var(--pw) * .03); box-shadow: var(--shadow-2), inset 0 0 0 2px #2E3741, inset 0 0 0 4px #0A0D10; flex: none; }
.phone::before, .phone::after { content: ""; position: absolute; width: 4px; border-radius: 2px; background: #2A323B; }
.phone::before { left: -4px; top: 18%; height: 9%; box-shadow: 0 calc(var(--ph) * .12) 0 #2A323B; }
.phone::after { right: -4px; top: 24%; height: 13%; }
.screen { position: relative; height: 100%; border-radius: calc(var(--pw) * .118); overflow: hidden; background: var(--app-bg); display: flex; flex-direction: column; isolation: isolate; }
.sbar { height: 44px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 6px 26px 0 30px; background: var(--asphalt); color: #fff; font-size: 14px; font-weight: 600; position: relative; }
.sbar .isl { position: absolute; left: 50%; top: 9px; width: 96px; height: 28px; transform: translateX(-50%); background: #000; border-radius: 16px; }
.sbar .ic { display: flex; gap: 5px; align-items: center; }
.sbar svg { width: 17px; height: 12px; fill: #fff; }

/* ---------- Mobil-Umschalter ---------- */
.mswitch { display: none; }

/* ---------- Büro ---------- */
.office { position: relative; display: flex; flex-direction: column; min-width: 0; height: 100%; overflow: hidden; container-type: inline-size; container-name: office; }
.otop { display: flex; align-items: center; gap: 12px; padding: 10px 18px; background: var(--surface); border-bottom: 1px solid var(--line); flex: none; min-width: 0; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { width: 34px; height: 34px; border-radius: 8px; background: var(--asphalt); display: grid; place-items: center; color: var(--amber); flex: none; }
.brand-mark svg { width: 22px; height: 22px; }
.brand b { display: block; font-family: var(--f-cond); font-size: 19px; font-weight: 700; line-height: 1.05; letter-spacing: .01em; }
.brand span { display: block; color: var(--ink-3); font-size: 12.5px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand > div:last-child { min-width: 0; }
@container office (max-width: 920px) { .otop .hide-c { display: none; } .search { width: min(240px, 30cqw); } }
@container (max-width: 519px) { .dpane .docfig { display: flex; flex-direction: column; align-items: center; } .dpane .docimg { width: min(100%, 320px); } .dpane .docfig figcaption { align-self: stretch; } }
.otop .sp { flex: 1; min-width: 8px; }
.search { position: relative; width: min(300px, 32cqw); }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--ink-3); width: 16px; height: 16px; }
.search input { width: 100%; height: 36px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); padding: 0 10px 0 32px; }
.search input:focus { background: #fff; border-color: var(--blue); outline: none; box-shadow: 0 0 0 3px var(--blue-soft); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 13px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 13.5px; white-space: nowrap; text-decoration: none; }
.btn:hover { background: var(--surface-2); }
.btn svg { width: 16px; height: 16px; }
.btn.pri { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn.pri:hover { background: var(--blue-2); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-3); color: var(--ink); }
.btn.sm { height: 30px; padding: 0 10px; font-size: 13px; }
.btn.danger { color: var(--red); }
.btn[aria-pressed="true"] { background: var(--asphalt); border-color: var(--asphalt); color: #fff; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.icon-btn { width: 36px; padding: 0; }

.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1px; background: var(--line); border-bottom: 1px solid var(--line); flex: none; }
.kpi { background: var(--surface); padding: 10px 16px 11px; border: 0; text-align: left; display: flex; flex-direction: column; gap: 1px; min-width: 0; font: inherit; color: inherit; }
button.kpi:hover { background: var(--surface-2); }
.kpi .l { color: var(--ink-2); font-size: 12.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .v { font-family: var(--f-cond); font-weight: 700; font-size: 28px; line-height: 1.05; font-variant-numeric: tabular-nums; display: flex; align-items: baseline; gap: 6px; }
.kpi .v small { font-size: 16px; color: var(--ink-3); font-weight: 600; }
.kpi .s { color: var(--ink-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi.warn .v { color: var(--red); }
.kpi.kchk .v { color: var(--check); }
.kpi .bar { height: 4px; border-radius: 2px; background: var(--surface-3); margin-top: 5px; overflow: hidden; }
.kpi .bar i { display: block; height: 100%; background: var(--green); border-radius: 2px; }
.kpi.flash { animation: kflash 1.6s ease-out; }
@keyframes kflash { 0% { background: var(--amber-soft); } 100% { background: var(--surface); } }

.otabs { display: flex; align-items: center; gap: 4px; padding: 8px 18px 0; flex: none; border-bottom: 1px solid var(--line); background: var(--surface-2); min-width: 0; }
.otab { position: relative; display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 14px; border: 0; background: transparent; color: var(--ink-2); font-weight: 600; font-size: 14px; border-radius: 8px 8px 0 0; }
.otab:hover { color: var(--ink); background: var(--surface-3); }
.otab[aria-current="page"] { background: var(--bg); color: var(--ink); box-shadow: inset 0 3px 0 var(--blue); }
.otab .cnt { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--check-soft); color: var(--check); font-size: 12px; display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }
.otabs .sp { flex: 1; }
.tl-short { display: none; }
.follow { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink-2); padding-bottom: 6px; white-space: nowrap; }
.follow input { width: 16px; height: 16px; accent-color: var(--blue); }

.oview { flex: 1; min-height: 0; position: relative; }

/* Belegeingang */
.inbox { display: grid; grid-template-columns: 320px minmax(0, 1fr); height: 100%; }
.ilist { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); background: var(--surface); }
.ifilter { display: flex; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--line-2); flex-wrap: wrap; }
.chip { height: 28px; padding: 0 10px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 600; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.chip .n { font-variant-numeric: tabular-nums; opacity: .8; }
.iscroll { overflow-y: auto; flex: 1; min-height: 0; overscroll-behavior: contain; }
.irow { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; width: 100%; padding: 10px 12px; border: 0; border-bottom: 1px solid var(--line-2); background: transparent; text-align: left; align-items: start; position: relative; }
.irow:hover { background: var(--surface-2); }
.irow[aria-current="true"] { background: var(--blue-soft); box-shadow: inset 3px 0 0 var(--blue); }
.irow.is-new { background: var(--amber-soft); }
@keyframes rnew { 0%, 30% { background: var(--amber-soft); } 100% { background: transparent; } }
.thumb { width: 52px; height: 66px; border-radius: 5px; background: var(--surface-3) center/cover no-repeat; box-shadow: 0 0 0 1px var(--line); }
.irow .t1 { display: flex; align-items: center; gap: 6px; min-width: 0; font-weight: 600; }
.irow .t1 .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.irow .t2, .irow .t3 { color: var(--ink-2); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.irow .t3 { display: flex; align-items: center; gap: 6px; margin-top: 3px; }
.newb { font-size: 11.5px; font-weight: 700; padding: 1px 6px; border-radius: 4px; background: var(--amber); color: var(--amber-ink); flex: none; }
.st { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 12px; font-weight: 600; white-space: nowrap; flex: none; }
.st::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.st.proc { background: var(--blue-soft); color: var(--blue); }
.st.proc::before { animation: pulse 1s infinite alternate; }
@keyframes pulse { from { opacity: 1; } to { opacity: .25; } }
.st.rev { background: var(--check-soft); color: var(--check); }
.st.done { background: var(--green-soft); color: var(--green); }
.st.dev { background: var(--red-soft); color: var(--red); }
.st.plan { background: var(--surface-3); color: var(--ink-2); }
.st.onsite { background: var(--amber-soft); color: #6E4A00; }
.st.transit { background: var(--blue-soft); color: var(--blue); }
.empty { padding: 28px 20px; color: var(--ink-2); text-align: center; }
.empty b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 4px; }

.dpane { overflow-y: auto; min-height: 0; height: 100%; container-type: inline-size; overscroll-behavior: contain; }
.dwrap { padding: 16px 20px 28px; display: flex; flex-direction: column; gap: 14px; max-width: 1100px; }
.dback { display: none; }
.dhead { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
.dhead h2 { margin: 0; font-family: var(--f-cond); font-size: 24px; font-weight: 700; line-height: 1.1; }
.dhead h2 .num { color: var(--ink-2); font-weight: 600; }
.dhead p { margin: 3px 0 0; color: var(--ink-2); }
.dhead .sp { flex: 1; }
.pipe { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.pipe li { position: relative; background: var(--surface); border-radius: 10px; padding: 9px 12px 10px; box-shadow: var(--shadow-1); min-width: 0; }
.pipe .pn { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 13.5px; min-width: 0; }
.pipe .pn .nm { line-height: 1.2; }
.pipe .dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--surface-3); color: var(--ink-3); flex: none; font-variant-numeric: tabular-nums; }
.pipe .dot svg { width: 13px; height: 13px; stroke-width: 3; }
.pipe .pr { color: var(--ink-2); font-size: 12.5px; margin-top: 3px; min-height: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pipe li.done .dot { background: var(--green); color: #fff; }
.pipe li.warn .dot { background: var(--check); color: #fff; }
.pipe li.run .dot { background: var(--blue); color: #fff; }
.pipe li.run { box-shadow: 0 0 0 2px var(--blue); }
.pipe li.run::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 5px; height: 2px; border-radius: 1px; background: linear-gradient(90deg, transparent, var(--blue), transparent); background-size: 50% 100%; background-repeat: no-repeat; animation: prog 1s linear infinite; animation-delay: var(--ad, 0s); }
@keyframes prog { from { background-position: -50% 0; } to { background-position: 150% 0; } }
.simnote { display: flex; gap: 8px; align-items: flex-start; padding: 9px 12px; border-radius: 8px; background: var(--check-soft); color: #5E3D00; font-size: 13.5px; }
.simnote svg { margin-top: 1px; }
.dgrid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
@container (min-width: 520px) { .dgrid { grid-template-columns: minmax(200px, 5fr) minmax(0, 7fr); align-items: start; } .dpane .docfig { position: sticky; top: 12px; } }
.docfig { margin: 0; background: #2A3038; border-radius: 10px; overflow: hidden; position: relative; }
.docimg { position: relative; width: 100%; }
.docimg img { display: block; width: 100%; height: auto; }
.docimg .ov { position: absolute; transform-origin: center; pointer-events: none; }
.docimg .bx { position: absolute; border: 2px solid rgba(29, 86, 184, .85); background: rgba(29, 86, 184, .1); border-radius: 3px; opacity: 0; transition: opacity .3s, background-color .15s, border-color .15s; pointer-events: auto; cursor: pointer; }
.docimg .bx.on { opacity: 1; }
.docimg .bx.low { border-color: rgba(200, 130, 0, .95); background: rgba(242, 174, 0, .16); }
.docimg .bx.hl { background: rgba(242, 174, 0, .42); border-color: var(--amber); border-width: 3px; }
.docimg .scan { position: absolute; left: 0; right: 0; height: 18%; top: -18%; background: linear-gradient(180deg, transparent, rgba(110, 170, 255, .35) 70%, rgba(160, 205, 255, .9) 100%); animation: scan 1.6s ease-in-out infinite; pointer-events: none; }
@keyframes scan { from { top: -18%; } to { top: 100%; } }
.docfig figcaption { display: flex; align-items: center; gap: 8px; justify-content: space-between; padding: 7px 10px; background: #20262D; color: #C9D2DB; font-size: 12.5px; }
.docfig figcaption button { color: #fff; border-color: #48525D; background: transparent; }
.fcard { background: var(--surface); border-radius: 10px; box-shadow: var(--shadow-1); overflow: hidden; }
.fcard > h3, .mcard > h3 { margin: 0; padding: 10px 14px; font-size: 14px; font-weight: 700; border-bottom: 1px solid var(--line-2); display: flex; align-items: center; gap: 8px; }
.fcard > h3 .sp, .mcard > h3 .sp { flex: 1; }
.fcard > h3 small, .mcard > h3 small { color: var(--ink-3); font-weight: 500; font-size: 12.5px; }
.frow { display: grid; grid-template-columns: 112px minmax(0, 1fr) 66px; gap: 10px; align-items: center; padding: 6px 14px; border-bottom: 1px solid var(--line-2); }
.frow:last-child { border-bottom: 0; }
@container (max-width: 779px) { .dpane .frow { grid-template-columns: minmax(0, 1fr) 78px; gap: 3px 8px; padding: 6px 12px 7px; } .dpane .frow label { grid-column: 1 / -1; } }
.frow.hl { background: var(--amber-soft); }
.frow label { font-size: 13px; color: var(--ink-2); line-height: 1.2; }
.frow input, .frow select { width: 100%; height: 32px; border: 1px solid transparent; border-radius: 6px; padding: 0 8px; background: var(--surface-2); font-weight: 500; min-width: 0; }
.frow input:hover { border-color: var(--line); }
.frow input:focus, .frow select:focus { outline: none; border-color: var(--blue); background: #fff; box-shadow: 0 0 0 3px var(--blue-soft); }
.frow.low input { background: var(--check-soft); border-color: #E7C67A; }
.frow.edited input { background: var(--blue-soft); }
.frow.pending input { color: transparent; background: repeating-linear-gradient(90deg, var(--surface-3) 0 40%, var(--surface-2) 40% 100%); }
.conf { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.conf .m { height: 4px; background: var(--surface-3); border-radius: 2px; overflow: hidden; }
.conf .m i { display: block; height: 100%; background: var(--green); }
.frow.low .conf { color: var(--check); font-weight: 600; }
.frow.low .conf .m i { background: var(--amber-2); }
.frow.edited .conf { color: var(--blue); font-weight: 600; }
.frow.edited .conf .m i { background: var(--blue); }
.mcard { background: var(--surface); border-radius: 10px; box-shadow: var(--shadow-1); }
.mbody { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.mline { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.mline select { height: 34px; border: 1px solid var(--line); border-radius: 7px; padding: 0 8px; background: #fff; max-width: 100%; }
.mline .why { color: var(--ink-2); font-size: 13px; }
.devs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.devs li { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border-radius: 8px; background: var(--red-soft); color: #7A1E10; font-size: 13.5px; }
.devs li.ok { background: var(--green-soft); color: #0F5434; }
.devs li .sp { flex: 1; }
.devs li svg { margin-top: 1px; }
.devs li.closed { background: var(--surface-2); color: var(--ink-2); text-decoration: line-through; }
.dact { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.dact .note { color: var(--ink-2); font-size: 13px; }
.reasons { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: 13px; }

/* Transporte */
.tview { display: flex; flex-direction: column; height: 100%; min-height: 0; }

.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 15px; background: #C5CDD5; transition: background .2s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.switch input:checked + span { background: var(--amber-2); }

.cap { position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; background: var(--app-bg); animation: capin .2s ease-out; }

.capb { flex: 1; min-height: 0; overflow-y: auto; padding: 12px; overscroll-behavior: contain; }

.tgrid label { position: relative; display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 6px 10px; border-radius: 11px; background: #fff; box-shadow: inset 0 0 0 1.5px var(--line); font-weight: 600; font-size: 14px; line-height: 1.15; cursor: pointer; }
.tgrid input { position: absolute; opacity: 0; pointer-events: none; }
.tgrid label:has(input:checked) { box-shadow: inset 0 0 0 2.5px var(--asphalt); background: var(--amber-soft); }
.tgrid label:has(input:focus-visible) { outline: 3px solid var(--amber-2); outline-offset: 2px; }
.tgrid svg { width: 20px; height: 20px; color: var(--ink-2); }
.capor { display: flex; align-items: center; gap: 10px; color: var(--ink-3); font-size: 13px; margin: 16px 2px 10px; }
.capor::before, .capor::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.samples { display: flex; flex-direction: column; gap: 8px; }
.samples .abtn { justify-content: flex-start; font-size: 15px; }

.vf img { max-width: 100%; max-height: 100%; display: block; }
.vf .corner { position: absolute; width: 34px; height: 34px; border: 3px solid rgba(255,255,255,.85); }
.vf .c1 { top: 16px; left: 16px; border-right: 0; border-bottom: 0; border-radius: 8px 0 0 0; }
.vf .c2 { top: 16px; right: 16px; border-left: 0; border-bottom: 0; border-radius: 0 8px 0 0; }
.vf .c3 { bottom: 16px; left: 16px; border-right: 0; border-top: 0; border-radius: 0 0 0 8px; }
.vf .c4 { bottom: 16px; right: 16px; border-left: 0; border-top: 0; border-radius: 0 0 8px 0; }
.vf .found { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); background: rgba(22,116,74,.95); color: #fff; font-size: 13px; font-weight: 700; padding: 5px 12px; border-radius: 14px; display: flex; gap: 6px; align-items: center; white-space: nowrap; }
.vf .found svg { width: 15px; height: 15px; stroke-width: 3; }

.vf .flash.go { animation: flash .35s ease-out; }
@keyframes flash { 0% { opacity: .9; } 100% { opacity: 0; } }
.capf { flex: none; padding: 12px 12px 18px; display: flex; flex-direction: column; gap: 8px; background: #0C0F12; }
.capf .meta { color: #B5C0CB; font-size: 13px; text-align: center; }
.shutter { width: 70px; height: 70px; border-radius: 50%; border: 4px solid #fff; background: transparent; display: grid; place-items: center; margin: 0 auto; }
.shutter::after { content: ""; width: 54px; height: 54px; border-radius: 50%; background: #fff; }

const RHEIN = [[50.035, 8.18], [50.04, 8.24], [50.0, 8.27], [49.95, 8.33], [49.88, 8.36], [49.84, 8.37]];
const CITIES = [['Frankfurt', 50.112, 8.68, 46], ['Offenbach', 50.10, 8.765, 22], ['Hanau', 50.133, 8.917, 22], ['Darmstadt', 49.872, 8.652, 34], ['Wiesbaden', 50.078, 8.24, 32], ['Mainz', 49.99, 8.26, 28], ['Bad Homburg', 50.226, 8.618, 18], ['Friedberg', 50.335, 8.755, 14], ['Rüsselsheim', 49.99, 8.41, 16], ['Langen', 49.99, 8.67, 13], ['Dieburg', 49.90, 8.84, 12], ['Eschborn', 50.143, 8.567, 12], ['Bad Vilbel', 50.18, 8.74, 13], ['Oberursel', 50.20, 8.578, 14]];
function stopColor(s) { const os = offStatus(s); const tr = trOf(s); if (tr.devs.some(d => d.open)) return '#B4301B'; if (os === 'done' || os === 'deviation') return '#16744A'; if (os === 'arrived') return '#F2AE00'; return '#FFFFFF'; }
function renderMap(view) {
  const tours = Object.values(DRIVERS).filter(d => UI.trDrv === 'all' || d.id === UI.trDrv);
  const roads = ROADS.map(r => `<polyline points="${pl(r[1])}" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linejoin="round"/><polyline points="${pl(r[1])}" fill="none" stroke="#F3D58A" stroke-width="5" stroke-linejoin="round"/>`).join('');
  const rlabels = ROADS.map(r => { const m = r[1][Math.floor(r[1].length / 2)]; const [x, y] = proj(m[0], m[1]); return `<g transform="translate(${x},${y})"><rect x="-17" y="-10" width="34" height="20" rx="4" fill="#2C5AA0"/><text x="0" y="5" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-family="Barlow Condensed">${r[0]}</text></g>`; }).join('');

    });
    const last = ts.filter(isDone).pop(); const arr = ts.find(s => offStatus(s) === 'arrived');
    const pos = arr || last;
    if (pos) { const [x, y] = proj(pos.lat, pos.lon); pins += `<g transform="translate(${+x + 16},${+y - 30})" aria-hidden="true"><rect x="0" y="0" width="34" height="24" rx="6" fill="${d.color}"/><use href="#i-truck" x="6" y="2" width="22" height="20" stroke="#fff" fill="none" stroke-width="2"/></g>`; }
  });

    <polyline points="${pl(RHEIN)}" fill="none" stroke="#B8D3EA" stroke-width="16" stroke-linecap="round"/><polyline points="${pl(MAIN)}" fill="none" stroke="#B8D3EA" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    ${roads}${rlabels}${clabels}${lines}
    <g transform="translate(${dx},${dy})"><rect x="-13" y="-13" width="26" height="26" rx="5" fill="#1E2731"/><text y="5" text-anchor="middle" font-size="13" font-weight="700" fill="#F2AE00" font-family="Barlow Condensed">D</text></g>
    ${pins}</svg>`;
  const side = Object.values(DRIVERS).map(d => {
    const ts = tourStops(d.id); const dn = ts.filter(isDone).length;
    const next = ts.find(s => !isDone(s));
    return `<section class="tour"><h3><i style="background:${d.color}"></i>${esc(d.name)}<span class="sp"></span><small>${d.tour}, ${d.plate}</small></h3>
      <div class="prog" aria-hidden="true">${ts.map(s => `<span class="${trOf(s).devs.some(v => v.open) ? 'x' : isDone(s) ? 'd' : offStatus(s) === 'arrived' ? 'a' : ''}"></span>`).join('')}</div>
      <p>${dn} von ${ts.length} Stopps erledigt${next ? `. Nächster: ${esc(next.name)}, ${hm(next.from)}` : '. Tour abgeschlossen'}</p>
      <ol>${ts.map(s => { const c = trOf(s).devs.some(v => v.open) ? 'x' : isDone(s) ? 'd' : offStatus(s) === 'arrived' ? 'a' : ''; return `<li><button type="button" data-tr="${s.trId}"><span class="q ${c}">${s.seq}</span><span class="n">${esc(s.name)}, ${esc(s.city.replace(/^\d+\s/, ''))}</span><span class="tm">${isDone(s) ? fT(s.doneAt) : hm(s.from)}</span></button></li>`; }).join('')}</ol></section>`;
  }).join('');
  if (!view.querySelector('.mview')) view.innerHTML = `<div class="mview"><div class="mapbox"></div><div class="tours" data-ks="tours"></div></div>`;
  setHTML(view.querySelector('.mapbox'), svg + `<div class="maplegend"><span><i style="background:#fff;box-shadow:0 0 0 2px #888 inset"></i>Offen</span><span><i style="background:#F2AE00"></i>Vor Ort</span><span><i style="background:#16744A"></i>Erledigt</span><span><i style="background:#B4301B"></i>Abweichung</span><span><b style="font-family:var(--f-cond)">D</b> Depot</span></div><div class="maptag">Schematische Karte</div>`);
  setHTML(view.querySelector('.tours'), side);
}

/* ================= Gesamtrender Büro ================= */
function renderOffice() {
  withFocus(() => {
    renderKpis();
    $$('.otab').forEach(b => b.setAttribute('aria-current', b.dataset.tab === UI.tab ? 'page' : 'false'));
    const view = $('#oview');
    if (view.dataset.tab !== UI.tab) { view.innerHTML = ''; view.dataset.tab = UI.tab; }
    if (UI.tab === 'inbox') renderInbox(view); else if (UI.tab === 'trs') renderTrs(view); else renderMap(view);

/* ================= Export und Druck ================= */
function exportCsv() {
  const head = ['Transport', 'Auftrag', 'Art', 'Tour', 'Stopp', 'Firma', 'Adresse', 'Zeitfenster', 'Fahrer', 'Status', 'Erledigt um', 'Empfänger', 'POD vollständig', 'Fehlt', 'Belege', 'Menge beauftragt', 'Menge laut Beleg', 'Lieferschein-Nr.', 'Offene Abweichungen', 'GPS'];
  const q = v => { const s = String(v ?? ''); return /[";\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const rows = trList().map(tr => { const s = stopOf(tr); const p = s.pod; const d = isDone(s);
    return [tr.id, tr.order, s.kind === 'pickup' ? 'Abholung' : 'Zustellung', DRIVERS[s.drv].tour, s.seq, s.name, `${s.street}, ${s.city}`, `${hm(s.from)}-${hm(s.to)}`, DRIVERS[s.drv].name, trState(tr)[1], d ? fT(s.doneAt) : '', p ? p.name : '', d ? (podComplete(s) ? 'ja' : 'nein') : '', d ? podMissing(s).join(', ') : '', podDocs(s).length, totalQty(tr), tr.written.qty ? tr.written.qty.v : '', tr.written.lsNo ? tr.written.lsNo.v : '', tr.devs.filter(v => v.open).map(v => v.t).join(' | '), p && p.gps ? `${NF5.format(p.gps.lat)} ${NF5.format(p.gps.lon)}` : ''];
  });
  const csv = '﻿' + [head, ...rows].map(r => r.map(q).join(';')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `transporte-${D0.getFullYear()}-${String(D0.getMonth() + 1).padStart(2, '0')}-${String(D0.getDate()).padStart(2, '0')}.csv`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  otoast(`CSV mit ${rows.length} Transporten exportiert.`);
}
function printPod(trId) {

  const docs = podDocs(s);
  $('#print').innerHTML = `<h1>Zustellnachweis ${tr.id}</h1><p>Muster GmbH, Disposition. Erstellt ${fD(now())} ${fT(now())}.</p>

<script>
"use strict";
/* ================= Fahrer-App ================= */
const DRV = 'd1';
const PH = { tab: 'tour', stop: null, cap: null, errs: {}, busy: false };
let SIG = null, POS = null, geoHintShown = false;
const draft = s => S.drafts[s.id] || (S.drafts[s.id] = { res: 'ok', qtyOn: false, qty: {}, dmgOn: false, dmgNote: '', absent: false, name: '', sig: null });
const myDocs = () => S.docs.filter(d => d.drv === DRV && d.state !== 'discarded').sort((a, b) => b.capturedAt - a.capturedAt);
const pending = () => myDocs().filter(d => d.state === 'queued').length + S.stops.filter(s => s.drv === DRV && s.synced === false).length;
const kindWord = s => s.kind === 'pickup' ? 'Abholung' : 'Zustellung';

function headHTML() {
  const drv = DRIVERS[DRV]; let back = '', h = '', who = '';
  if (PH.stop) { const s = stopById(PH.stop); back = `<button class="back" type="button" data-pact="back" aria-label="Zurück zur Tour">${ico('back')}</button>`; h = `Stopp ${s.seq}`; who = `${kindWord(s)}, ${hm(s.from)} bis ${hm(s.to)}`; }
  else if (PH.tab === 'tour') { h = drv.tour; who = `${drv.name}, ${drv.plate}`; }
  else if (PH.tab === 'docs') { h = 'Meine Belege'; who = 'Heute aufgenommen'; }
  else { h = 'Mehr'; who = drv.name; }
  return `<div class="r1">${back}<div><h1>${esc(h)}</h1><div class="who">${esc(who)}</div></div><span class="sp"></span><span id="netSlot"></span></div><div class="tbarseg" id="tseg" aria-hidden="true"></div>`;
}
function netHTML() { const p = pending(); return S.offline ? `<button class="net off" type="button" data-pact="net" aria-pressed="true" title="Offline-Modus beenden"><i></i>Offline${p ? `, ${p} warten` : ''}</button>` : `<button class="net" type="button" data-pact="net" aria-pressed="false" title="Offline simulieren"><i></i>Online</button>`; }
function segHTML() { const ts = tourStops(DRV); const nx = ts.find(s => !['done', 'deviation'].includes(s.status)); return ts.map(s => `<span class="${s.status === 'done' ? 'd' : s.status === 'deviation' ? 'x' : s.status === 'arrived' ? 'a' : ''}${nx && s.id === nx.id && s.status !== 'arrived' ? ' cur' : ''}"></span>`).join(''); }
function tourHTML() {
  const ts = tourStops(DRV); const dn = ts.filter(s => ['done', 'deviation'].includes(s.status)).length;
  const nx = ts.find(s => !['done', 'deviation'].includes(s.status));
  const cards = ts.map(s => {
    const st = s.status; const cls = st === 'done' ? 'd' : st === 'deviation' ? 'x' : st === 'arrived' ? 'a' : '';
    const docs = docsOfStop(s.id).length;
    const stt = st === 'done' ? `Erledigt ${fT(s.doneAt)}` : st === 'deviation' ? `Mit Abweichung ${fT(s.doneAt)}` : st === 'arrived' ? `Vor Ort seit ${fT(s.arrivedAt)}` : `${hm(s.from)}–${hm(s.to)}`;
    return `<button type="button" class="scard ${cls}${nx && nx.id === s.id ? ' next' : ''}" data-stop="${s.id}">
      <span class="q">${st === 'done' ? ico('check') : st === 'deviation' ? '!' : s.seq}</span>
      <span class="k"><span class="kind ${s.kind === 'pickup' ? 'pick' : ''}">${kindWord(s)}</span>${nx && nx.id === s.id ? '<span class="nexttag">Nächster Stopp</span>' : ''}<span class="tw">${esc(stt)}</span></span>
      <span class="n">${esc(s.name)}</span>

  }).join('');

}
function thumbsHTML(s) {
  const docs = docsOfStop(s.id);
  if (!docs.length) return `<div class="ainfo warn">${ico('info')}<span>Noch kein Beleg. Ohne Foto ist der Nachweis unvollständig.</span></div>`;
  return `<div class="pthumbs">${docs.map(d => { const im = docImg(d); const sy = d.state === 'queued' ? `<span class="sy q" title="Wartet auf Netz">${ico('cloudoff')}</span>` : d.state === 'sending' ? `<span class="sy u" title="Wird übertragen">${ico('sync')}</span>` : `<span class="sy" title="Im Büro">${ico('check')}</span>`;
    return `<div class="pthumb" style="background-image:url('${im.thumb}')" role="img" aria-label="${esc(typeLabel(d.chosen))}, ${d.state === 'queued' ? 'wartet auf Netz' : d.state === 'sending' ? 'wird übertragen' : 'im Büro'}">${sy}<span class="lb">${esc(typeLabel(d.chosen))}</span></div>`; }).join('')}</div>`;
}
function stopHTML() {
  const s = stopById(PH.stop); const tr = trOf(s); const dr = draft(s); const E = PH.errs; const done = ['done', 'deviation'].includes(s.status);
  const ts = tourStops(DRV);
  const head = `<section class="sec shead"><div class="k"><span class="kind ${s.kind === 'pickup' ? 'pick' : ''}">${kindWord(s)}</span>Stopp ${s.seq} von ${ts.length}</div>
    <h2>${esc(s.name)}</h2><div class="ad">${esc(s.street)}<br>${esc(s.city)}</div>
    <dl><dt>Zeitfenster</dt><dd>${hm(s.from)} bis ${hm(s.to)}</dd><dt>Auftrag</dt><dd>${tr.order}</dd><dt>Transport</dt><dd>${tr.id}</dd>${s.kind === 'pickup' ? `<dt>Ziel</dt><dd>${esc(tr.consignee.name)}</dd>` : `<dt>Absender</dt><dd>${esc(tr.shipper.name)}</dd>`}</dl>

      <dt>Büro</dt><dd>${s.synced === false ? 'Wartet auf Netz' : 'Übertragen'}</dd></dl>

  const devSec = isDev ? `<div class="devbox ${E.dev ? 'err' : ''}">

      ${dr.dmgOn ? `<div class="fld ${E.dmg ? 'err' : ''}" style="margin-left:4px"><label for="dmgNote">Was ist beschädigt?</label><textarea id="dmgNote" data-dn>${esc(dr.dmgNote)}</textarea>${E.dmg ? `<div class="ferr">${ico('alert')}${E.dmg}</div>` : ''}<button class="abtn line sm" type="button" data-pact="capdmg">${ico('cam')} Schadensfoto aufnehmen</button></div>` : ''}

  const sign = (isDev && dr.absent) ? '' : `<section class="sec"><h3>${s.kind === 'pickup' ? 'Übergabe bestätigen' : 'Empfang bestätigen'}</h3>
      <div class="fld ${E.name ? 'err' : ''}"><label for="rcvName">Name ${s.kind === 'pickup' ? 'des Verladers' : 'des Empfängers'}</label><input type="text" id="rcvName" autocomplete="off" autocapitalize="words" value="${esc(dr.name)}" placeholder="z. B. K. Wagner">${E.name ? `<div class="ferr" id="errName">${ico('alert')}${E.name}</div>` : ''}</div>
      <div class="fld ${E.sig ? 'err' : ''}"><span class="lbl" id="sigLbl">Unterschrift</span><div class="sigwrap"><canvas id="sigCv" aria-labelledby="sigLbl" role="img"></canvas><span class="ph"></span><span class="phx">×</span>${dr.sig ? '' : '<span class="hint" id="sigHint">Hier mit dem Finger unterschreiben</span>'}</div>

  app.addEventListener('change', e => {
    const t = e.target;
    if (t.name === 'ctype' && PH.cap) { PH.cap.type = t.value; const sd = $('#capWrap .samples'); const showDmg = t.value === 'dmg' || draft(stopById(PH.stop)).dmgOn; if (sd && showDmg && !sd.querySelector('[data-sample="dmg"]')) { renderCap(); const r = $(`#capWrap input[value="${t.value}"]`); if (r) r.focus(); } return; }

  });
  app.addEventListener('input', e => {
    const t = e.target; if (!PH.stop) return; const dr = draft(stopById(PH.stop));
    if (t.id === 'rcvName') { dr.name = t.value; if (PH.errs.name && t.value.trim()) { PH.errs.name = null; const f = t.closest('.fld'); f.classList.remove('err'); const fe = f.querySelector('.ferr'); if (fe) fe.remove(); } }
    else if (t.dataset.pq != null) dr.qty[t.dataset.pq] = t.value === '' ? null : Number(t.value);
    else if (t.dataset.dn != null) dr.dmgNote = t.value;
    clearTimeout(svT); svT = setTimeout(save, 400);

  $('#fileCam').addEventListener('change', onFile); $('#fileGal').addEventListener('change', onFile);
}
function rerenderStop(focusSel) { const y = $('#abody').scrollTop; renderPhone(); $('#abody').scrollTop = y; const f = focusSel && $(focusSel); if (f) f.focus({ preventScroll: true }); }
</script>
<script>
"use strict";
/* ---------- Ereignisse: Büro ---------- */
function bindOffice() {
  const off = $('#office');
  off.addEventListener('pointerdown', () => UI.lastTouch = now());
  off.addEventListener('keydown', () => UI.lastTouch = now());
  $('#kpis').addEventListener('click', e => { const k = e.target.closest('[data-kpi]'); if (k) kpiClick(k.dataset.kpi); });
  $$('.otab').forEach(b => b.addEventListener('click', () => { UI.tab = b.dataset.tab; UI.mDetail = false; try { localStorage.setItem(KEY + '-tab', UI.tab); } catch (e) {} renderOffice(); }));
  $('#follow').addEventListener('change', e => { UI.follow = e.target.checked; });
  $('#q').addEventListener('input', e => { UI.q = e.target.value.trim(); renderOffice(); });
  off.addEventListener('click', e => {
    const t = e.target.closest('button, [data-act], [data-tr], [data-bx]'); if (!t || !off.contains(t)) return;
    if (t.dataset.bx) { const d = docById(UI.sel); const inp = d && $(`#fi-${d.id}-${t.dataset.bx}`); if (inp) inp.focus(); return; }

    if (t.dataset.gotodoc) { UI.sel = t.dataset.gotodoc; UI.tab = 'inbox'; UI.mDetail = true; closeDrawer(); renderOffice(); return; }
    const a = t.dataset.act;
    if (a === 'closedrawer') { closeDrawer(); return; }
    if (a === 'print') { printPod(t.dataset.tr); return; }
    if (a === 'csv') { exportCsv(); return; }
    if (a === 'mback') { UI.mDetail = false; renderOffice(); const r = $(`[data-doc="${UI.sel}"]`); if (r) r.focus(); return; }
    if (a === 'opentr') { if (t.dataset.tr) openDrawer(t.dataset.tr); return; }
    if (a === 'closedev') { const tr = S.trs[UI.drawer]; const v = tr && tr.devs.find(x => x.id === t.dataset.dev); if (!v) return; const sn = snap(); v.open = false; v.closedAt = now(); tr.log.push({ at: now(), t: `Abweichung geklärt: ${v.t}` }); changed(); otoast('Abweichung als geklärt markiert.', () => restore(sn)); return; }
    if (a === 'release' || a === 'discard' || a === 'reopen') {
      const d = docById(UI.sel); if (!d) return; const sn = snap();
      if (a === 'release') { if (!d.match || !S.trs[d.match.trId]) return; release(d, 'Disponent'); const tr = S.trs[d.match.trId]; markNew('tr', tr.id); otoast(`${typeLabel(d.type)} in ${tr.id} eingetragen.`, () => restore(sn)); live(`${typeLabel(d.type)} freigegeben`); const nx = S.docs.find(x => x.state === 'review' && x.id !== d.id); if (nx && window.innerWidth >= 760) { setTimeout(() => {}, 0); } }
      if (a === 'discard') { d.state = 'discarded'; UI.sel = null; UI.mDetail = false; otoast('Beleg verworfen.', () => restore(sn)); }
      if (a === 'reopen') { d.state = 'review'; otoast('Beleg wieder in Prüfung.', () => restore(sn)); }
      changed(); return;
    }
    if (t.dataset.tr && !a) { openDrawer(t.dataset.tr); return; }
  });
  off.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('g.pin')) { e.preventDefault(); openDrawer(e.target.dataset.tr); } });
  off.addEventListener('input', e => {
    const t = e.target; if (!t.dataset.field) return;
    const d = docById(UI.sel); if (!d || d.state === 'processing') return;
    const f = d.fields.find(x => x.k === t.dataset.field); if (!f) return;
    f.v = t.value; f.ed = f.v !== f.o; changed();
  });
  off.addEventListener('change', e => {
    const t = e.target; const d = docById(UI.sel);
    if (t.dataset.trf) { if (t.dataset.trf === 'st') UI.trSt = t.value; else UI.trDrv = t.value; renderOffice(); return; }
    if (!d) return;
    if (t.hasAttribute('data-match')) { const sn = snap(); d.match = { trId: t.value, conf: 1, why: 'Vom Disponenten zugeordnet.' }; changed(); otoast(`Zuordnung zu ${t.value} geändert.`, () => restore(sn)); }
    if (t.hasAttribute('data-dtype')) { const old = fv(d); const conf = {}; d.fields.forEach(f => conf[f.k] = f.c); d.type = t.value; d.typeConf = 1; d.fields = FIELDS[t.value].map(([k]) => ({ k, v: old[k] || '', c: old[k] ? conf[k] : 0, o: old[k] || '', ed: false })); d.rev = d.fields.length; changed(); }
  });
  const hl = e => { const r = e.target.closest('.frow[data-fk], .bx'); const k = r ? (r.dataset.fk || r.dataset.bx) : null; if (k !== UI.hl) { UI.hl = k; applyHl(); } };
  off.addEventListener('mouseover', hl); off.addEventListener('focusin', hl);
  off.addEventListener('mouseleave', () => { UI.hl = null; applyHl(); });
}

/* ---------- Einführung ---------- */
const INTRO = [
  { h: 'Büro und Fahrer in einer Seite', p: ['Links siehst du die Disposition der Muster GmbH. Rechts das Handy von Fahrer Jonas Becker mit seiner Tour.', 'Beide Seiten sind bedienbar und teilen denselben Stand.'], pm: ['Oben wechselst du zwischen der Fahrer-App und dem Büro.', 'Beide Ansichten teilen denselben Stand.'] },
  { h: 'Beleg fotografieren und unterschreiben lassen', p: ['Öffne im Handy einen Stopp. Fotografiere einen Beleg oder nimm einen Beispiel-Lieferschein, eine Beispiel-CMR oder eine Beispiel-Rechnung.', 'Danach unterschreibt der Empfänger auf dem Display. Zeit und GPS werden mitgespeichert.'] },
  { h: 'Die KI liest aus, du gibst frei', p: ['Im Büro läuft jeder Beleg durch vier Schritte: Dokumenttyp erkennen, Felder auslesen, Zuordnen, Eintragen.', 'Unsichere Felder und Abweichungen landen zur Prüfung. In der Demo ist das Auslesen simuliert, bei Beispielbelegen sind die Werte bekannt.'] },
];
let introStep = 0, introReturn = null;
function introSvg(i) {
  const hl = (n, x) => n === i ? `stroke="#1D56B8" stroke-width="4"` : `stroke="#C3CBD2" stroke-width="2"`;
  return `<svg viewBox="0 0 380 200" aria-hidden="true"><rect x="6" y="14" width="250" height="172" rx="10" fill="#fff" ${hl(0)}/><rect x="18" y="28" width="226" height="22" rx="4" fill="#E3E7EA"/>
    ${[0, 1, 2, 3, 4].map(k => `<rect x="${18 + k * 46}" y="58" width="40" height="26" rx="4" fill="#F3F5F7"/>`).join('')}
    <rect x="18" y="94" width="76" height="80" rx="4" fill="#F3F5F7"/><rect x="102" y="94" width="142" height="80" rx="4" fill="${i === 2 ? '#FFF1C9' : '#F3F5F7'}"/>
    ${i === 2 ? [0, 1, 2, 3].map(k => `<rect x="${110 + k * 33}" y="102" width="28" height="12" rx="3" fill="${k < 3 ? '#16744A' : '#1D56B8'}"/>`).join('') + `<rect x="110" y="122" width="126" height="6" rx="3" fill="#D99A00" opacity=".6"/><rect x="110" y="134" width="100" height="6" rx="3" fill="#CDD4DA"/><rect x="110" y="146" width="116" height="6" rx="3" fill="#CDD4DA"/>` : ''}
    <rect x="276" y="6" width="96" height="188" rx="18" fill="#11161B"/><rect x="282" y="12" width="84" height="176" rx="13" fill="#EDEFF1" ${i === 1 ? 'stroke="#F2AE00" stroke-width="4"' : ''}/>
    <rect x="282" y="12" width="84" height="26" rx="10" fill="#1E2731"/><rect x="290" y="46" width="68" height="28" rx="6" fill="#fff"/><rect x="290" y="80" width="68" height="28" rx="6" fill="#fff"/>
    <rect x="290" y="150" width="68" height="22" rx="6" fill="#F2AE00"/>
    ${i === 1 ? `<path d="M296 128c6-4 10-12 14-12s-2 12 3 12 6-6 9-6 1 6 5 6 8-3 12-3" fill="none" stroke="#23409E" stroke-width="2"/>` : ''}
    <path d="M262 100h10" stroke="#F2AE00" stroke-width="3" marker-end="url(#ar)"/><defs><marker id="ar" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path d="M0 0l6 3-6 3z" fill="#F2AE00"/></marker></defs></svg>`;
}
function showIntro(i) {
  introStep = i; const box = $('#intro'); if (box.hidden) introReturn = document.activeElement;
  const it = INTRO[i]; const mob = window.innerWidth < 760; const ps = (mob && it.pm) || it.p;
  box.hidden = false;
  box.innerHTML = `<div class="ibox" role="dialog" aria-modal="true" aria-labelledby="inH"><div class="ill">${introSvg(i)}</div>
    <div class="ibody"><div class="stp">Schritt ${i + 1} von ${INTRO.length}</div><h2 id="inH">${esc(it.h)}</h2>${ps.map(p => `<p>${esc(p)}</p>`).join('')}</div>
    <div class="ifoot"><div class="idots" aria-hidden="true">${INTRO.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</div><span class="sp"></span>
    ${i < INTRO.length - 1 ? `<button class="btn ghost" type="button" data-in="skip">Überspringen</button><button class="btn pri" type="button" data-in="next">Weiter</button>` : `<button class="btn ghost" type="button" data-in="prev">Zurück</button><button class="btn pri" type="button" data-in="skip">Demo starten</button>`}</div></div>`;
  requestAnimationFrame(() => { const b = box.querySelector('.btn.pri'); if (b) b.focus(); });
}
function closeIntro() { const box = $('#intro'); box.hidden = true; box.innerHTML = ''; S.introSeen = true; save(); if (introReturn && document.body.contains(introReturn) && introReturn !== document.body) introReturn.focus(); }
function bindIntro() {
  $('#intro').addEventListener('click', e => { const b = e.target.closest('[data-in]'); if (e.target.id === 'intro') { closeIntro(); return; } if (!b) return; const a = b.dataset.in; if (a === 'next') showIntro(introStep + 1); else if (a === 'prev') showIntro(introStep - 1); else closeIntro(); });
  $('#helpBtn').addEventListener('click', () => showIntro(0));
}

/* ---------- Tastatur, Fokusfalle ---------- */
function trap(container, e) {
  const f = $$('button:not([disabled]), input:not([disabled]):not([type="hidden"]), select, textarea, [tabindex]:not([tabindex="-1"])', container).filter(x => x.offsetParent !== null || x.getClientRects().length);
  if (!f.length) return; const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}
document.addEventListener('keydown', e => {
  const intro = $('#intro');
  if (!intro.hidden) { if (e.key === 'Escape') { e.preventDefault(); closeIntro(); } else if (e.key === 'Tab') trap(intro, e); return; }
  const inPhone = $('#phoneCol').contains(document.activeElement);
  if (PH.cap && inPhone) { if (e.key === 'Escape') { e.preventDefault(); closeCap(); } else if (e.key === 'Tab') trap($('#capWrap'), e); return; }
  if (UI.drawer && !inPhone) { if (e.key === 'Escape') { e.preventDefault(); closeDrawer(); } else if (e.key === 'Tab' && $('#drawer').contains(document.activeElement)) trap($('#drawer .dpanel'), e); return; }
  if (e.key === 'Escape' && UI.mDetail && window.innerWidth < 760) { UI.mDetail = false; renderOffice(); }
});

/* ---------- Layout ---------- */
function applyLayout() {
  const mid = window.innerWidth >= 760 && window.innerWidth < 1100;
  document.body.classList.toggle('ph-on', !!S.phoneOn);
  const b = $('#phoneToggle');
  b.setAttribute('aria-pressed', S.phoneOn ? 'true' : 'false');
  b.querySelector('span').textContent = mid ? (S.phoneOn ? 'Fahrer-App schließen' : 'Fahrer-App öffnen') : (S.phoneOn ? 'Handy ausblenden' : 'Handy einblenden');
}
function setMview(v) {
  document.body.dataset.mview = v;
  $('#mvDriver').setAttribute('aria-pressed', v === 'driver'); $('#mvOffice').setAttribute('aria-pressed', v === 'office');
  try { localStorage.setItem(KEY + '-mview', v); } catch (e) {}
  scheduleRender();
}
function resetDemo() {
  const sn = snap(); const img = S.img;
  S = seed(); S.introSeen = true; S.phoneOn = JSON.parse(sn).phoneOn; seedHistory();
  IMGC.clear(); NEWS.clear(); POS = null;
  UI.sel = null; UI.filter = 'all'; UI.trSt = 'all'; UI.trDrv = 'all'; UI.mDetail = false; UI.q = ''; $('#q').value = '';
  if (UI.drawer) closeDrawer();
  PH.stop = null; PH.cap = null; PH.tab = 'tour'; PH.errs = {};
  save(); renderPhone(); renderOffice(); applyLayout();
  const msg = 'Demo zurückgesetzt.';
  const undo = () => { S = JSON.parse(sn); S.img = img; IMGC.clear(); save(); renderPhone(); renderOffice(); applyLayout(); };
  otoast(msg, undo); ptoast(msg);
}
function tickClock() { const el = $('#sbTime'); if (el) el.textContent = new Intl.DateTimeFormat('de-DE', { hour: 'numeric', minute: '2-digit' }).format(now()); }

/* ---------- Start ---------- */
async function init() {
  $('#today').textContent = 'Disposition, ' + new Intl.DateTimeFormat('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric' }).format(D0);
  try { await Promise.all(['500 16px "Plex Mono"', '600 16px "Plex Mono"', '500 30px Caveat', '700 30px Barlow', '600 12px Barlow', '500 12px Barlow'].map(f => document.fonts.load(f))); } catch (e) {}
  S = load();
  if (!S) { S = seed(); seedHistory(); save(); }
  try { const t = localStorage.getItem(KEY + '-tab'); if (t) UI.tab = t; } catch (e) {}
  if (!['inbox', 'trs', 'map'].includes(UI.tab)) UI.tab = 'inbox';
  if (window.innerWidth >= 760 && window.innerWidth < 1100 && S.phoneOn === undefined) S.phoneOn = true;
  let mv = 'driver'; try { mv = localStorage.getItem(KEY + '-mview') || 'driver'; } catch (e) {}
  setMview(mv);
  // unterbrochene Verarbeitung abschließen
  S.docs.filter(d => d.state === 'processing').forEach(d => runPipeline(d.id, true));
  S.docs.filter(d => d.state === 'sending').forEach(d => deliverDoc(d));
  bindPhone(); bindOffice(); bindIntro();
  $('#phoneToggle').addEventListener('click', () => { S.phoneOn = !S.phoneOn; applyLayout(); save(); });
  $('#phoneClose').addEventListener('click', () => { S.phoneOn = false; applyLayout(); save(); $('#phoneToggle').focus(); });
  $('#resetBtn').addEventListener('click', resetDemo);
  $('#mvDriver').addEventListener('click', () => setMview('driver'));
  $('#mvOffice').addEventListener('click', () => setMview('office'));
  let rw = window.innerWidth;
  window.addEventListener('resize', () => { applyLayout(); if ((rw < 760) !== (window.innerWidth < 760)) { rw = window.innerWidth; renderOffice(); } });
  applyLayout(); renderPhone(); renderOffice(); tickClock(); setInterval(tickClock, 20000);
  if (!S.introSeen) showIntro(0);
}
init();
</script>
