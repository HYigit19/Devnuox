  if (t.id === 're-f') { const f = t.files && t.files[0]; $('re-fn').textContent = f ? `${f.name} · ${fmtSize(f.size)}` : 'Keine Datei'; return; }
  if (t.id === 'mk-t' && MODE) { MODE.typ = t.value; redraw('auf'); return; }
  if (t.id === 'demoRtk' && MODE) { MODE.demoRtk = t.checked; return; }
  if ((t.id === 'mel-cam' || t.id === 'mel-gal') && MEL) {
    const files = [...(t.files || [])]; t.value = ''; const oid = MEL.oid, live = MEL.manual ? null : MEL.fix;
    files.forEach(f => { MEL.pending++; updMelFotos(); processPhoto(f, oid, live).then(ph => { if (!MEL || MEL.oid !== oid) return; MEL.fotos.push(ph); }).catch(() => toast(`${f.name} konnte nicht gelesen werden. Bitte ein JPG- oder PNG-Bild wählen.`)).finally(() => { if (MEL) { MEL.pending--; updMelFotos(); } }); });
    return;
  }
  if (t.id === 'mel-doc' && MEL) { const files = [...(t.files || [])]; t.value = ''; Promise.all(files.map(readDoc)).then(ds => { if (!MEL) return; MEL.docs.push(...ds); updMelFotos(); }); return; }
  if (t.id === 'mk-f' && MODE) { const f = t.files && t.files[0]; t.value = ''; if (!f) return; $('mkFoto').innerHTML = '<div class="thumb add"><span class="spin" aria-hidden="true"></span></div>'; processPhoto(f, MODE.oid, MODE.pt).then(ph => { MODE.foto = ph; $('mkFoto').innerHTML = `<div class="thumb"><img src="${ph.data}" width="96" height="72" alt="Foto zur Markierung"></div>`; }).catch(() => { $('mkFoto').innerHTML = ''; toast('Foto konnte nicht gelesen werden. Bitte ein JPG- oder PNG-Bild wählen.'); }); return; }
  if (t.id === 'docIn') {
    const files = [...(t.files || [])], oid = d.oid; t.value = '';
    Promise.all(files.map(readDoc)).then(ds => {
      ds.forEach(x => S.docs.push(Object.assign(x, { oid, by: S.user, at: nowISO() })));
      if (!save()) { ds.forEach(x => { x.data = null; }); save(); }
      renderAll(); toast(ds.length === 1 ? `${ds[0].name} hochgeladen${ds[0].data ? '' : ' (in der Demo ohne Inhalt, da größer als 700 KB)'}` : `${ds.length} Dateien hochgeladen`);
    });
    return;
  }
});
const updBrutto = () => { const n = parseEuro($('re-b').value), u = +$('re-u').value; $('reBrutto').textContent = isFinite(n) && n > 0 ? EUR.format(Math.round(n * (100 + u)) / 100) : '–'; };
let AQT;
document.addEventListener('input', e => {
  const t = e.target;
  clearErr(t);
  if (t.closest && t.closest('#sheet form')) SDIRTY = true;
  if (t.id === 're-b') updBrutto();
  if (t.id === 'aq') { S.af.q = t.value; clearTimeout(AQT); AQT = setTimeout(() => { save(); const n0 = $('aq'), pos = n0 ? n0.selectionStart : null; renderAll(); const n = $('aq'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (er) {} } }, 160); }
});

/* ---------- Formulare ---------- */
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, id = f.id, v = x => ($(x) ? $(x).value.trim() : '');
  if (id === 'melForm') { melSubmit(); return; }
  if (id === 'matForm') {
    const o = order(f.dataset.oid), ml = readMat(); if (!ml) return;
    if (!ml.length) { const first = document.querySelector('#sheet [data-mid]'); fieldErr(first ? first.id : 'mq-new', 'Bitte mindestens eine Menge eintragen.'); return; }
    const bs = applyMat(o, ml, null);
    kundenOf(o).forEach(k => notify(k, `Material gebucht: ${o.adresse} · ${matTxt(o, bs)}`, 'auftrag-' + o.id));
    closeSheet(); commit(`Gebucht: ${matTxt(o, bs)}`, () => { S.matlog = S.matlog.filter(b => !bs.includes(b)); commit(); }); return;
  }
  if (id === 'mpForm') {
    const o = order(f.dataset.oid), ch = [];
    for (const inp of document.querySelectorAll('#sheet [data-sid]')) { const n = parseMenge(inp.value); if (isNaN(n) || n < 0) { fieldErr(inp.id, 'Bitte eine Menge wie 10 oder 2,5 eingeben.'); return; } ch.push([inp.dataset.sid, n]); }
    const nn = v('mp-n'), ns = parseMenge(v('mp-s'));
    if (nn && (isNaN(ns) || ns <= 0)) { fieldErr('mp-s', 'Bitte die geplante Menge eingeben, z. B. 10.'); return; }
    if (!nn && v('mp-s')) { fieldErr('mp-n', 'Bitte angeben, welches Material geplant ist.'); return; }
    const prev = JSON.parse(JSON.stringify(o.mat || []));
    ch.forEach(([sid, n]) => { const m = (o.mat || []).find(x => x.id === sid); if (m) m.soll = n; });
    if (nn) (o.mat = o.mat || []).push({ id: uid('mp'), name: nn, einheit: v('mp-e'), soll: ns });
    (isKunde() ? admins(o).concat(o.team) : kundenOf(o)).forEach(p => notify(p, `Geplante Materialmengen geändert: ${o.adresse}`, 'auftrag-' + o.id));
    closeSheet(); commit('Geplante Mengen gespeichert', () => { o.mat = prev; commit(); }); return;
  }
  if (id === 'trForm') {
    if (!v('tr-n')) { fieldErr('tr-n', 'Bitte eine Bezeichnung eingeben, z. B. „Hausanschluss Birkenweg 7“.'); return; }
    const t = { id: uid('t'), oid: MODE.oid, by: S.user, at: nowISO(), name: v('tr-n'), typ: v('tr-t'), art: v('tr-a'), tiefe: Math.max(0, parseInt(v('tr-d'), 10) || 0), pts: MODE.pts.slice(), notiz: v('tr-x') };
    S.trassen.push(t); MODE = null; closeSheet(); commit(`Trasse gespeichert, ${fmtLen(pathLen(t.pts))}`, () => { S.trassen = S.trassen.filter(x => x.id !== t.id); commit(); }); return;
  }
  if (id === 'mkForm') {
    if (v('mk-x').length < 3) { fieldErr('mk-x', 'Bitte kurz beschreiben, was an dieser Stelle ist.'); return; }
    const x = { id: uid('m'), oid: MODE.oid, by: S.user, at: nowISO(), typ: v('mk-t'), text: v('mk-x'), loc: Object.assign({}, MODE.pt), foto: MODE.foto || null };
    S.marker.push(x); const o = order(x.oid);
    if (isKunde()) o.team.concat(admins(o)).forEach(p => notify(p, `${pname(S.user)} hat einen Hinweis gesetzt: ${o.adresse}`, 'auftrag-' + o.id));
    MODE = null; closeSheet(); commit(`${MTYP[x.typ][0]} gespeichert`); return;
  }
  if (id === 'rvForm') { const r = S.reports.find(y => y.id === f.dataset.id); r.review = { by: S.user, at: nowISO(), note: v('rv-n') }; closeSheet(); commit('Als geprüft markiert', () => { r.review = null; commit(); }); return; }
  if (id === 'rqForm') { const r = S.reports.find(y => y.id === f.dataset.id); if (v('rq-t').length < 3) { fieldErr('rq-t', 'Bitte eine Nachricht eingeben.'); return; } notify(r.by, `Rückfrage zu ${r.oid}: ${v('rq-t')}`, 'auftrag-' + r.oid); closeSheet(); commit(`Rückfrage an ${pname(r.by)} gesendet`); return; }
  if (id === 'oForm') {
    if (!v('of-t')) { fieldErr('of-t', 'Bitte eine Bezeichnung eingeben, z. B. „Glasfaser-Hausanschluss“.'); return; }
    const edit = f.dataset.id ? order(f.dataset.id) : null;
    if (!v('of-p') && !edit) { fieldErr('of-p', 'Bitte den Ort im Lageplan wählen. Daraus entstehen die Koordinaten für die Standortprüfung.'); return; }
    if (!v('of-ad')) { fieldErr('of-ad', 'Bitte die Adresse eingeben, wie sie angezeigt werden soll.'); return; }
    const team = checked('of-team');
    if (!team.length) { fieldErr('of-team', 'Bitte mindestens eine Person ins Team nehmen.'); return; }
    const o = edit || { id: f.dataset.no, status: 'geplant', created: nowISO() };
    const prevTeam = edit ? edit.team.slice() : [];
    Object.assign(o, { titel: v('of-t'), art: v('of-a'), kunde: v('of-k'), adresse: v('of-ad'), radius: +v('of-r'), genau: +v('of-g') || 0, faellig: v('of-f') || addDays(TODAY, 1), team, geraete: checked('of-ger'), text: v('of-x') });
    if (v('of-p')) o.loc = placeLoc(v('of-p'));
    if (!edit) S.orders.push(o);
    team.filter(p => !prevTeam.includes(p)).forEach(p => notify(p, `Neuer Auftrag: ${o.adresse}, ${o.titel}, fällig ${fmtDay(o.faellig)}`, 'auftrag-' + o.id));
    if (MAPS.auf) MAPS.auf.v = null;
    closeSheet(); S.route = { p: 'auftrag', id: o.id }; syncHash(true); commit(edit ? 'Auftrag gespeichert' : `${o.id} angelegt, Team benachrichtigt`); focusMain(); return;
  }
  if (id === 'reForm') {
    const netto = parseEuro(v('re-b'));
    if (!v('re-n')) { fieldErr('re-n', 'Bitte eine Rechnungsnummer eingeben.'); return; }
    if (S.rechnungen.some(x => x.id === v('re-n'))) { fieldErr('re-n', 'Diese Rechnungsnummer gibt es schon. Bitte die nächste freie Nummer nehmen.'); return; }
    if (!isFinite(netto) || netto <= 0) { fieldErr('re-b', 'Bitte den Nettobetrag eingeben, z. B. 1.240,00.'); return; }
    const o = order(v('re-o')), file = $('re-f').files && $('re-f').files[0];
    const done = datei => {
      const x = { id: v('re-n'), oid: o.id, titel: v('re-t') || o.titel, datum: v('re-d') || TODAY, faellig: addDays(v('re-d') || TODAY, +v('re-z')), netto: Math.round(netto * 100) / 100, ust: +v('re-u'), status: 'offen', bezahlt: null, datei, by: S.user, at: nowISO() };
      const prev = o.status;
      S.rechnungen.push(x); if ($('re-ab').checked) o.status = 'abgerechnet';
      kundenOf(o).forEach(k => notify(k, `Neue Rechnung ${x.id}: ${o.adresse}, ${EUR.format(brutto(x))}`, 'rechnungen'));
      if (!save()) { if (x.datei) x.datei.data = null; save(); }
      closeSheet(); commit(`Rechnung ${x.id} erfasst`, () => { S.rechnungen = S.rechnungen.filter(y => y.id !== x.id); o.status = prev; commit(); });
    };
    if (file) readDoc(file).then(dd => done({ name: dd.name, size: dd.size, data: dd.data })); else done(null);
    return;
  }
});

/* ---------- Tastatur ---------- */
document.addEventListener('mousedown', e => { if (e.target && e.target.id === 'overlay') dismissSheet(); });
document.addEventListener('keydown', e => {
  const t = e.target;
  if ((e.key === 'Enter' || e.key === ' ') && t && t.getAttribute && t.getAttribute('role') === 'button' && !/^(BUTTON|A)$/.test(t.tagName)) { e.preventDefault(); t.dispatchEvent(new MouseEvent('click', { bubbles: true })); return; }
  if (e.key === 'Escape') {
    if (!$('overlay').hidden) { dismissSheet(); return; }
    if (!$('bellPanel').hidden) { $('bellPanel').hidden = true; document.querySelectorAll('[data-action=bell][aria-controls]').forEach(x => x.setAttribute('aria-expanded', 'false')); return; }
    const pop = Object.keys(MAPS).find(k => MAPS[k].pop); if (pop) { hidePop(pop); return; }
    return;
  }
  if (e.key !== 'Tab' || $('overlay').hidden) return;
  const sh = $('sheet');
  const f = [...sh.querySelectorAll('button:not([disabled]), [href], input:not([disabled]):not([type=hidden]), select:not([disabled]), textarea:not([disabled])')].filter(x => x.offsetParent !== null);
  if (!f.length) { e.preventDefault(); return; }
  const first = f[0], last = f[f.length - 1], inside = sh.contains(document.activeElement);
  if (e.shiftKey && (document.activeElement === first || !inside)) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && (document.activeElement === last || !inside)) { e.preventDefault(); first.focus(); }
});
window.addEventListener('beforeunload', e => { if (SDIRTY || (MODE && (MODE.pts.length || MODE.pt))) { e.preventDefault(); e.returnValue = ''; } });

/* ---------- Start ---------- */
S = load();
{ const r0 = routeFromHash(); if (r0) S.route = r0; }
/* ?als=monteur | buero | kunde: Demo direkt in einer Rolle öffnen (z. B. Handyansicht auf der Website) */
{ let a = ''; try { a = new URLSearchParams(location.search).get('als') || ''; } catch (e) {}
  const pid = { monteur: 'p2', buero: 'p1', kunde: 'p6' }[a], p = pid && S.people.find(x => x.id === pid);
  if (p && S.user !== p.id) { S.user = p.id; MODE = null; if (!location.hash) S.route = { p: 'start', id: null }; } }
renderAll();
(async () => { try { DL = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { DL = null; } })();
</script>
