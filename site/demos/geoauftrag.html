<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="GeoAuftrag: Feldaufträge mit GPS-Nachweis, Fotostempel, Trassen, Markierungen und Rechnungen.">
<title>GeoAuftrag</title>
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head>
<body>
<title>GeoAuftrag</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#F2F4F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1116" media="(prefers-color-scheme: dark)">
<style>
@font-face { font-family: "Figtree"; font-style: normal; font-weight: 300 900; font-display: swap; src: url(shared-files/figtree-latin-wght-normal.woff2) format("woff2-variations"); }
@font-face { font-family: "Geist"; font-style: normal; font-weight: 100 900; font-display: swap; src: url(shared-files/geist-latin-wght-normal.woff2) format("woff2-variations"); }
@font-face { font-family: "JetBrains Mono"; font-style: normal; font-weight: 100 800; font-display: swap; src: url(shared-files/jetbrains-mono-latin-wght-normal.woff2) format("woff2-variations"); }
</style>
<style>
/* Layout: Navigation links (farbige Kacheln), Inhalt in der Mitte; am Handy Kopfzeile + Tab-Leiste mit großem „Melden“.
   Karte: eigener Lageplan in Metern, Pins in fester Pixelgröße; Koordinaten immer in Mono-Schrift wie auf dem Vermessungsprotokoll. */
:root {
  --bg: #F2F4F8;
  --surface: #FFFFFF;
  --surface-2: #F4F6FA;
  --line: #E2E6EE;
  --ink: #1A1E29;
  --ink-2: #5B6274;
  --accent: #6E4AF2;
  --accent-ink: #FFFFFF;
  --accent-soft: #EFEBFE;
  --good: #1D7445; --good-soft: #DDF1E4;
  --warn: #8F5300; --warn-soft: #FCEBCB;
  --crit: #B42331; --crit-soft: #FBE3E5;
  --info: #2459C4; --info-soft: #E2EAFA;
  --man: #B4470B; --man-soft: #FDE7D6;
  --muted-soft: #EDF0F5;
  --col-good: #1F8A55; --col-good-ink: #FFFFFF;
  --col-warn: #F4B23F; --col-warn-ink: #3A2600;
  --col-crit: #D93644; --col-crit-ink: #FFFFFF;
  --col-info: #2F6FD6; --col-info-ink: #FFFFFF;
  --col-man: #E0701F; --col-man-ink: #FFFFFF;
  --col-done: #6B7385; --col-done-ink: #FFFFFF;
  --n-start: var(--accent); --n-karte: #0B7A71; --n-auf: #2F6FD6; --n-pruef: #D93644; --n-re: #1F8A55; --n-team: #7E8496;
  --a0: #0B7A71; --a1: #5A4FCF; --a2: #B4540A; --a3: #8A3FAE; --a4: #2A6FB0; --a5: #B23355; --a6: #4E7A1E; --a7: #5D6470;
  /* Lageplan */
  --m-land: #EEF1EA;
  --m-block: #E6E9E0;
  --m-road: #FFFFFF;
  --m-road-case: #CDD2DC;
  --m-bld: #DADDE6;
  --m-bld-line: #BFC4D1;
  --m-green: #D3E7CB;
  --m-water: #B9D7F2;
  --m-park: #E3E6EE;
  --m-stall: #FFFFFF;
  --m-label: #4E5568;
  --m-halo: #FFFFFF;
  --cable: #E8590C;
  --me: #1A73E8;
  --radius: 16px;
  --card-shadow: 0 1px 3px rgba(26, 30, 41, .08), 0 0 0 1px rgba(26, 30, 41, .03);
  --scrim: rgba(13, 18, 28, .45);
  --shadow: 0 12px 32px rgba(13, 25, 45, .18);
  --font-d: 'Figtree', 'Segoe UI', system-ui, sans-serif;
  --font-b: 'Figtree', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-m: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1116; --surface: #171B23; --surface-2: #1E232E; --line: #2B3140; --ink: #E7EAF2; --ink-2: #A0A7B9;
    --accent: #A08BFF; --accent-ink: #120C2E; --accent-soft: #2A2350;
    --good: #5CCB8B; --good-soft: #15321F; --warn: #EBB25A; --warn-soft: #3A2A0F; --crit: #F47B85; --crit-soft: #3D1A1F; --info: #8DB0F6; --info-soft: #1A2744; --man: #F5A26B; --man-soft: #3B2214;
    --muted-soft: #242A36;
    --col-done: #8A92A6;
    --a0: #1E8C84; --a1: #6F64DA; --a2: #C0601A; --a3: #9B55BE; --a4: #3A82C6; --a5: #C24966; --a6: #5E9128; --a7: #6C7480;
    --m-land: #1A1F1C; --m-block: #20251F; --m-road: #39404E; --m-road-case: #262B36; --m-bld: #2C3240; --m-bld-line: #3B4252; --m-green: #1F3322; --m-water: #1D3A57; --m-park: #262C38; --m-stall: #3E4554; --m-label: #B5BCCB; --m-halo: #171B23;
    --cable: #FF7A2E; --me: #5EA1FF;
    --card-shadow: 0 0 0 1px var(--line);
    --scrim: rgba(0, 0, 0, .62); --shadow: 0 12px 32px rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1116; --surface: #171B23; --surface-2: #1E232E; --line: #2B3140; --ink: #E7EAF2; --ink-2: #A0A7B9;
  --accent: #A08BFF; --accent-ink: #120C2E; --accent-soft: #2A2350;
  --good: #5CCB8B; --good-soft: #15321F; --warn: #EBB25A; --warn-soft: #3A2A0F; --crit: #F47B85; --crit-soft: #3D1A1F; --info: #8DB0F6; --info-soft: #1A2744; --man: #F5A26B; --man-soft: #3B2214;
  --muted-soft: #242A36;
  --col-done: #8A92A6;
  --a0: #1E8C84; --a1: #6F64DA; --a2: #C0601A; --a3: #9B55BE; --a4: #3A82C6; --a5: #C24966; --a6: #5E9128; --a7: #6C7480;
  --m-land: #1A1F1C; --m-block: #20251F; --m-road: #39404E; --m-road-case: #262B36; --m-bld: #2C3240; --m-bld-line: #3B4252; --m-green: #1F3322; --m-water: #1D3A57; --m-park: #262C38; --m-stall: #3E4554; --m-label: #B5BCCB; --m-halo: #171B23;
  --cable: #FF7A2E; --me: #5EA1FF;
  --card-shadow: 0 0 0 1px var(--line);
  --scrim: rgba(0, 0, 0, .62); --shadow: 0 12px 32px rgba(0, 0, 0, .55);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(16px + env(safe-area-inset-top, 0px)); }
@media (pointer: fine) { html { overscroll-behavior: none; } }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-b); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button, a, select, label, input, textarea, [role="button"] { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
select, option { background-color: var(--surface); color: var(--ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-d); text-wrap: balance; margin: 0; font-weight: 800; letter-spacing: -.01em; }
p { margin: 0; }
.muted { color: var(--ink-2); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.i { width: 20px; height: 20px; flex: none; }
.i.s { width: 16px; height: 16px; }
.mono { font-family: var(--font-m); font-size: 12px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.skip { position: fixed; z-index: 70; left: max(16px, env(safe-area-inset-left, 0px)); top: calc(8px + env(safe-area-inset-top, 0px)); transform: translateY(-200%); background: var(--accent); color: var(--accent-ink); padding: 10px 16px; border-radius: 10px; font-weight: 700; text-decoration: none; }
.skip:focus-visible { transform: none; }
.center:focus:not(:focus-visible), .center h1[tabindex="-1"]:focus:not(:focus-visible), .sheet:focus:not(:focus-visible) { outline: none; }

/* Rahmen */
.shell { display: grid; grid-template-columns: 236px minmax(0, 1100px); gap: 24px; justify-content: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: calc(100vh - env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 3px; padding-block: 16px; overflow-y: auto; }
.center { min-width: 0; padding-block: 18px 64px; display: flex; flex-direction: column; gap: 16px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 14px; }
.logo { width: 36px; height: 36px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.logo .i { width: 22px; height: 22px; }
.brand-name { font-family: var(--font-d); font-weight: 800; font-size: 18px; line-height: 1.05; }
.brand-sub { font-size: 11.5px; color: var(--ink-2); }
.nav-i { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: none; padding: 9px 12px; border-radius: 12px; font-weight: 600; font-size: 14.5px; color: var(--ink); text-align: left; position: relative; text-decoration: none; }
.nav-i:hover { background: var(--surface); }
.nav-i.on { background: var(--accent-soft); }
.nav-i .ni { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--ni); color: #FFFFFF; flex: none; }
.nav-i .ni .i { width: 16px; height: 16px; }
.nav-i .lbl { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rail-cta { margin: 4px 0 10px; }
.rail-cta .btn { width: 100%; }
.cnt { font-size: 11.5px; font-weight: 700; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--muted-soft); color: var(--ink-2); display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }
.cnt.crit { background: var(--col-crit); color: var(--col-crit-ink); }
.nav-sep { height: 1px; background: var(--line); margin: 8px 12px; }
.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding-top: 12px; }
.me-card { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.me-card select { border: 0; background-color: var(--surface); font-weight: 700; width: 100%; min-width: 0; padding: 0; }
.me-card small { display: block; color: var(--ink-2); font-size: 12px; }
.me-card > div { min-width: 0; flex: 1; }
.linkbtn { background: none; border: 0; color: var(--accent); font-weight: 600; font-size: 13px; padding: 0; text-align: left; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
a.linkbtn { align-self: flex-start; }
.linkbtn:hover { text-decoration: underline; text-underline-offset: 3px; }
.rail-foot .linkbtn { padding: 0 12px; font-size: 12px; }
.badge { position: absolute; top: 4px; left: 26px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--col-crit); color: var(--col-crit-ink); font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.mtop { display: none; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 25; background: var(--surface); border-bottom: 1px solid var(--line); align-items: center; gap: 10px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mtop .brand { padding: 0; margin-right: auto; }
.icon-btn { position: relative; width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; padding: 0; color: var(--ink); }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn .badge { top: -5px; left: auto; right: -5px; }
.tabbar { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); justify-content: space-around; align-items: flex-end; }
.tab-i { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--ink-2); padding: 4px 6px; border-radius: 10px; flex: 1; position: relative; min-width: 0; text-decoration: none; }
.tab-i:hover { color: var(--ink); }
.tab-i.on { color: var(--accent); }
.tab-i .cnt { position: absolute; top: -2px; right: calc(50% - 22px); min-width: 17px; height: 17px; font-size: 10.5px; }
.tab-i.fab { color: var(--ink); }
.tab-i.fab .fab-c { width: 52px; height: 52px; border-radius: 18px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; margin-top: -22px; box-shadow: 0 6px 16px rgba(110, 74, 242, .35); }
.tab-i.fab .fab-c .i { width: 26px; height: 26px; }
@media (max-width: 1180px) {
  .shell { grid-template-columns: 68px minmax(0, 1fr); }
  .rail .lbl, .rail .brand > div, .rail .cnt, .me-card > div, .rail-foot .linkbtn, .rail-cta .btn span { display: none; }
  .rail .nav-i { justify-content: center; padding: 10px; }
  .rail .brand { justify-content: center; padding: 4px 0 14px; }
  .rail-cta .btn { padding: 10px; }
  .me-card { justify-content: center; padding: 6px; }
  .rail .badge { left: auto; right: 6px; }
}
@media (max-width: 760px) {
  html { scroll-padding-top: calc(72px + env(safe-area-inset-top, 0px)); scroll-padding-bottom: calc(100px + env(safe-area-inset-bottom, 0px)); }
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .mtop { display: flex; }
  .tabbar { display: flex; }
  .center { padding-bottom: calc(104px + env(safe-area-inset-bottom, 0px)); }
}

/* Bausteine */
.card { background: var(--surface); box-shadow: var(--card-shadow); border-radius: var(--radius); min-width: 0; }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.card-h h2 { font-size: 16px; }
.card-h p { margin-top: 2px; font-size: 12.5px; color: var(--ink-2); }
.card-b { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.page-h { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.page-h h1 { font-size: 27px; line-height: 1.15; letter-spacing: -.02em; }
.page-h p { margin-top: 4px; color: var(--ink-2); max-width: 66ch; }
.eyebrow { font-family: var(--font-m); font-size: 12px; font-weight: 600; color: var(--accent); letter-spacing: .02em; }
.row-acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 10px; padding: 8px 14px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 13.5px; white-space: nowrap; color: var(--ink); text-decoration: none; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--crit); border-color: var(--crit); }
.btn.danger:hover { background: var(--crit-soft); }
.btn.good { color: var(--good); border-color: var(--good); }
.btn.good:hover { background: var(--good-soft); }
.btn.big { padding: 13px 20px; font-size: 15.5px; border-radius: 12px; font-weight: 800; }
.btn.wide { width: 100%; }
.btn[disabled] { opacity: .5; cursor: not-allowed; filter: none; }
.btn .i { width: 16px; height: 16px; }
.mini { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 3px 9px; font-size: 12.5px; font-weight: 600; white-space: nowrap; color: var(--ink); text-decoration: none; }
.mini:hover { background: var(--surface-2); }
.mini.acc { color: var(--accent); border-color: var(--accent); }
.mini.acc:hover { background: var(--accent-soft); }
.mini .i { width: 14px; height: 14px; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.pill .i { width: 13px; height: 13px; }
.pill.info { background: var(--info-soft); color: var(--info); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.crit { background: var(--crit-soft); color: var(--crit); }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.man { background: var(--man-soft); color: var(--man); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.pill.muted { background: var(--muted-soft); color: var(--ink-2); }
.spill { border-radius: 6px; padding: 2px 8px; font-size: 12px; font-weight: 700; white-space: nowrap; display: inline-block; }
.spill.geplant { background: var(--col-info); color: var(--col-info-ink); }
.spill.arbeit { background: var(--col-warn); color: var(--col-warn-ink); }
.spill.problem { background: var(--col-crit); color: var(--col-crit-ink); }
.spill.erledigt { background: var(--col-good); color: var(--col-good-ink); }
.spill.abgerechnet { background: var(--col-done); color: var(--col-done-ink); }
.hint { font-size: 13px; color: var(--ink-2); }
.empty { padding: 26px 16px; color: var(--ink-2); text-align: center; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.chip:hover { border-color: var(--ink-2); color: var(--ink); }
.chip.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chip.on:hover { color: var(--surface); }
.chip .sw { width: 10px; height: 10px; border-radius: 3px; background: var(--sw); }
.tag { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 6px; background: var(--muted-soft); color: var(--ink-2); white-space: nowrap; }
.sel { border: 1px solid var(--line); background-color: var(--surface); border-radius: 999px; padding: 6px 10px; font-size: 13px; max-width: 100%; }
.search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 999px; padding: 0 14px; background: var(--surface); flex: 1 1 220px; min-width: 0; }
.search input { border: 0; background: none; padding: 8px 0; width: 100%; min-width: 0; outline: none; }
.search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.av { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #fff; flex: none; letter-spacing: .02em; }
.av.s { width: 28px; height: 28px; font-size: 11px; }
.av.xs { width: 22px; height: 22px; font-size: 9.5px; }
.av.c0 { background: var(--a0); } .av.c1 { background: var(--a1); } .av.c2 { background: var(--a2); } .av.c3 { background: var(--a3); }
.av.c4 { background: var(--a4); } .av.c5 { background: var(--a5); } .av.c6 { background: var(--a6); } .av.c7 { background: var(--a7); }
.av-stack { display: flex; }
.av-stack .av { border: 2px solid var(--surface); margin-left: -7px; }
.av-stack .av:first-child { margin-left: 0; }
.who { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
.who b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Formulare, Tabellen */
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label, .field .lbl { font-size: 12px; font-weight: 700; color: var(--ink-2); }
.field input, .field select, .field textarea { border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; background-color: var(--surface); width: 100%; min-width: 0; }
.field textarea { resize: vertical; min-height: 84px; line-height: 1.45; }
.field .help { font-size: 12px; color: var(--ink-2); }
.err { color: var(--crit); font-size: 12.5px; font-weight: 600; }
.field [aria-invalid="true"], .checks[aria-invalid="true"] label, .seg[aria-invalid="true"] { border-color: var(--crit); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.checks { display: flex; flex-wrap: wrap; gap: 6px; }
.checks label { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--ink); cursor: pointer; }
.checks label:hover { border-color: var(--ink-2); }
.checks label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.checks input { margin: 0; accent-color: var(--accent); }
.seg { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; border-radius: 12px; }
.seg label { display: flex; align-items: center; gap: 10px; border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; font-weight: 700; cursor: pointer; background: var(--surface); }
.seg label:hover { border-color: var(--ink-2); }
.seg label .dotc { width: 12px; height: 12px; border-radius: 50%; background: var(--dc); flex: none; }
.seg label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
th:first-child, td:first-child { padding-left: 16px; }
th:last-child, td:last-child { padding-right: 16px; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

tr.click:hover td { background: var(--surface-2); }
tfoot td { font-weight: 800; border-top: 1px solid var(--line); }
.rowbtn { border: 0; background: none; padding: 0; font: inherit; font-weight: 700; color: inherit; text-align: left; cursor: pointer; min-width: 0; }
.rowbtn:hover { text-decoration: underline; text-underline-offset: 3px; }
.kpi-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .kpi-row { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { background: var(--surface); box-shadow: var(--card-shadow); border-radius: var(--radius); padding: 12px 14px; text-align: left; color: var(--ink); width: 100%; border: 0; text-decoration: none; display: block; }
.kpi:hover { box-shadow: 0 0 0 2px var(--accent-soft), var(--card-shadow); }
.kpi-l { font-size: 12px; font-weight: 700; color: var(--ink-2); }
.kpi-v { font-family: var(--font-d); font-weight: 800; font-size: 28px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi-v.crit { color: var(--crit); } .kpi-v.warn { color: var(--warn); } .kpi-v.good { color: var(--good); }
.kpi-s { font-size: 12px; color: var(--ink-2); }

/* Start */
.hello { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.hello h1 { font-size: 29px; letter-spacing: -.02em; }
.hello p { margin-top: 3px; color: var(--ink-2); }
.quick { display: flex; gap: 8px; flex-wrap: wrap; }
.qbtn { display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 999px; padding: 9px 14px; font-weight: 700; font-size: 13.5px; color: #FFFFFF; background: var(--qc); text-decoration: none; }
.qbtn:hover { filter: brightness(1.1); }
.qbtn .i { width: 16px; height: 16px; }
.focus { background: var(--accent); color: var(--accent-ink); border-radius: calc(var(--radius) + 4px); padding: 18px 22px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 18px; }
.focus-n { width: 56px; height: 56px; border-radius: 50%; background: var(--accent-ink); color: var(--accent); display: grid; place-items: center; flex: none; }
.focus-n .i { width: 28px; height: 28px; }
.focus-t { flex: 1 1 220px; min-width: 0; }
.focus-t small { display: block; font-family: var(--font-m); font-weight: 600; opacity: .85; }
.focus-t b { display: block; font-family: var(--font-d); font-size: 21px; font-weight: 800; line-height: 1.2; }
.focus-t span { opacity: .92; font-weight: 600; }
.focus .btn { background: var(--accent-ink); color: var(--accent); border: 0; padding: 12px 20px; font-size: 15px; font-weight: 800; }
.focus .btn:hover { box-shadow: 0 0 0 3px rgba(255, 255, 255, .35); }
.focus .btn.ghost { background: transparent; color: var(--accent-ink); box-shadow: inset 0 0 0 2px var(--accent-ink); }
.two { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 980px) { .two { grid-template-columns: minmax(0, 1fr); } }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.cols3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
@media (max-width: 980px) { .cols3 { grid-template-columns: minmax(0, 1fr); } }
.col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.col-h { margin: 0; border-radius: 12px; padding: 10px 14px; font-size: 15px; font-weight: 800; display: flex; justify-content: space-between; align-items: center; font-family: var(--font-d); }
.col-h.crit { background: var(--col-crit); color: var(--col-crit-ink); }
.col-h.warn { background: var(--col-warn); color: var(--col-warn-ink); }
.col-h.info { background: var(--col-info); color: var(--col-info-ink); }
.col-h.good { background: var(--col-good); color: var(--col-good-ink); }
.col-empty { padding: 18px 12px; text-align: center; color: var(--ink-2); font-size: 13px; border: 1.5px dashed var(--line); border-radius: var(--radius); }
.bcard { background: var(--surface); box-shadow: var(--card-shadow); border-radius: var(--radius); padding: 13px 14px; display: flex; flex-direction: column; gap: 8px; text-align: left; width: 100%; color: var(--ink); border: 0; text-decoration: none; }
button.bcard:hover, a.bcard:hover { box-shadow: 0 0 0 2px var(--accent-soft), var(--card-shadow); }
.bc-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; }
.bc-t { font-weight: 800; font-size: 15px; line-height: 1.3; font-family: var(--font-d); overflow-wrap: anywhere; }
.bc-s { font-size: 12.5px; color: var(--ink-2); overflow-wrap: anywhere; }
.bc-b { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

/* Auftragskarten am Handy */
.job { background: var(--surface); box-shadow: var(--card-shadow); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.job-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.job-t { min-width: 0; }
.job-t b { display: block; font-family: var(--font-d); font-size: 17px; font-weight: 800; line-height: 1.25; overflow-wrap: anywhere; }
.job-t span { color: var(--ink-2); overflow-wrap: anywhere; }
.job-acts { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 8px; }
.job-acts .btn { padding: 11px 10px; }
@media (max-width: 420px) { .job-acts { grid-template-columns: 1fr 1fr; } .job-acts .btn:first-child { grid-column: 1 / -1; } }
.dist { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-m); font-size: 12px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }

/* Karte */
.map { position: relative; height: min(68vh, 640px); min-height: 320px; border-radius: var(--radius); overflow: hidden; background: var(--m-land); touch-action: none; user-select: none; -webkit-user-select: none; overscroll-behavior: contain; }
.map.sm { height: 300px; min-height: 240px; }
.map.md { height: min(56vh, 460px); }
.map svg { display: block; width: 100%; height: 100%; cursor: grab; }
.map.drag svg { cursor: grabbing; }
.map.picking svg { cursor: crosshair; }
.map .pin, .map .mk, .map .rp, .map .tr { cursor: pointer; }
.map .pin:focus-visible, .map .mk:focus-visible, .map .rp:focus-visible, .map .tr:focus-visible { outline: none; }
.map .pin:focus-visible .pin-b, .map .mk:focus-visible rect, .map .rp:focus-visible circle { stroke: var(--accent); stroke-width: 3; }
.map-ctl { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 6px; }
.map-ctl button { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: grid; place-items: center; box-shadow: var(--card-shadow); padding: 0; }
.map-ctl button:hover { background: var(--surface-2); }
.map-ctl button .i { width: 18px; height: 18px; }
.map-scale { position: absolute; left: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 2px; font-family: var(--font-m); font-size: 11px; font-weight: 600; color: var(--m-label); pointer-events: none; }
.map-scale i { display: block; height: 6px; border: 2px solid var(--m-label); border-top: 0; }
.map-tag { position: absolute; left: 10px; top: 10px; background: var(--surface); color: var(--ink-2); border-radius: 8px; padding: 4px 8px; font-size: 11.5px; font-weight: 700; box-shadow: var(--card-shadow); pointer-events: none; }
.map-pop { position: absolute; left: 10px; right: 58px; bottom: 34px; max-width: 420px; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; touch-action: auto; user-select: text; -webkit-user-select: text; }
.map-pop .bc-top b { font-family: var(--font-d); font-size: 15px; font-weight: 800; overflow-wrap: anywhere; }
.map-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px 14px; flex-wrap: wrap; padding: 10px 16px; font-size: 12.5px; color: var(--ink-2); border-top: 1px solid var(--line); }
.legend { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); align-items: center; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.lg-dot { width: 11px; height: 11px; border-radius: 50%; background: var(--c); display: inline-block; }
.lg-line { width: 18px; height: 4px; border-radius: 2px; background: var(--cable); display: inline-block; }
.mode-bar { display: flex; flex-direction: column; gap: 10px; padding: 12px 16px; background: var(--accent-soft); border-top: 1px solid var(--line); }
.mode-bar b { font-family: var(--font-d); font-size: 15px; }
.mode-bar .row-acts .btn { flex: 1 1 auto; }

/* Standort */
.loc { border-radius: 14px; padding: 14px; display: flex; gap: 12px; align-items: flex-start; background: var(--surface-2); border: 1px solid var(--line); }
.loc.ok { background: var(--good-soft); border-color: transparent; }
.loc.rand, .loc.ungenau { background: var(--warn-soft); border-color: transparent; }
.loc.weit { background: var(--crit-soft); border-color: transparent; }
.loc.manuell { background: var(--man-soft); border-color: transparent; }
.loc-ic { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--surface); color: var(--ink-2); }
.loc.ok .loc-ic { background: var(--col-good); color: var(--col-good-ink); }
.loc.rand .loc-ic, .loc.ungenau .loc-ic { background: var(--col-warn); color: var(--col-warn-ink); }
.loc.weit .loc-ic { background: var(--col-crit); color: var(--col-crit-ink); }
.loc.manuell .loc-ic { background: var(--col-man); color: var(--col-man-ink); }
.loc-t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.loc-t b { font-family: var(--font-d); font-size: 16px; font-weight: 800; }
.loc.ok .loc-t b { color: var(--good); } .loc.weit .loc-t b { color: var(--crit); } .loc.rand .loc-t b, .loc.ungenau .loc-t b { color: var(--warn); } .loc.manuell .loc-t b { color: var(--man); }
.spin { width: 20px; height: 20px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.4s; } }
.demo-box { border: 1.5px dashed var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.demo-box .k { font-size: 11px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); }

/* Zeitleiste der Rückmeldungen */
.tl { list-style: none; margin: 0; padding: 0; }
.tl > li { display: flex; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.tl > li:last-child { border-bottom: 0; }
.tl-b { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.tl-h { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.tl-h b { font-weight: 700; }
.tl-h time { color: var(--ink-2); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.tl-text { overflow-wrap: anywhere; }
.tl-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; color: var(--ink-2); align-items: center; }
.review { font-size: 12.5px; color: var(--good); font-weight: 600; }
.thumbs { display: flex; gap: 8px; flex-wrap: wrap; }
.thumb { position: relative; width: 96px; height: 72px; border-radius: 10px; overflow: hidden; border: 0; padding: 0; background: var(--muted-soft); flex: none; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb:hover { box-shadow: 0 0 0 2px var(--accent); }
.thumb .tf { position: absolute; left: 4px; top: 4px; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; background: var(--col-warn); color: var(--col-warn-ink); }
.thumb .tf .i { width: 12px; height: 12px; }
.thumb.add { display: grid; place-items: center; border: 1.5px dashed var(--line); background: var(--surface); color: var(--ink-2); font-size: 12px; font-weight: 700; }
.photo-big { width: 100%; height: auto; border-radius: 12px; display: block; background: var(--muted-soft); }
.files { list-style: none; margin: 0; padding: 0; }
.files li { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.files li:last-child { border-bottom: 0; }
.files .ft { width: 34px; height: 40px; border-radius: 6px; background: var(--info-soft); color: var(--info); display: grid; place-items: center; font-size: 10px; font-weight: 800; flex: none; font-family: var(--font-m); }
.files .fn { flex: 1 1 160px; min-width: 0; }
.files .fn b { display: block; overflow-wrap: anywhere; font-weight: 600; }
.files .fn small { color: var(--ink-2); }
.steps { display: flex; gap: 6px; flex-wrap: wrap; }
.step { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: var(--ink-2); padding: 4px 10px 4px 6px; border-radius: 999px; background: var(--muted-soft); }
.step i { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); font-style: normal; font-size: 11px; }
.step.done { background: var(--good-soft); color: var(--good); }
.step.done i { background: var(--col-good); color: var(--col-good-ink); }
.step.now { background: var(--accent); color: var(--accent-ink); }
.step.now i { background: var(--accent-ink); color: var(--accent); }
.step.bad { background: var(--col-crit); color: var(--col-crit-ink); }
.dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px 16px; margin: 0; }
.dl dt { font-size: 11.5px; font-weight: 700; color: var(--ink-2); }
.dl dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.coord { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.feed { list-style: none; margin: 0; padding: 0; }
.feed li { display: flex; gap: 10px; padding: 11px 16px; border-bottom: 1px solid var(--line); align-items: flex-start; }
.feed li:last-child { border-bottom: 0; }
.feed .ft { flex: 1; min-width: 0; }
.feed .ft b { font-weight: 700; }
.feed .ft p { overflow-wrap: anywhere; }
.feed .ft small { display: flex; flex-wrap: wrap; gap: 4px 8px; color: var(--ink-2); margin-top: 3px; align-items: center; }
.flag-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.flag-list li { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; }
.flag-list li .i { color: var(--warn); margin-top: 1px; }
.rule { display: flex; gap: 10px; align-items: flex-start; }
.rule .ri { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; flex: none; background: var(--rc); color: #fff; }
.rule .ri .i { width: 16px; height: 16px; }

/* Dialoge */
.overlay { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: flex; align-items: flex-start; justify-content: center; overflow: auto; overscroll-behavior: contain; padding: calc(24px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet { width: min(640px, 100%); background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); }
.sheet.wide { width: min(820px, 100%); }
@media (max-width: 560px) {
  .overlay { padding: env(safe-area-inset-top, 0px) 0 0; align-items: flex-start; }
  .sheet, .sheet.wide { width: 100%; min-height: 100%; border-radius: 0; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .sheet-h { position: sticky; top: 0; background: var(--surface); z-index: 2; }
  .sheet-f { position: sticky; bottom: 0; background: var(--surface); }
}
.sheet-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.sheet-h h2 { font-size: 19px; min-width: 0; overflow-wrap: anywhere; }
.sheet-h small { display: block; font-family: var(--font-m); color: var(--ink-2); font-size: 12px; font-weight: 600; }
.sheet-b { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.sheet-f { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.close { border: 0; background: none; width: 40px; height: 40px; border-radius: 10px; color: var(--ink-2); display: grid; place-items: center; flex: none; }
.close:hover { background: var(--surface-2); color: var(--ink); }
.sec-l { font-size: 12px; font-weight: 800; color: var(--ink-2); letter-spacing: .06em; text-transform: uppercase; }
.discard { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--warn-soft); color: var(--warn); font-weight: 700; }
.discard span { flex: 1 1 200px; }
.more-list { display: flex; flex-direction: column; gap: 6px; }
.more-list .nav-i { border: 1px solid var(--line); }
.bell-panel { position: fixed; z-index: 45; top: calc(env(safe-area-inset-top, 0px) + 60px); right: max(16px, env(safe-area-inset-right, 0px)); width: min(400px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
@media (min-width: 761px) { .bell-panel { top: auto; bottom: 90px; left: max(16px, calc(50% - 650px + 250px)); right: auto; } }
@media (min-width: 761px) and (max-width: 1180px) { .bell-panel { left: 96px; } }
.bell-h { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); font-weight: 700; }
.notes { list-style: none; margin: 0; padding: 0; max-height: min(60vh, 420px); overflow: auto; overscroll-behavior: contain; }
.note { display: flex; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--line); }
.note span { overflow-wrap: anywhere; }
.note.unread { background: var(--accent-soft); }
.note small { display: block; color: var(--ink-2); margin-top: 2px; font-size: 12px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--ink); color: var(--surface); border-radius: 12px; padding: 10px 16px; font-weight: 600; box-shadow: var(--shadow); max-width: calc(100vw - 32px); display: flex; align-items: center; gap: 14px; }
.toast-undo { border: 0; background: none; color: inherit; font-weight: 800; text-decoration: underline; text-underline-offset: 3px; padding: 0; }
@media (max-width: 760px) { .toast { bottom: calc(92px + env(safe-area-inset-bottom, 0px)); } }

/* Lageplan-Zeichnung */
.m-land { fill: var(--m-land); }
.m-green { fill: var(--m-green); }
.m-water { fill: none; stroke: var(--m-water); stroke-linecap: round; stroke-linejoin: round; }
.m-park { fill: var(--m-park); }
.m-stall { fill: none; stroke: var(--m-stall); stroke-width: .5; }
.m-case { fill: none; stroke: var(--m-road-case); stroke-linecap: round; stroke-linejoin: round; }
.m-road { fill: none; stroke: var(--m-road); stroke-linecap: round; stroke-linejoin: round; }
.m-bld { fill: var(--m-bld); stroke: var(--m-bld-line); stroke-width: 1; }
.m-lbl { fill: var(--m-label); font-family: var(--font-b); font-weight: 600; pointer-events: none; }
.m-lbl.r { font-weight: 700; paint-order: stroke; stroke: var(--m-halo); stroke-linejoin: round; letter-spacing: .02em; }
.m-lbl.n { font-weight: 700; }

  const done = mine.filter(o => !isActive(o)).sort((a, b) => b.faellig.localeCompare(a.faellig)).slice(0, 4);
  const myReps = S.reports.filter(r => r.by === S.user).sort((a, b) => b.at.localeCompare(a.at)).slice(0, 4);
  return `
  <div class="hello"><div><h1>${hello()}</h1><p>${esc(DFW.format(new Date()).replace('.', ''))}, ${fmt(TODAY)} · ${act.length} ${act.length === 1 ? 'Auftrag' : 'Aufträge'} offen</p></div></div>
  ${next ? `<div class="focus"><div class="focus-n">${ic('pin')}</div><div class="focus-t"><small>${esc(next.id)} · ${esc(STAT[next.status])}</small><b>${esc(next.adresse)}</b><span>${esc(next.titel)}${FIX ? ` · ${fmtDist(dist(FIX, next.loc))} entfernt` : ''}</span></div><div class="row-acts"><button class="btn" data-action="melden" data-id="${next.id}">Vor Ort melden</button><a class="btn ghost" href="${gmNav(next.loc)}" target="_blank" rel="noopener">${ic('route', 's')} Route</a></div></div>` : `<div class="focus"><div class="focus-n">${ic('check')}</div><div class="focus-t"><b>Keine offenen Aufträge</b><span>Neue Aufträge erscheinen hier, sobald das Büro sie zuweist.</span></div></div>`}
  <section class="card"><div class="card-b" style="flex-direction:row;align-items:center;flex-wrap:wrap;gap:12px">
    <div class="loc-ic" style="background:var(--muted-soft)">${ic('target')}</div>
    <div style="flex:1 1 200px;min-width:0">${FIX ? `<b>Ihr Standort</b><div class="mono">${esc(fmtCoord(FIX))} · ${fmtAcc(FIX.acc)} · ${esc(srcLabel(FIX.src))} · ${esc(fmtT(FIX.at))}</div>` : `<b>Standort noch nicht ermittelt</b><div class="hint">Dann sehen Sie, wie weit jeder Auftrag entfernt ist.</div>`}</div>
    <button class="btn" data-action="locate-me">${ic('target', 's')} ${FIX ? 'Aktualisieren' : 'Standort ermitteln'}</button>
  </div></section>
  <h2 style="font-size:18px">Meine Aufträge</h2>
  ${act.length ? act.map(jobCard).join('') : '<div class="col-empty">Keine offenen Aufträge.</div>'}
  ${myReps.length ? `<section class="card"><div class="card-h"><div><h2>Meine letzten Rückmeldungen</h2><p>So sieht das Büro Ihre Meldungen</p></div></div><ul class="tl">${myReps.map(r => tlItem(r, true)).join('')}</ul></section>` : ''}
  ${done.length ? `<section class="card"><div class="card-h"><div><h2>Abgeschlossen</h2></div></div><ul class="feed">${done.map(o => `<li><span class="spill ${o.status}">${STAT[o.status]}</span><div class="ft"><a class="linkbtn" href="#auftrag-${o.id}" data-action="go" data-p="auftrag" data-id="${o.id}">${esc(o.adresse)}</a><small><span class="mono">${esc(o.id)}</span>${esc(o.titel)}</small></div></li>`).join('')}</ul></section>` : ''}`;
}
function startKunde() {
  const k = kunde(me().kunde), os = myOrders().slice().sort(orderSort), ids = new Set(os.map(o => o.id)), act = os.filter(isActive);
  const repsToday = S.reports.filter(r => r.at.startsWith(TODAY) && ids.has(r.oid));
  const openB = openBookings(ids), probs = os.filter(o => o.status === 'problem');
  const firms = [...new Set(os.map(o => o.an))].map(firma);
  const segs = fo => STAT_ORDER.map(st => [st, fo.filter(o => o.status === st).length]).filter(x => x[1]);
  const firmCard = f => {
    const fo = os.filter(o => o.an === f.id), fa = fo.filter(isActive), fids = new Set(fo.map(o => o.id));
    const reps = S.reports.filter(r => fids.has(r.oid)).sort((a, b) => b.at.localeCompare(a.at)), last = reps[0];
    const r30 = reps.filter(r => daysBetween(r.at, TODAY) <= 30), okPct = r30.length ? Math.round(r30.filter(r => verify(r).k === 'ok').length / r30.length * 100) : null;
    const pr = fo.filter(o => o.status === 'problem').length, ps = fa.map(matPct).filter(x => x != null), mp = ps.length ? Math.round(ps.reduce((s, x) => s + x, 0) / ps.length) : null;
    return `<article class="firm" style="--fc:${f.farbe}">
      <div class="firm-h"><b>${esc(f.name)}</b>${pr ? `<span class="pill crit">${ic('alert')}${pr} Behinderung${pr > 1 ? 'en' : ''}</span>` : '<span class="pill good">läuft</span>'}</div>
      <div class="firm-k"><div><span class="firm-n">${fa.length}</span><small>aktive Baustelle${fa.length === 1 ? '' : 'n'}</small></div><div><span class="firm-n">${okPct == null ? '–' : okPct + ' %'}</span><small>vor Ort bestätigt</small></div><div><span class="firm-n">${mp == null ? '–' : mp + ' %'}</span><small>Material verbraucht</small></div></div>
      <div class="sbar" role="img" aria-label="${esc(segs(fo).map(([st, n]) => `${n} ${STAT[st]}`).join(', '))}">${segs(fo).map(([st, n]) => `<i class="sb-${st}" style="flex:${n}"></i>`).join('')}</div>
      <div class="sleg">${segs(fo).map(([st, n]) => `<span><i class="sb-${st}"></i>${n} ${esc(STAT[st])}</span>`).join('')}</div>
      <p class="hint">${last ? `Zuletzt: ${esc(pname(last.by))}, ${esc(fmtRel(last.at))}, ${esc(order(last.oid).adresse)}` : 'Noch keine Rückmeldung'}</p>
      <button class="btn" data-action="an-filter" data-an="${f.id}">${ic('list', 's')} ${fo.length} Baustelle${fo.length === 1 ? '' : 'n'} ansehen</button>
    </article>`;
  };
  const agg = {}; act.forEach(o => (o.mat || []).forEach(m => { const key = m.name + '|' + m.einheit; const a = agg[key] || (agg[key] = { name: m.name, einheit: m.einheit, soll: 0, ist: 0, n: 0 }); a.soll += m.soll; a.ist += matIst(o.id, m.id); a.n++; }));
  const aggL = Object.values(agg).sort((a, b) => b.soll - a.soll);
  return `
  <div class="hello"><div><h1>${hello()}</h1><p>${esc(k.name)} · ${firms.length} Auftragnehmer · ${act.length} aktive Baustelle${act.length === 1 ? '' : 'n'}</p></div>
    <div class="quick"><button class="qbtn" style="--qc:var(--n-karte)" data-action="kml-all">${ic('download', 's')} KML für Google Maps</button></div></div>
  <div class="kpi-row">
    <a class="kpi" href="#auftraege" data-action="go" data-p="auftraege"><div class="kpi-l">Baustellen aktiv</div><div class="kpi-v">${act.length}</div><div class="kpi-s">bei ${firms.length} Auftragnehmern</div></a>
    <button class="kpi" data-action="an-filter" data-an="" data-st="problem"><div class="kpi-l">Behinderungen</div><div class="kpi-v${probs.length ? ' crit' : ' good'}">${probs.length}</div><div class="kpi-s">${probs.length ? esc(probs.map(o => o.adresse).join(', ')) : 'Keine'}</div></button>
    <a class="kpi" href="#karte" data-action="go" data-p="karte"><div class="kpi-l">Rückmeldungen heute</div><div class="kpi-v">${repsToday.length}</div><div class="kpi-s">${repsToday.filter(r => verify(r).k === 'ok').length} vor Ort bestätigt</div></a>
    <a class="kpi" href="#mat-offen" data-action="go-anchor" data-a="mat-offen"><div class="kpi-l">Material zu bestätigen</div><div class="kpi-v${openB.length ? ' warn' : ' good'}">${openB.length}</div><div class="kpi-s">Buchungen der Auftragnehmer</div></a>
  </div>
  <h2 class="sec-t">Auftragnehmer</h2>
  <div class="firms">${firms.map(firmCard).join('')}</div>
  <div class="two">
    <section class="card"><div class="card-h"><div><h2>Alle Baustellen auf der Karte</h2><p>Aufträge aller Auftragnehmer mit Rückmeldungen und Trassen</p></div><a class="linkbtn" href="#karte" data-action="go" data-p="karte">Große Karte ${ic('next', 's')}</a></div>${mapBlock('kstart', { oids: os.filter(o => o.status !== 'abgerechnet').map(o => o.id), label: 'Lageplan aller Baustellen' }, 'md')}<div class="map-foot">${legend()}</div></section>
    <section class="card"><div class="card-h"><div><h2>Neu von den Baustellen</h2><p>Rückmeldungen, Trassen und Material aller Auftragnehmer</p></div></div><ul class="feed">${feedItems(ids).slice(0, 7).map(feedLi).join('')}</ul></section>
  </div>
  <section class="card"><div class="card-h"><div><h2>Baustellen im Überblick</h2><p>Status, letzte Rückmeldung und Materialverbrauch je Auftrag</p></div><a class="linkbtn" href="#auftraege" data-action="go" data-p="auftraege">Alle Baustellen ${ic('next', 's')}</a></div>
    <div class="tbl"><table><thead><tr><th>Baustelle</th><th>Auftragnehmer</th><th>Status</th><th>Letzte Rückmeldung</th><th>Material</th><th>Fällig</th></tr></thead><tbody>
    ${os.filter(o => o.status !== 'abgerechnet').map(o => { const lr = lastReport(o.id); return `<tr class="click" data-action="go" data-p="auftrag" data-id="${o.id}"><td><button class="rowbtn" data-action="go" data-p="auftrag" data-id="${o.id}">${esc(o.adresse)}</button><div class="muted"><span class="mono">${esc(o.id)}</span> · ${esc(o.titel)}</div></td><td>${anTag(o)}</td><td><span class="spill ${o.status}">${STAT[o.status]}</span></td><td>${lr ? `<div>${esc(fmtRel(lr.at))}</div>${vChip(lr)}` : '<span class="muted">–</span>'}</td><td>${mbar(matPct(o))}</td><td class="num">${esc(fmtDay(o.faellig))}</td></tr>`; }).join('')}
    </tbody></table></div></section>
  <div class="two">
    <section class="card"><div class="card-h"><div><h2>Material über alle Baustellen</h2><p>Geplante Menge und gebuchter Verbrauch der aktiven Baustellen</p></div></div>
      ${aggL.length ? `<div class="tbl"><table><thead><tr><th>Material</th><th class="num">Geplant</th><th class="num">Verbraucht</th><th>Anteil</th></tr></thead><tbody>${aggL.map(a => `<tr><td><b>${esc(a.name)}</b><div class="muted">${a.n} Baustelle${a.n === 1 ? '' : 'n'}</div></td><td class="num">${fmtMenge(a.soll, a.einheit)}</td><td class="num">${fmtMenge(a.ist, a.einheit)}</td><td>${mbar(a.soll ? Math.round(a.ist / a.soll * 100) : null)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="empty">Noch kein Material geplant.</p>'}</section>
    <section class="card" id="mat-offen" tabindex="-1"><div class="card-h"><div><h2>Materialbuchungen bestätigen</h2><p>${openB.length ? `${openB.length} offen` : 'Alles bestätigt'}</p></div>${openB.length > 1 ? `<button class="btn" data-action="mat-ok-all" data-oid="">${ic('check', 's')} Alle bestätigen</button>` : ''}</div>
      ${openB.length ? `<ul class="mlog">${openB.sort((a, b) => b.at.localeCompare(a.at)).slice(0, 8).map(b => mlogLi(b, true)).join('')}</ul>` : '<p class="empty">Keine offenen Buchungen.</p>'}</section>
  </div>`;
}

function mlogLi(b, withOrder) {
  const o = order(b.oid), m = matPos(o, b.mid), r = b.rid ? S.reports.find(x => x.id === b.rid) : null;
  return `<li>${av(pname(b.by), 's')}<div class="ml-b"><b>${esc(fmtMenge(b.menge, m.einheit))} ${esc(m.name)}</b><small>${esc(pname(b.by))} · ${esc(fmtRel(b.at))}${withOrder && o ? ` · <a class="linkbtn" href="#auftrag-${o.id}" data-action="go" data-p="auftrag" data-id="${o.id}">${esc(o.adresse)}</a> · ${esc(firma(o.an).kurz)}` : ''}</small>${r ? `<span class="row-acts">${vChip(r)}</span>` : '<span class="row-acts"><span class="pill muted">ohne Rückmeldung gebucht</span></span>'}</div>
    ${b.ok ? `<span class="pill good">${ic('check')}bestätigt</span>` : canConfirm(o) ? `<button class="mini acc" data-action="mat-ok" data-id="${b.id}">${ic('check')} Bestätigen</button>` : '<span class="pill warn">offen</span>'}</li>`;
}
function matCard(o) {
  const pos = o.mat || [], bs = bookings(o.id), open = bs.filter(b => !b.ok).length, pct = matPct(o);
  return `<section class="card" id="mat"><div class="card-h"><div><h2>Material</h2><p>${pos.length ? `${pct == null ? '' : `${pct} % der geplanten Menge verbraucht · `}${bs.length} Buchung${bs.length === 1 ? '' : 'en'}${open ? `, ${open} offen` : ''}` : 'Noch kein Material geplant'}</p></div>
    <div class="row-acts">${canBook(o) ? `<button class="btn" data-action="mat-book" data-id="${o.id}">${ic('plus', 's')} Verbrauch buchen</button>` : ''}${canPlanMat(o) ? `<button class="mini" data-action="mat-pos" data-id="${o.id}">${ic('pen')} Menge planen</button>` : ''}</div></div>
    ${pos.length ? `<div class="tbl"><table><thead><tr><th>Material</th><th class="num">Geplant</th><th class="num">Verbraucht</th><th>Anteil</th></tr></thead><tbody>${pos.map(m => { const ist = matIst(o.id, m.id), p = m.soll ? Math.round(ist / m.soll * 100) : null; return `<tr><td><b>${esc(m.name)}</b>${p != null && p > 100 ? ' <span class="pill crit">über Plan</span>' : ''}</td><td class="num">${m.soll ? fmtMenge(m.soll, m.einheit) : '<span class="muted">–</span>'}</td><td class="num">${fmtMenge(ist, m.einheit)}</td><td>${mbar(p)}</td></tr>`; }).join('')}</tbody></table></div>` : ''}
    ${bs.length ? `<div class="card-b" style="padding-top:0"><div class="mlog-h"><b>Buchungen</b>${canConfirm(o) && open > 1 ? `<button class="mini acc" data-action="mat-ok-all" data-oid="${o.id}">${ic('check')} Alle bestätigen</button>` : ''}</div><ul class="mlog">${bs.map(b => mlogLi(b)).join('')}</ul></div>` : ''}
  </section>`;
}

function pageKarte() {
  const L = S.layers, f = S.kf || 'aktiv';
  let os = myOrders();
  if (f === 'aktiv') os = os.filter(o => o.status !== 'abgerechnet'); else if (f !== 'alle') os = os.filter(o => o.status === f);
  const chip = (k, l, sw) => `<button class="chip${L[k] ? ' on' : ''}" data-action="layer" data-k="${k}" aria-pressed="${L[k]}"><span class="sw" style="--sw:${sw}"></span>${l}</button>`;
  return `
  <div class="page-h"><div><h1>Karte</h1><p>Aufträge, Trassen, Markierungen und jede Rückmeldung mit ihrem gemeldeten Standort.</p></div>
    <div class="row-acts"><button class="btn" data-action="kml-all">${ic('download', 's')} KML für Google Maps</button></div></div>
  <div class="tools">${chip('orders', 'Aufträge', 'var(--col-info)')}${chip('reports', 'Rückmeldungen', 'var(--col-good)')}${chip('trassen', 'Trassen', 'var(--cable)')}${chip('marker', 'Markierungen', '#0B7A71')}
    <select class="sel" id="kfSel" aria-label="Aufträge filtern">${opts([['aktiv', 'Ohne abgerechnete'], ['alle', 'Alle Aufträge']].concat(STAT_ORDER.map(s => [s, STAT[s]])), f)}</select></div>
  <section class="card">${mapBlock('karte', { oids: os.map(o => o.id), label: 'Lageplan aller Aufträge' })}
    <div class="map-foot">${legend()}<a class="linkbtn" id="gm-karte" href="${gmPlace(ll(0, 0))}" target="_blank" rel="noopener">${ic('ext', 's')} Diesen Ausschnitt in Google Maps öffnen</a></div></section>
  <section class="card"><div class="card-h"><div><h2>Aufträge auf der Karte</h2><p>${os.length} Aufträge</p></div></div><div class="tbl"><table><thead><tr><th>Auftrag</th><th>Status</th><th>Letzte Rückmeldung</th><th>Google Maps</th><th><span class="sr">Aktion</span></th></tr></thead><tbody>
    ${os.map(o => { const lr = lastReport(o.id); return `<tr><td><button class="rowbtn" data-action="go" data-p="auftrag" data-id="${o.id}">${esc(o.adresse)}</button><div class="mono muted">${esc(o.id)}</div></td><td><span class="spill ${o.status}">${STAT[o.status]}</span></td><td>${lr ? `${esc(fmtRel(lr.at))} ${vChip(lr)}` : '<span class="muted">–</span>'}</td><td><a class="mini" href="${gmPlace(o.loc)}" target="_blank" rel="noopener">${ic('ext')} Öffnen</a></td><td><button class="mini acc" data-action="map-show" data-id="${o.id}">${ic('pin')} Zeigen</button></td></tr>`; }).join('')}
  </tbody></table></div></section>`;
}

function pageAuftraege() {
  const f = S.af; let os = myOrders();
  const q = f.q.trim().toLowerCase();
  if (q) os = os.filter(o => (o.id + ' ' + o.adresse + ' ' + o.titel + ' ' + kunde(o.kunde).name).toLowerCase().includes(q));
  if (f.kd) os = os.filter(o => o.kunde === f.kd);
  if (f.an) os = os.filter(o => o.an === f.an);
  const base = os;
  if (f.st) os = os.filter(o => o.status === f.st);
  os = os.slice().sort(orderSort);
  const chip = (k, l) => `<button class="chip${f.st === k ? ' on' : ''}" data-action="af-st" data-k="${k}" aria-pressed="${f.st === k}">${l} <span class="muted">${k ? base.filter(o => o.status === k).length : base.length}</span></button>`;
  return `
  <div class="page-h"><div><h1>${isMon() ? 'Meine Aufträge' : isKunde() ? 'Baustellen' : 'Aufträge'}</h1><p>${isKunde() ? 'Alle Aufträge Ihrer Auftragnehmer mit Status, Nachweisen und Materialverbrauch.' : 'Nummer, Ort, Team, Geräte und alle Nachweise zu jedem Auftrag.'}</p></div>
    ${isAdmin() ? `<button class="btn primary" data-action="o-new">${ic('plus', 's')} Auftrag anlegen</button>` : ''}</div>
  <div class="tools"><label class="search">${ic('list', 's')}<span class="sr">Aufträge durchsuchen</span><input id="aq" name="aq" type="search" placeholder="z. B. Birkenweg oder 0412…" value="${esc(f.q)}" autocomplete="off" spellcheck="false"></label>
    ${isAdmin() ? `<select class="sel" id="akSel" aria-label="Auftraggeber">${opts([['', 'Alle Auftraggeber']].concat(S.kunden.map(k => [k.id, k.name])), f.kd)}</select>` : ''}${isKunde() ? `<select class="sel" id="anSel" aria-label="Auftragnehmer">${opts([['', 'Alle Auftragnehmer']].concat([...new Set(myOrders().map(o => o.an))].map(id => [id, firma(id).name])), f.an || '')}</select>` : ''}</div>
  <div class="chips">${chip('', 'Alle')}${STAT_ORDER.map(s => chip(s, STAT[s])).join('')}</div>
  ${os.length ? `<section class="card"><div class="tbl"><table><thead><tr><th>Nr.</th><th>Ort und Auftrag</th><th>${isKunde() ? 'Auftragnehmer' : 'Auftraggeber'}</th><th>Team</th><th>Status</th><th>Letzte Rückmeldung</th>${isMon() ? '' : '<th>Material</th>'}<th>Fällig</th></tr></thead><tbody>
    ${os.map(o => { const lr = lastReport(o.id); return `<tr class="click" data-action="go" data-p="auftrag" data-id="${o.id}"><td><button class="rowbtn mono" data-action="go" data-p="auftrag" data-id="${o.id}">${esc(o.id)}</button></td><td><b>${esc(o.adresse)}</b><div class="muted">${esc(o.titel)}</div></td><td>${isKunde() ? anTag(o) : esc(kunde(o.kunde).kurz)}</td><td><span class="av-stack">${o.team.map(id => av(pname(id), 'xs')).join('')}</span></td><td><span class="spill ${o.status}">${STAT[o.status]}</span></td><td>${lr ? `<div>${esc(fmtRel(lr.at))}</div>${vChip(lr)}` : '<span class="muted">–</span>'}</td>${isMon() ? '' : `<td>${mbar(matPct(o))}</td>`}<td class="num">${esc(fmtDay(o.faellig))}</td></tr>`; }).join('')}
  </tbody></table></div></section>` : `<div class="col-empty">Keine Aufträge für diesen Filter. Suche oder Status zurücksetzen.</div>`}`;
}

function pageAuftrag() {
  const o = order(S.route.id);
  if (!o || !canSee(o)) return `<a class="linkbtn" href="#auftraege" data-action="go" data-p="auftraege">${ic('back', 's')} Alle Aufträge</a><p class="empty">Diesen Auftrag gibt es nicht oder er ist für Ihre Rolle nicht sichtbar.</p>`;
  const reps = reportsOf(o.id), ts = S.trassen.filter(t => t.oid === o.id), ms = S.marker.filter(x => x.oid === o.id), ds = S.docs.filter(d => d.oid === o.id), inv = S.rechnungen.filter(x => x.oid === o.id);
  const showInv = isAdmin() || isKunde();
  const markLbl = isKunde() ? 'Hinweis setzen' : 'Markierung setzen';
  return `
  <a class="linkbtn" href="#auftraege" data-action="go" data-p="auftraege">${ic('back', 's')} ${isKunde() ? 'Alle Baustellen' : 'Alle Aufträge'}</a>
  <div class="page-h"><div style="min-width:0"><span class="eyebrow">${esc(o.id)} · ${esc(o.art)}</span><h1>${esc(o.adresse)}</h1><p>${esc(o.titel)} · ${isKunde() ? `Auftragnehmer: ${esc(firma(o.an).name)}` : esc(kunde(o.kunde).name)}</p></div>
    <div class="row-acts">${canReport(o) ? `<button class="btn primary" data-action="melden" data-id="${o.id}">${ic('pin', 's')} Rückmeldung</button>` : ''}<a class="btn" href="${gmNav(o.loc)}" target="_blank" rel="noopener">${ic('route', 's')} Route</a><button class="btn" data-action="pdf" data-id="${o.id}">${ic('download', 's')} Nachweis-PDF</button><button class="btn" data-action="kml" data-id="${o.id}">${ic('download', 's')} KML</button></div></div>
  <div class="row-acts">${steps(o)}${ownAdmin(o) ? `<label class="sr" for="oStat">Status ändern</label><select class="sel" id="oStat" data-id="${o.id}">${opts(STAT_ORDER.map(s => [s, STAT[s]]), o.status)}</select>` : ''}</div>
  <div class="two">
    <div class="stack">
      <section class="card">${mapBlock('auf', { oids: [o.id], focus: o.id, label: `Lageplan ${o.adresse}` }, 'md')}

const pruefPill = g => !g.pruef ? '<span class="pill muted">ohne Prüffrist</span>' : g.pruef < TODAY ? `<span class="pill crit">Prüfung überfällig</span>` : daysBetween(TODAY, g.pruef) <= 30 ? `<span class="pill warn">Prüfung bis ${fmtS(g.pruef)}</span>` : `<span class="pill good">geprüft bis ${fmtS(g.pruef)}</span>`;

function pagePruefen() {
  const all = S.reports.filter(r => flagsOf(r).length && canSee(order(r.oid)));
  const open = all.filter(r => !r.review), done = all.filter(r => r.review);
  const list = (S.pf === 'erledigt' ? done : open).sort((a, b) => b.at.localeCompare(a.at));
  const trs = S.pf === 'erledigt' ? S.trassen.filter(t => t.review && canSee(order(t.oid))) : trToReview();
  const last30 = S.reports.filter(r => daysBetween(r.at, TODAY) <= 30 && canSee(order(r.oid))), okPct = last30.length ? Math.round(last30.filter(r => verify(r).k === 'ok').length / last30.length * 100) : 100;
  const card = r => {
    const o = order(r.oid), fl = flagsOf(r);
    return `<section class="card"><div class="card-b">
      <div class="bc-top"><div style="min-width:0"><span class="eyebrow">${esc(o.id)} · ${esc(fmtRel(r.at))}</span><h2 style="font-size:17px">${esc(o.adresse)}</h2><p class="hint">${esc(ART[r.art][0])} von ${esc(pname(r.by))}</p></div><span class="row-acts">${vChip(r)}${verify(r).k === 'ok' && r.fotos.some(f => photoFlags(f, r).length) ? `<span class="pill warn">${ic('camera')}Foto auffällig</span>` : ''}</span></div>
      <ul class="flag-list">${fl.map(x => `<li>${ic('alert', 's')}<span>${esc(x)}</span></li>`).join('')}</ul>
      <p class="tl-text">${esc(r.text)}</p>
      ${r.fotos.length ? `<div class="thumbs">${r.fotos.map(f => thumb(f, r)).join('')}</div>` : ''}
      <div class="tl-meta">${r.loc && r.loc.src !== 'manuell' ? `<a class="mini" href="${gmPlace(r.loc)}" target="_blank" rel="noopener">${ic('ext')} Gemeldeter Ort</a>` : ''}<a class="mini" href="${gmPlace(o.loc)}" target="_blank" rel="noopener">${ic('ext')} Auftragsort</a>${r.loc && r.loc.src !== 'manuell' ? `<a class="mini" href="${gmRoute([o.loc, r.loc])}" target="_blank" rel="noopener">${ic('route')} Abstand ansehen</a>` : ''}</div>
      ${r.review ? `<p class="review">${ic('check', 's')} Geprüft von ${esc(pname(r.review.by))}, ${esc(fmtRel(r.review.at))}${r.review.note ? `: „${esc(r.review.note)}“` : ''}</p><div class="row-acts"><button class="mini" data-action="rv-undo" data-id="${r.id}">${ic('undo')} Prüfung zurücknehmen</button></div>`
        : `<div class="row-acts"><button class="btn good" data-action="rv-open" data-id="${r.id}">${ic('check', 's')} Als geprüft markieren</button><button class="btn" data-action="rq-open" data-id="${r.id}">${ic('msg', 's')} Rückfrage an ${esc(pname(r.by).split(' ')[0])}</button><a class="btn" href="#auftrag-${o.id}" data-action="go" data-p="auftrag" data-id="${o.id}">Auftrag öffnen</a></div>`}
    </div></section>`;
  };
  const trCard = t => {
    const o = order(t.oid);
    return `<section class="card"><div class="card-b">
      <div class="bc-top"><div style="min-width:0"><span class="eyebrow">${esc(o.id)} · ${esc(fmtRel(t.at))}</span><h2 style="font-size:17px">${esc(t.name)}</h2><p class="hint">Trasse von ${esc(pname(t.by))} · ${fmtLen(pathLen(t.pts))}</p></div><span class="pill warn">${ic('target')}Einmessung</span></div>
      <ul class="flag-list">${trFlags(t).map(x => `<li>${ic('alert', 's')}<span>${esc(x)}</span></li>`).join('')}</ul>
      <div class="tl-meta">${t.pts.map((p, i) => `<span class="mono">P${i + 1} ${p.acc == null ? 'im Plan' : esc(fmtAcc(p.acc))}</span>`).join('')}</div>
      ${t.review ? `<p class="review">${ic('check', 's')} Geprüft von ${esc(pname(t.review.by))}, ${esc(fmtRel(t.review.at))}</p>` : `<div class="row-acts"><button class="btn good" data-action="tr-ok" data-id="${t.id}">${ic('check', 's')} Trotzdem akzeptieren</button><button class="btn" data-action="tr-ask" data-id="${t.id}">${ic('msg', 's')} Nachmessen lassen</button><a class="btn" href="#auftrag-${o.id}" data-action="go" data-p="auftrag" data-id="${o.id}">Auftrag öffnen</a></div>`}
    </div></section>`;
  };

  <div class="page-h"><div><h1>Rückmeldungen prüfen</h1><p>Jeder Standort wird beim Senden automatisch mit dem Auftragsort verglichen. Hier landet alles, was nicht eindeutig vor Ort erfasst wurde.</p></div></div>
  <div class="chips"><button class="chip${S.pf !== 'erledigt' ? ' on' : ''}" data-action="pf" data-k="offen" aria-pressed="${S.pf !== 'erledigt'}">Offen <span class="muted">${open.length}</span></button><button class="chip${S.pf === 'erledigt' ? ' on' : ''}" data-action="pf" data-k="erledigt" aria-pressed="${S.pf === 'erledigt'}">Geprüft <span class="muted">${done.length}</span></button></div>

    <div class="stack">
      <section class="card"><div class="card-h"><div><h2>So prüft GeoAuftrag</h2><p>Letzte 30 Tage: ${okPct}&nbsp;% der Rückmeldungen vor Ort bestätigt</p></div></div><div class="card-b">
        ${rule('var(--col-good)', 'target', 'GPS automatisch beim Senden', 'Der Standort wird vom Handy gelesen und lässt sich nicht von Hand ändern.')}
        ${rule('var(--col-warn)', 'shield', 'Abgleich mit dem Prüfradius', 'Jeder Auftrag hat einen Radius. Liegt die Meldung außerhalb, landet sie hier.')}
        ${rule('var(--col-info)', 'camera', 'Fotostempel und Foto-GPS', 'Zeit, Koordinaten und Auftragsnummer werden ins Foto geschrieben. Alte Fotos oder Fotos von woanders fallen auf.')}
        ${rule('var(--accent)', 'route', 'Zentimeter-Einmessung', 'Fordert ein Auftrag ±10 cm oder ±3 cm, prüft die App jeden Trassenpunkt. Das geht nur mit RTK-Empfänger am Handy.')}
        ${rule('var(--col-man)', 'pen', 'Manueller Standort nur mit Grund', 'Ohne GPS-Empfang darf der Monteur den Auftragsort übernehmen. Das wird immer orange markiert.')}
      </div></section>
    </div>
  </div>`;
}

  const vis = S.rechnungen.filter(x => canSee(order(x.oid))).sort((a, b) => b.datum.localeCompare(a.datum));
  const open = vis.filter(x => x.status === 'offen'), over = open.filter(x => x.faellig < TODAY), paid = vis.filter(x => x.status === 'bezahlt' && x.bezahlt && daysBetween(x.bezahlt, TODAY) <= 30);
  const todo = isAdmin() ? myOrders().filter(o => o.status === 'erledigt') : [];
  const sum = l => l.reduce((s, x) => s + brutto(x), 0);
  return `
  <div class="page-h"><div><h1>Rechnungen</h1><p>${isAdmin() ? 'Rechnungen zu jedem Auftrag erfassen, PDF anhängen, Zahlungseingang festhalten.' : 'Rechnungen zu Ihren Aufträgen.'}</p></div>
    ${isAdmin() ? `<button class="btn primary" data-action="re-new">${ic('plus', 's')} Rechnung erfassen</button>` : ''}</div>
  <div class="kpi-row">
    <div class="kpi"><div class="kpi-l">Offen</div><div class="kpi-v" style="font-size:24px">${EUR.format(sum(open))}</div><div class="kpi-s">${open.length} Rechnung${open.length === 1 ? '' : 'en'}, brutto</div></div>
    <div class="kpi"><div class="kpi-l">Überfällig</div><div class="kpi-v${over.length ? ' crit' : ''}" style="font-size:24px">${EUR.format(sum(over))}</div><div class="kpi-s">${over.length} Rechnung${over.length === 1 ? '' : 'en'}</div></div>
    <div class="kpi"><div class="kpi-l">Bezahlt, 30 Tage</div><div class="kpi-v good" style="font-size:24px">${EUR.format(sum(paid))}</div><div class="kpi-s">${paid.length} Zahlungseingang${paid.length === 1 ? '' : 'e'}</div></div>
    <div class="kpi"><div class="kpi-l">Fertig, nicht abgerechnet</div><div class="kpi-v${todo.length ? ' warn' : ''}">${isAdmin() ? todo.length : '–'}</div><div class="kpi-s">Aufträge</div></div>
  </div>
  ${todo.length ? `<section class="card"><div class="card-h"><div><h2>Fertig gemeldet, bereit zur Abrechnung</h2><p>Erst prüfen, dann Rechnung erfassen</p></div></div><ul class="files">${todo.map(o => { const rv = S.reports.filter(r => r.oid === o.id && needsReview(r)).length; return `<li><span class="spill erledigt">Fertig</span><div class="fn"><b>${esc(o.adresse)}</b><small><span class="mono">${esc(o.id)}</span> · ${esc(o.titel)} · ${esc(kunde(o.kunde).kurz)}</small></div>${rv ? `<a class="pill crit" href="#pruefen" data-action="go" data-p="pruefen">${rv} zu prüfen</a>` : '<span class="pill good">Nachweis geprüft</span>'}<button class="mini acc" data-action="re-new" data-id="${o.id}">${ic('plus')} Rechnung</button></li>`; }).join('')}</ul></section>` : ''}
  <section class="card"><div class="tbl"><table><thead><tr><th>Nr.</th><th>Auftrag</th><th>Auftraggeber</th><th>Datum</th><th>Fällig</th><th class="num">Netto</th><th class="num">Brutto</th><th>Status</th><th><span class="sr">Aktionen</span></th></tr></thead><tbody>
    ${vis.map(x => { const o = order(x.oid), st = invState(x); return `<tr><td class="mono">${esc(x.id)}</td><td><button class="rowbtn" data-action="go" data-p="auftrag" data-id="${o.id}">${esc(o.adresse)}</button><div class="muted">${esc(x.titel)}</div></td><td>${esc(kunde(o.kunde).kurz)}</td><td class="num">${fmt(x.datum)}</td><td class="num">${fmt(x.faellig)}</td><td class="num">${EUR.format(x.netto)}</td><td class="num">${EUR.format(brutto(x))}</td><td><span class="pill ${st[0]}">${st[1]}</span>${x.bezahlt ? `<div class="muted" style="font-size:12px">am ${fmt(x.bezahlt)}</div>` : ''}</td><td><span class="row-acts">${x.datei ? `<button class="mini" data-action="re-file" data-id="${x.id}">${ic('download')} PDF</button>` : ''}${isAdmin() ? (x.status === 'offen' ? `<button class="mini" data-action="re-paid" data-id="${x.id}">${ic('check')} Bezahlt</button>` : `<button class="mini" data-action="re-unpaid" data-id="${x.id}">${ic('undo')} Wieder offen</button>`) : ''}</span></td></tr>`; }).join('') || '<tr><td colspan="9" class="empty">Noch keine Rechnungen.</td></tr>'}
  </tbody>${vis.length ? `<tfoot><tr><td colspan="5">Summe</td><td class="num">${EUR.format(vis.reduce((s, x) => s + x.netto, 0))}</td><td class="num">${EUR.format(sum(vis))}</td><td colspan="2"></td></tr></tfoot>` : ''}</table></div></section>`;

function pageTeam() {
  const mons = S.people.filter(p => p.rolle === 'monteur' && p.firma === me().firma);
  const week = addDays(TODAY, -6);
  const pc = p => {
    const act = S.orders.filter(o => o.team.includes(p.id) && isActive(o));
    const lr = S.reports.filter(r => r.by === p.id).sort((a, b) => b.at.localeCompare(a.at))[0];
    const std = S.reports.filter(r => r.at.slice(0, 10) >= week && r.team.includes(p.id) && r.std).reduce((s, r) => s + r.std, 0);
    return `<div class="bcard"><div class="bc-top"><span class="who">${av(p.name)}<span style="min-width:0"><b style="display:block">${esc(p.name)}</b><span class="bc-s">${esc(p.fach)}</span></span></span><span class="pill muted">${NF2.format(std)}&nbsp;Std. / 7 Tage</span></div>
      <div class="row-acts">${act.length ? act.map(o => `<a class="mini" href="#auftrag-${o.id}" data-action="go" data-p="auftrag" data-id="${o.id}"><span class="mono">${esc(o.id.slice(-4))}</span> ${esc(o.adresse)}</a>`).join('') : '<span class="hint">Kein offener Auftrag</span>'}</div>
      ${lr ? `<div class="tl-meta"><span>Zuletzt gemeldet ${esc(fmtRel(lr.at))}, ${esc(order(lr.oid).adresse)}</span>${vChip(lr)}</div>` : '<div class="hint">Noch keine Rückmeldung</div>'}</div>`;
  };
  return `
  <div class="page-h"><div><h1>Team und Geräte</h1><p>Wer wo im Einsatz ist und welche Geräte mit welcher Seriennummer draußen sind.</p></div></div>
  <div class="a-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px">${mons.map(pc).join('')}</div>
  <section class="card"><div class="card-h"><div><h2>Geräte</h2><p>${S.geraete.length} Geräte, ${S.geraete.filter(g => g.pruef && g.pruef < TODAY).length} mit überfälliger Prüfung</p></div></div><div class="tbl"><table><thead><tr><th>Gerät</th><th>Seriennummer</th><th>Bereich</th><th>Im Einsatz</th><th>Prüfung</th></tr></thead><tbody>
    ${S.geraete.map(g => { const os = S.orders.filter(o => isActive(o) && o.geraete.includes(g.id)); return `<tr><td><b>${esc(g.name)}</b></td><td class="mono">${esc(g.sn)}</td><td>${esc(g.kat)}</td><td>${os.length ? os.map(o => `<a class="mini" href="#auftrag-${o.id}" data-action="go" data-p="auftrag" data-id="${o.id}">${esc(o.adresse)}</a>`).join(' ') : '<span class="muted">im Lager</span>'}</td><td>${pruefPill(g)}</td></tr>`; }).join('')}
  </tbody></table></div></section>`;
}

/* ---------- Dialoge: Grundlagen ---------- */
let LASTF = null, SDIRTY = false;
const finePointer = () => { try { return matchMedia('(pointer: fine)').matches; } catch (e) { return false; } };
function openSheet(html, wide, noAutofocus) {
  if ($('overlay').hidden) LASTF = document.activeElement;
  SDIRTY = false;
  $('sheet').className = 'sheet' + (wide ? ' wide' : ''); $('sheet').innerHTML = html; $('overlay').hidden = false;
  decorateFields($('sheet'));
  const f = !noAutofocus && finePointer() ? $('sheet').querySelector('input:not([type=checkbox]):not([type=file]):not([type=radio]):not([disabled]), textarea:not([disabled]), select:not([disabled])') : null;
  setTimeout(() => { try { (f || $('sheet')).focus(); } catch (e) {} }, 30);
}
function closeSheet() {
  const was = !$('overlay').hidden;
  $('overlay').hidden = true; $('sheet').innerHTML = ''; SDIRTY = false; MEL = null;
  if (was && LASTF && LASTF.isConnected) { try { LASTF.focus(); } catch (e) {} }
  LASTF = null;
}
function dismissSheet() {
  if (!SDIRTY) { closeSheet(); return; }
