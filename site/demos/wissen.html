}
function upFail(msg, title) { UP = { stage: 'pick', error: msg, errorTitle: title }; upRender(); announce(msg); const dz = $('#dropZone'); dz && dz.focus(); }
async function upHandle(file, isSample) {
  const ext = (file.name.match(/\.([a-z0-9]+)$/i) || [, ''])[1].toLowerCase();
  if (ext === 'doc') return upFail('Alte Word-Dateien (.doc) bitte in Word unter „Speichern unter“ als DOCX speichern und erneut hochladen.', 'Dateityp nicht unterstützt');
  if (!['pdf', 'docx', 'txt', 'md', 'markdown'].includes(ext)) return upFail(`Dateien vom Typ „${ext ? '.' + ext : 'unbekannt'}“ werden nicht unterstützt. Möglich sind PDF, DOCX, TXT und MD.`, 'Dateityp nicht unterstützt');
  if (file.size === 0) return upFail('Die Datei ist leer.', 'Datei nicht übernommen');
  if (file.size > MAX_BYTES) return upFail(`Die Datei ist ${bytes(file.size)} groß. Erlaubt sind höchstens 30 MB.`, 'Datei zu groß');
  const token = {}; UP = { stage: 'parsing', file, done: 0, total: 0, token }; upRender();
  let parsed;
  try {
    const buf = await file.arrayBuffer();
    if (ext === 'pdf') parsed = await parsePdf(buf, (d, t) => { if (UP && UP.token === token) { UP.done = d; UP.total = t; upRender(); } });
    else if (ext === 'docx') parsed = await parseDocx(buf);
    else parsed = parseText(decodeText(buf), ext !== 'txt');
  } catch (e) {
    if (!UP || UP.token !== token) return;
    return upFail(e instanceof UserError ? e.message : 'Die Datei konnte nicht gelesen werden. Vermutlich ist sie beschädigt oder hat ein unerwartetes Format.', 'Datei nicht übernommen');
  }
  if (!UP || UP.token !== token || !dlg.open) return;
  let chars = 0, truncated = false;
  for (const s of parsed.sections) { s.x = s.x.filter(p => { if (chars > 400000) { truncated = true; return false; } chars += p.t.length; return true; }); }
  parsed.sections = parsed.sections.filter(s => s.x.length || s.h);
  const words = parsed.sections.reduce((n, s) => n + s.x.reduce((m, p) => m + p.t.split(/\s+/).filter(Boolean).length, 0), 0);
  if (words < 3) return upFail(ext === 'pdf' ? 'In dieser PDF steht kein auslesbarer Text, vermutlich ist sie ein Scan. In der echten Lösung liest eine Texterkennung (OCR) solche Dateien.' : 'In der Datei wurde kein Text gefunden.', 'Kein Text gefunden');
  let keepOrig = file.size <= 3 * 1048576;
  try { if (navigator.storage && navigator.storage.estimate) { const est = await navigator.storage.estimate(); if (est.quota && est.quota - (est.usage || 0) < file.size * 4) keepOrig = false; } } catch (e) { /* unbekannt */ }
  const base = file.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').replace(/\s+/g, ' ').trim();
  const guessTitle = parsed.title || (parsed.sections[0] && parsed.sections[0].h && parsed.sections[0].h.length < 90 ? parsed.sections[0].h : base);
  const gt = fold(guessTitle + ' ' + base);
  const guessDept = /gefahr|arbeitssich|maschin|halle|schicht/.test(gt) ? 'prod' : /urlaub|personal|gehalt/.test(gt) ? 'pers' : /it|passwort/.test(gt) ? 'it' : /pruf|qualit|reklam/.test(gt) ? 'qm' : 'gf';
  const guessType = /merkblatt/.test(gt) ? 'Merkblatt' : /anweisung/.test(gt) ? 'Arbeitsanweisung' : /richtlinie/.test(gt) ? 'Richtlinie' : /checkliste/.test(gt) ? 'Checkliste' : 'Sonstiges';
  if (parsed.sections[0] && parsed.sections[0].h === guessTitle && parsed.sections[0].x.length) parsed.sections[0].h = '';
  UP = { stage: 'review', file, parsed, words, truncated, keepOrig, ext, isSample, meta: { title: guessTitle, dept: guessDept, type: guessType, tags: isSample ? ['Gefahrstoffe', 'Arbeitssicherheit', 'Halle 1'] : [] } };
  upRender(); announce('Text ausgelesen. Bitte Titel und Kategorie prüfen.');
}

  reset: () => openDlg({ title: 'Demo zurücksetzen?', body: '<p style="margin:0">Alle Beispieldaten werden neu geladen. Hochgeladene Dokumente, Wiki-Änderungen und gestellte Fragen gehen dabei verloren.</p>', foot: `<button type="button" class="btn" data-act="dlg-close">Abbrechen</button><button type="button" class="btn primary" data-act="reset-do">Demo zurücksetzen</button>` }),
  'reset-do': () => { store.del(); idbClear(); ORIG.clear(); S = seed(); save(); Object.assign(LIB, { dept: '', type: '', tag: '', text: '', sel: null }); WO.text = WO.area = ''; WER.text = WER.kind = ''; closeDlg(); go('#/start'); toast('Demo zurückgesetzt.'); },
  ask: el => go('#/fragen?q=' + encodeURIComponent(el.dataset.q)),
  refocus: () => { const i = $('#q-page'); if (i) { i.focus(); i.select(); } },
  cite: (el, e) => { e.preventDefault(); const t = $('#src-' + el.dataset.n); if (t) { $$('.src.on').forEach(x => x.classList.remove('on')); t.classList.add('on'); t.scrollIntoView({ block: 'nearest', behavior: reduceMotion() ? 'auto' : 'smooth' }); const a = t.querySelector('h3 a, h3 button'); a && a.focus({ preventScroll: true }); } },
  helpful: el => {
    const q = ANSWER && ANSWER.q; if (!q) return;
    const box = el.closest('.helpful');
    if (el.dataset.v === '1') { box.innerHTML = `<span>${ico('check', 'sm')}</span><span>Danke für die Rückmeldung.</span>`; announce('Danke für die Rückmeldung.'); }
    else {
      const l = S.log.find(x => fold(x.q) === fold(q));
      if (l) { l.answered = false; l.owner = l.owner || guessOwner(q); l.reason = 'Antwort war nicht hilfreich'; save(); }
      box.innerHTML = `<span>Danke. Die Frage steht jetzt bei den offenen Fragen, ${esc(person(l ? l.owner : 'p2').name)} ergänzt die Antwort.</span>`;
      announce('Frage an die Redaktion übergeben.');
    }
  },
  'more-filter': el => { MORE_FILTER = el.dataset.k; if (ANSWER) { const y = window.scrollY; $('#answerSlot').innerHTML = resultsHtml(ANSWER); window.scrollTo(0, y); const b = $(`[data-act="more-filter"][data-k="${MORE_FILTER}"]`); b && b.focus(); } },
  person: el => personDlg(el.dataset.id),
  upload: () => openUpload(),
  'up-sample': () => upHandle(makeSamplePdf(), true),
  'up-again': () => { UP = { stage: 'pick' }; upRender(); },
  'lib-f': el => { const k = el.dataset.k, v = el.dataset.v; LIB[k] = LIB[k] === v && v ? '' : v; render(true); const b = $(`[data-act="lib-f"][data-k="${k}"][data-v="${CSS.escape(LIB[k] || v)}"]`); b && b.focus(); },
  'lib-clear': () => { Object.assign(LIB, { dept: '', type: '', tag: '', text: '' }); render(true); },
  'lib-tag': (el, e) => { e.preventDefault(); Object.assign(LIB, { dept: '', type: '', tag: el.dataset.v, text: '' }); go('#/bibliothek'); },
  'doc-row': el => {
    const wide = matchMedia('(min-width: 1241px)').matches;
    if (wide) { LIB.sel = el.dataset.id; render(true); const b = $(`.drow[data-id="${CSS.escape(LIB.sel)}"]`); b && b.focus(); }
    else go('#/dok/' + el.dataset.id);
  },
  'doc-meta': el => guard('Bearbeiten', () => metaDlg(el.dataset.id)),
  'doc-del': el => guard('Löschen', () => {
    const id = el.dataset.id; const d = docById(id);
    if (d.uploaded) { const i = S.userDocs.findIndex(x => x.id === id); const [removed] = S.userDocs.splice(i, 1); save(); go('#/bibliothek'); toast(`„${d.title}“ gelöscht.`, { label: 'Rückgängig', fn: () => { S.userDocs.splice(i, 0, removed); save(); render(true); toast('Wiederhergestellt.'); }, expire: () => { if (!S.userDocs.some(x => x.id === id)) { idbDel(id); ORIG.delete(id); } } }); }
    else { S.docMeta[id] = { ...(S.docMeta[id] || {}), deleted: true }; save(); go('#/bibliothek'); toast(`„${d.title}“ gelöscht.`, { label: 'Rückgängig', fn: () => { S.docMeta[id].deleted = false; save(); render(true); toast('Wiederhergestellt.'); } }); }
  }),
  orig: async el => {
    const id = el.dataset.id; let blob = ORIG.get(id);
    if (!blob) { try { blob = await idbGet(id); } catch (e) { blob = null; } }
    if (!blob) return toast('Für dieses Dokument ist nur der Text gespeichert.');
    const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener';
    if (!/pdf|text/.test(blob.type || '')) a.download = blob.name || 'dokument';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 60000);
  },
  print: () => window.print(),
  'toggle-marks': () => { HIDE_MARKS = !HIDE_MARKS; render(true); const b = $('[data-act="toggle-marks"]'); b && b.focus(); },
  toc: (el, e) => { e.preventDefault(); const t = $('#s-' + el.dataset.si); t && t.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth' }); },
  'wiki-edit': el => guard('Bearbeiten', () => go(`#/wiki/${el.dataset.slug}/bearbeiten`)),
  'wiki-new': () => guard('Seiten anlegen', () => go('#/wiki/neu')),
  'wiki-versions': el => versionsDlg(el.dataset.slug),
  'ver-sel': el => { versionsDlg(el.dataset.slug, Number(el.dataset.i)); const b = $(`[data-act="ver-sel"][data-i="${el.dataset.i}"]`, dlg); b && b.focus(); },
  'ver-restore': el => guard('Wiederherstellen', () => {
    const w = wikiPage(el.dataset.slug); const i = Number(el.dataset.i); const v = w.versions[i];
    w.versions.push({ ts: new Date().toISOString(), by: me().id, note: `Version ${i + 1} wiederhergestellt`, title: v.title, body: v.body });
    save(); closeDlg(); render(true); toast(`Version ${i + 1} wiederhergestellt. Sie ist jetzt Version ${w.versions.length}.`);
  }),
  'answer-q': el => guard('Antworten anlegen', () => go(`#/wiki/neu?frage=${el.dataset.id}`)),
  md: el => {
    const ta = $('#mdsrc'); if (!ta) return;
    const s = ta.selectionStart, e = ta.selectionEnd, sel = ta.value.slice(s, e);
    const lineStart = ta.value.lastIndexOf('\n', s - 1) + 1;
    let ins, cs, ce;
    switch (el.dataset.md) {
      case 'bold': ins = `**${sel || 'fett'}**`; cs = s + 2; ce = cs + (sel || 'fett').length; ta.setRangeText(ins, s, e); break;
      case 'link': ins = `[${sel || 'Text'}](https://)`; ta.setRangeText(ins, s, e); cs = s + ins.length - 9; ce = s + ins.length - 1; break;
      case 'h2': ta.setRangeText('## ', lineStart, lineStart); cs = s + 3; ce = e + 3; break;
      case 'ul': { const block = ta.value.slice(lineStart, e); const rep = block.split('\n').map(l => l.startsWith('- ') ? l : '- ' + l).join('\n'); ta.setRangeText(rep, lineStart, e); cs = lineStart; ce = lineStart + rep.length; break; }
    }
    ta.focus(); ta.setSelectionRange(cs, ce); ta.dispatchEvent(new Event('input'));
  },
  'md-pick': el => {
    const ta = $('#mdsrc'); const pos = [ta.selectionStart, ta.selectionEnd]; const k = el.dataset.k;
    const items = k === 'doc' ? allDocs().map(d => [d.id, d.title, d.type]) : k === 'wiki' ? S.wiki.map(w => [w.slug, wcur(w).title, 'Wiki-Seite']) : PEOPLE_SEED.map(p => [p.id, p.name, p.role]);
    PICK = { k, pos };
    openDlg({ title: k === 'doc' ? 'Dokument verlinken' : k === 'wiki' ? 'Wiki-Seite verlinken' : 'Person verlinken', body: `<div class="field"><label for="pickQ">Suchen</label><input class="input" id="pickQ" type="search" data-input="pick" autocomplete="off" autofocus></div><ul class="list" id="pickList">${items.map(([id, t, m]) => `<li data-f="${esc(fold(t + ' ' + m))}"><button type="button" class="row" data-act="pick" data-id="${esc(id)}" data-t="${esc(t)}"><span class="row-main"><span class="row-title">${esc(t)}</span><span class="row-meta"><span>${esc(m)}</span></span></span></button></li>`).join('')}</ul>`, onClose: () => { const t = $('#mdsrc'); if (t) { t.focus(); t.setSelectionRange(PICK.pos[0], PICK.pos[1]); } } });
  },
  pick: el => {
    const ta = $('#mdsrc'); const k = PICK.k;
    const ins = k === 'person' ? `[[person:${el.dataset.id}]]` : `[[${k}:${el.dataset.id}|${el.dataset.t}]]`;
    ta.setRangeText(ins, PICK.pos[0], PICK.pos[1], 'end'); PICK.pos = [ta.selectionStart, ta.selectionEnd];
    ta.dispatchEvent(new Event('input')); closeDlg();
  },
  'wo-area': el => { WO.area = el.dataset.v; render(true); const b = $(`[data-act="wo-area"][data-v="${WO.area}"]`); b && b.focus(); },
  copy: async el => { const v = el.dataset.v; let ok = false; try { await navigator.clipboard.writeText(v); ok = true; } catch (e) { ok = false; } toast(ok ? 'Pfad kopiert.' : `Kopieren nicht möglich. Pfad: ${v}`); },
  'where-edit': el => guard('Bearbeiten', () => whereDlg(el.dataset.id)),
  'where-del': el => { const id = el.dataset.id; const i = S.where.findIndex(x => x.id === id); const [o] = S.where.splice(i, 1); save(); closeDlg(); render(true); toast(`„${o.topic}“ entfernt.`, { label: 'Rückgängig', fn: () => { S.where.splice(i, 0, o); save(); render(true); } }); },
  'who-edit': el => guard('Zuständigkeiten pflegen', () => whoDlg(el.dataset.id)),
  'who-del': el => { const id = el.dataset.id; const i = S.who.findIndex(x => x.id === id); const [z] = S.who.splice(i, 1); save(); closeDlg(); render(true); toast(`„${z.topic}“ entfernt.`, { label: 'Rückgängig', fn: () => { S.who.splice(i, 0, z); save(); render(true); } }); },
  'wer-mode': el => { WER.mode = el.dataset.v; render(true); const b = $(`[data-act="wer-mode"][data-v="${WER.mode}"]`); b && b.focus(); },
  'wer-kind': el => { WER.kind = el.dataset.v; render(true); const b = $(`[data-act="wer-kind"][data-v="${WER.kind}"]`); b && b.focus(); },
  nav: el => go(el.dataset.href)
};
let PICK = null;
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'A' && !['cite', 'toc', 'lib-tag'].includes(el.dataset.act)) { if (el.dataset.act === 'dlg-go') closeDlg(); return; }
  fn(el, e);
});
const SUBMIT = {
  ask: f => { const q = f.q.value.trim(); if (!q) { f.q.focus(); return; } MORE_FILTER = ''; go('#/fragen?q=' + encodeURIComponent(q)); },
  topsearch: f => { const q = f.q.value.trim(); if (!q) return; MORE_FILTER = ''; f.q.value = ''; f.q.blur(); go('#/fragen?q=' + encodeURIComponent(q)); },
  upload: f => { if (UP && UP.stage === 'review') upSave(f); },
  'wiki-save': f => {
    const v = readForm(f);
    if (!v.title) { const e = $('#wTitleErr'); e.textContent = 'Bitte einen Titel eingeben.'; e.hidden = false; $('#wTitle').setAttribute('aria-invalid', 'true'); $('#wTitle').focus(); return; }
    let slug = f.dataset.slug; const now = new Date().toISOString();
    if (slug) { const w = wikiPage(slug); const cur = wcur(w); if (cur.body === v.body && cur.title === v.title) { go(`#/wiki/${slug}`); toast('Keine Änderungen.'); return; } w.versions.push({ ts: now, by: me().id, note: v.note || 'Inhalt geändert', title: v.title, body: v.body }); }
    else { slug = slugify(v.title); let n = 2; while (wikiPage(slug)) slug = slugify(v.title) + '-' + n++; S.wiki.push({ slug, versions: [{ ts: now, by: me().id, note: v.note || 'Seite angelegt', title: v.title, body: v.body }] }); }
    if (EDIT_FROM_Q) { const l = S.log.find(x => x.id === EDIT_FROM_Q); if (l) { l.answered = true; l.page = slug; } EDIT_FROM_Q = null; }
    save(); go(`#/wiki/${slug}`); toast('Gespeichert. Die Seite ist ab sofort durchsuchbar.');
  },
  'who-save': f => {
    const v = readForm(f); let bad = false;
    setErr(f, 'zTopic', v.topic ? '' : 'Bitte ein Thema eingeben.'); if (!v.topic) bad = true;
    setErr(f, 'zDeputy', v.deputy === v.person ? 'Die Vertretung muss eine andere Person sein.' : ''); if (v.deputy === v.person) bad = true;
    if (bad) { (f.querySelector('[aria-invalid="true"]') || f).focus(); return; }
    const id = f.dataset.id;
    if (id) Object.assign(S.who.find(x => x.id === id), v); else S.who.unshift({ id: 'z' + Date.now().toString(36), ...v });
    save(); closeDlg(); WER.mode = 'list'; render(true); toast(id ? 'Zuständigkeit gespeichert.' : 'Zuständigkeit hinzugefügt. Die Suche kennt sie ab sofort.');
  },
  'where-save': f => {
    const v = readForm(f); let bad = false;
    setErr(f, 'oTopic', v.topic ? '' : 'Bitte ein Thema eingeben.'); if (!v.topic) bad = true;
    setErr(f, 'oPlace', v.place ? '' : 'Bitte den Ablageort eingeben.'); if (!v.place) bad = true;
    if (bad) { (f.querySelector('[aria-invalid="true"]') || f).focus(); return; }
    const id = f.dataset.id;
    if (id) Object.assign(S.where.find(x => x.id === id), v); else S.where.push({ id: 'o' + Date.now().toString(36), ...v });
    save(); closeDlg(); render(true); toast(id ? 'Eintrag gespeichert.' : 'Eintrag hinzugefügt.');
  },
  'meta-save': f => {
    const v = readForm(f);
    if (!v.title) { setErr(f, 'mTitle', 'Bitte einen Titel eingeben.'); f.querySelector('#mTitle').focus(); return; }
    const id = f.dataset.id; const patch = { title: v.title, dept: v.dept, type: v.type, version: v.version || '1.0', tags: v.tags.split(',').map(t => t.trim()).filter(Boolean).slice(0, 8), updated: new Date().toISOString() };
    const u = S.userDocs.find(x => x.id === id);
    if (u) Object.assign(u, patch); else S.docMeta[id] = { ...(S.docMeta[id] || {}), ...patch };
    save(); closeDlg(); render(true); toast('Eigenschaften gespeichert.');
  }
};
document.addEventListener('submit', e => { const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault(); const fn = SUBMIT[f.dataset.form]; fn && fn(f); });
let inT = null;
document.addEventListener('input', e => {
  const el = e.target; const k = el.dataset && el.dataset.input; if (!k) return;
  if (k === 'pick') { const f = fold(el.value); $$('#pickList li').forEach(li => { li.hidden = f && !li.dataset.f.includes(f); }); return; }
  clearTimeout(inT);
  inT = setTimeout(() => {
    const pos = el.selectionStart;
    if (k === 'lib-text') LIB.text = el.value; if (k === 'wo-text') WO.text = el.value; if (k === 'wer-text') WER.text = el.value;
    render(true);
    const n = $('#' + el.id); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (er) { /* search */ } }
    if (k === 'lib-text') announce($('#libCount') ? $('#libCount').textContent : '');
  }, 160);
});
document.addEventListener('change', e => {
  const el = e.target; const k = el.dataset && el.dataset.change; if (!k) return;
  if (k === 'lib-sel') { LIB[el.dataset.k] = el.value; render(true); const n = $('#' + el.id); n && n.focus(); }
  if (k === 'lib-sort') { LIB.sort = el.value; render(true); $('#libSort').focus(); }
  if (k === 'up-file') { const file = el.files && el.files[0]; if (file) upHandle(file); }
});
document.addEventListener('keydown', e => {
  if (e.key === '/' && !e.metaKey && !e.ctrlKey && !/input|textarea|select/i.test(document.activeElement.tagName) && !dlg.open) {
    const i = $('#q-page') || $('#q-home') || $('#topQ'); if (i && i.offsetParent !== null) { e.preventDefault(); i.focus(); }
    else if ($('#topQ').offsetParent) { e.preventDefault(); $('#topQ').focus(); }
  }
});
addEventListener('hashchange', () => { const R = route(); if (R.name !== 'fragen') MORE_FILTER = ''; if (dlg.open) closeDlg(); render(); });
addEventListener('scroll', () => { $('#top').classList.toggle('scrolled', window.scrollY > 4); }, { passive: true });
addEventListener('storage', e => { if (e.key === KEY) { const n = store.get(); if (n) { S = n; IDX.dirty = true; render(true); } } });

if (!location.hash) history.replaceState(null, '', '#/start');
save();
render();
</script>
</body>
