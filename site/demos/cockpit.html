<title>Cockpit</title>

<body>
<style>
@font-face { font-family: "Figtree"; font-style: normal; font-weight: 300 900; font-display: swap; src: url(shared-files/figtree-latin-wght-normal.woff2) format("woff2-variations"); }
@font-face { font-family: "Geist"; font-style: normal; font-weight: 100 900; font-display: swap; src: url(shared-files/geist-latin-wght-normal.woff2) format("woff2-variations"); }
@font-face { font-family: "JetBrains Mono"; font-style: normal; font-weight: 100 800; font-display: swap; src: url(shared-files/jetbrains-mono-latin-wght-normal.woff2) format("woff2-variations"); }
</style>
<style>
/* Geschäftsführungs-Cockpit (Demo). Farben wie die Devunox-Apps: data-skin="bunt", data-mode="auto". */
:root {
  --bg: #F6F7F9;
  --surface: #FFFFFF;
  --surface-2: #F4F5F8;
  --line: #E4E6EC;
  --ink: #17181C;
  --ink-2: #5F616B;
  --accent: #3450D1;
  --accent-ink: #FFFFFF;
  --accent-soft: #E7ECFC;
  --wf: #5A4FCF; --wf-soft: #ECEBFB;
  --kr: #0B7A71; --kr-soft: #DFF1EE;
  --lr: #B4540A; --lr-soft: #FBEBDD;
  --good: #1D7445; --good-soft: #DDF1E4;
  --warn: #8F5300; --warn-soft: #FCEBCB;
  --crit: #B42331; --crit-soft: #FBE3E5;
  --info: #2459C4; --info-soft: #E2EAFA;
  --muted-soft: #EEEFF3;
  --bar: #A9B4C4;
  --col-over: #D93644; --col-over-ink: #FFFFFF;
  --col-today: #F4B23F; --col-today-ink: #3A2600;
  --col-week: #2F6FD6; --col-week-ink: #FFFFFF;
  --col-good: #1F8A55; --col-good-ink: #FFFFFF;
  --col-info: #2F6FD6; --col-info-ink: #FFFFFF;
  --col-warn: #F4B23F; --col-warn-ink: #3A2600;
  --col-accent: var(--accent); --col-accent-ink: var(--accent-ink);
  --col-crit: #D93644; --col-crit-ink: #FFFFFF;
  --n-start: var(--accent); --n-wf: var(--wf); --n-kr: var(--kr); --n-lr: var(--lr); --n-aufg: #2F6FD6; --n-md: #7E8496; --n-up: #7E8496; --n-theme: #B8458C;
  --nav-on: var(--surface);
  --a0: #0B7A71; --a1: #5A4FCF; --a2: #B4540A; --a3: #8A3FAE; --a4: #2A6FB0; --a5: #B23355; --a6: #4E7A1E; --a7: #5D6470;
  --card-border: 1px solid var(--line);
  --card-shadow: none;
  --radius: 12px;
  --head-w: 650;
  --scrim: rgba(13, 18, 28, .45);
  --shadow: 0 12px 32px rgba(13, 25, 45, .16);
  --font-d: 'Geist', 'Segoe UI', system-ui, sans-serif;
  --font-b: 'Geist', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-m: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
:root[data-skin="bunt"] {
  --bg: #F3F4FA;
  --line: #E4E6F0;
  --ink: #1C1D2B;
  --ink-2: #5C5F74;
  --accent: #6E4AF2;
  --accent-soft: #EFEBFE;
  --wf: #6E4AF2; --wf-soft: #EFEBFE;
  --kr: #0B7A71; --kr-soft: #DDF1EE;
  --lr: #B94F06; --lr-soft: #FBE8DA;
  --muted-soft: #EEF0F7;
  --nav-on: var(--accent-soft);
  --card-border: 1px solid transparent;
  --card-shadow: 0 1px 3px rgba(28, 29, 43, .08), 0 0 0 1px rgba(28, 29, 43, .03);
  --radius: 16px;
  --head-w: 800;
  --font-d: 'Figtree', 'Segoe UI', system-ui, sans-serif;
  --font-b: 'Figtree', 'Segoe UI', system-ui, -apple-system, sans-serif;
}
/* Dunkel: ausdrücklich gewählt, oder Automatisch und Gerät bzw. Viewer steht auf dunkel */
:root[data-mode="dark"], :root[data-mode="auto"][data-theme="dark"] {
  --bg: #0F1117; --surface: #181B24; --surface-2: #1F2330; --line: #2C3141; --ink: #E8EAF2; --ink-2: #A0A6B8;
  --accent: #7D97F5; --accent-ink: #0B1020; --accent-soft: #1E2748;
  --wf: #A59BF5; --wf-soft: #27244A; --kr: #45C2B4; --kr-soft: #123632; --lr: #F2A36A; --lr-soft: #3A2414;
  --good: #5CCB8B; --good-soft: #15321F; --warn: #EBB25A; --warn-soft: #3A2A0F; --crit: #F47B85; --crit-soft: #3D1A1F; --info: #8DB0F6; --info-soft: #1A2744;
  --muted-soft: #252A38; --bar: #47536A; --nav-on: var(--surface-2);
  --card-border: 1px solid var(--line); --card-shadow: none;
  --scrim: rgba(0, 0, 0, .62); --shadow: 0 12px 32px rgba(0, 0, 0, .55);
  --a0: #1E8C84; --a1: #6F64DA; --a2: #C0601A; --a3: #9B55BE; --a4: #3A82C6; --a5: #C24966; --a6: #5E9128; --a7: #6C7480;
  color-scheme: dark;
}
:root[data-mode="dark"][data-skin="bunt"], :root[data-mode="auto"][data-theme="dark"][data-skin="bunt"] { --accent: #A08BFF; --accent-soft: #2A2350; --wf: #A08BFF; --nav-on: var(--accent-soft); }
@media (prefers-color-scheme: dark) {
  :root[data-mode="auto"]:not([data-theme="light"]) {
    --bg: #0F1117; --surface: #181B24; --surface-2: #1F2330; --line: #2C3141; --ink: #E8EAF2; --ink-2: #A0A6B8;
    --accent: #7D97F5; --accent-ink: #0B1020; --accent-soft: #1E2748;
    --wf: #A59BF5; --wf-soft: #27244A; --kr: #45C2B4; --kr-soft: #123632; --lr: #F2A36A; --lr-soft: #3A2414;
    --good: #5CCB8B; --good-soft: #15321F; --warn: #EBB25A; --warn-soft: #3A2A0F; --crit: #F47B85; --crit-soft: #3D1A1F; --info: #8DB0F6; --info-soft: #1A2744;
    --muted-soft: #252A38; --bar: #47536A; --nav-on: var(--surface-2);
    --card-border: 1px solid var(--line); --card-shadow: none;
    --scrim: rgba(0, 0, 0, .62); --shadow: 0 12px 32px rgba(0, 0, 0, .55);
    --a0: #1E8C84; --a1: #6F64DA; --a2: #C0601A; --a3: #9B55BE; --a4: #3A82C6; --a5: #C24966; --a6: #5E9128; --a7: #6C7480;
    color-scheme: dark;
  }
  :root[data-mode="auto"]:not([data-theme="light"])[data-skin="bunt"] { --accent: #A08BFF; --accent-soft: #2A2350; --wf: #A08BFF; --nav-on: var(--accent-soft); }
}

/* Diagrammfarben: Referenzpalette (validiert hell gegen #FFFFFF, dunkel gegen #181B24) */
:root {
  --v1: #2a78d6; --v2: #eb6834; --v3: #1baf7a; --v4: #eda100; --v5: #e87ba4;
  --vmut: #b4b8c4; --grid: #eceef3; --axis: #cfd3dc; --tick: #737889;
  --good-t: #006300; --bad-t: #c0282f;
  --st-good: #0ca30c; --st-warn: #fab219; --st-crit: #d03b3b;
  --s1: #cde2fb; --s2: #9ec5f4; --s3: #6da7ec; --s4: #3987e5; --s5: #256abf; --s6: #184f95; --s7: #0d366b;
  --s-ink-lo: #17181C; --s-ink-hi: #FFFFFF;
  --o1: #86b6ef; --o2: #5598e7; --o3: #256abf; --o4: #184f95; --o5: #0d366b;
}
:root[data-mode="dark"], :root[data-mode="auto"][data-theme="dark"] {
  --v1: #3987e5; --v2: #d95926; --v3: #199e70; --v4: #c98500; --v5: #d55181;
  --vmut: #5b6274; --grid: #252a36; --axis: #363c4b; --tick: #9298a8;
  --good-t: #3dbb3d; --bad-t: #f07a82;
  --s1: #142640; --s2: #173560; --s3: #1c4a85; --s4: #2a66b5; --s5: #3f86de; --s6: #7aaeef; --s7: #b7d3f6;
  --s-ink-lo: #E8EAF2; --s-ink-hi: #0B1020;
  --o1: #184f95; --o2: #256abf; --o3: #3987e5; --o4: #6da7ec; --o5: #9ec5f4;
}
@media (prefers-color-scheme: dark) {
  :root[data-mode="auto"]:not([data-theme="light"]) {
    --v1: #3987e5; --v2: #d95926; --v3: #199e70; --v4: #c98500; --v5: #d55181;
    --vmut: #5b6274; --grid: #252a36; --axis: #363c4b; --tick: #9298a8;
    --good-t: #3dbb3d; --bad-t: #f07a82;
    --s1: #142640; --s2: #173560; --s3: #1c4a85; --s4: #2a66b5; --s5: #3f86de; --s6: #7aaeef; --s7: #b7d3f6;
    --s-ink-lo: #E8EAF2; --s-ink-hi: #0B1020;
    --o1: #184f95; --o2: #256abf; --o3: #3987e5; --o4: #6da7ec; --o5: #9ec5f4;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-b); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-d); text-wrap: balance; margin: 0; }
.muted { color: var(--ink-2); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.i { width: 20px; height: 20px; flex: none; }
.i.s { width: 16px; height: 16px; }
.num { font-variant-numeric: tabular-nums; }

/* Rahmen */
.shell { display: grid; grid-template-columns: 228px minmax(0, 1100px); gap: 24px; justify-content: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: calc(100vh - env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 3px; padding-block: 16px; }
.center { min-width: 0; padding-block: 18px 64px; display: flex; flex-direction: column; gap: 14px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 14px; }
.logo { width: 36px; height: 36px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--font-d); font-weight: 800; font-size: 18px; flex: none; }
.brand-name { font-family: var(--font-d); font-weight: 700; font-size: 18px; line-height: 1.05; }
.brand-sub { font-size: 11.5px; color: var(--ink-2); }
.nav-i { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: none; padding: 9px 12px; border-radius: 12px; font-weight: 600; font-size: 15px; color: var(--ink); text-align: left; }
.nav-i:hover { background: var(--surface); }
.nav-i.on { background: var(--nav-on); }
.nav-i .ni { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--ni); color: #FFFFFF; flex: none; }
.nav-i .ni .i { width: 16px; height: 16px; }
.nav-i .lbl { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-sep { height: 1px; background: var(--line); margin: 8px 12px; }
.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
.src-card { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); font-size: 12.5px; }
.src-card b { display: block; font-size: 13px; }
.src-card small { color: var(--ink-2); }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--vmut); }
.dot.own { background: var(--accent); }
.linkbtn { background: none; border: 0; color: var(--accent); font-weight: 600; font-size: 13px; padding: 0 12px; text-align: left; }

.mtop { display: none; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 25; background: var(--surface); border-bottom: 1px solid var(--line); align-items: center; gap: 10px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mtop .brand { padding: 0; margin-right: auto; }
.icon-btn { position: relative; width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; }
.tabbar { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); justify-content: space-around; }
.tab-i { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--ink-2); padding: 4px 6px; border-radius: 10px; flex: 1; }
.tab-i.on { color: var(--accent); }

@media (max-width: 1180px) {
  .shell { grid-template-columns: 68px minmax(0, 1fr); }
  .rail .lbl, .rail .brand > div, .src-card > div, .rail .linkbtn { display: none; }
  .rail .nav-i { justify-content: center; padding: 10px; }
  .rail .brand { justify-content: center; padding: 4px 0 14px; }
  .src-card { justify-content: center; padding: 10px 6px; }
}
@media (max-width: 760px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .mtop { display: flex; }
  .tabbar { display: flex; }
  .center { padding-top: 14px; padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
}

/* Bausteine */
.card { background: var(--surface); border: var(--card-border); box-shadow: var(--card-shadow); border-radius: var(--radius); min-width: 0; }
.page-h { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.page-h h1 { font-size: 28px; line-height: 1.12; font-weight: var(--head-w); }
.page-h p { margin: 4px 0 0; color: var(--ink-2); }
.row-acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 10px; padding: 8px 14px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 13.5px; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn[disabled] { opacity: .5; cursor: not-allowed; filter: none; }
.btn .i { width: 16px; height: 16px; }
.mini { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 3px 9px; font-size: 12.5px; font-weight: 600; white-space: nowrap; color: var(--ink-2); }
.mini:hover { background: var(--surface-2); color: var(--ink); }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.pill.muted { background: var(--muted-soft); color: var(--ink-2); }
.pill.acc { background: var(--accent-soft); color: var(--accent); }
.hint { font-size: 13px; color: var(--ink-2); }
.mob { display: none; }
@media (max-width: 760px) { .mob { display: inline-flex; } .desk { display: none !important; } }

/* Filterleiste */
.fbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 10px 12px; }
.sel { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 10px; font-size: 13px; max-width: 100%; font-weight: 600; }
.sel.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.fbar .sp { flex: 1; }
.fchips { display: flex; gap: 6px; flex-wrap: wrap; }
.fchip { display: inline-flex; align-items: center; gap: 4px; border: 0; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 4px 6px 4px 10px; font-size: 12.5px; font-weight: 600; }
.fchip .i { width: 14px; height: 14px; }
.ffields { display: grid; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.field input, .field select { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--surface); width: 100%; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.banner { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 14px; border-radius: 12px; background: var(--accent-soft); color: var(--ink); font-size: 13.5px; }
.banner > span { flex: 1; min-width: 200px; }

/* Kennzahlen */
.kpis6 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.tile { display: grid; gap: 4px; text-align: left; padding: 14px 16px 12px; border: var(--card-border); box-shadow: var(--card-shadow); background: var(--surface); border-radius: var(--radius); min-width: 0; color: inherit; }
.tile:hover { border-color: var(--accent); }
.t-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.t-l { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.t-v { font-family: var(--font-d); font-size: 28px; font-weight: 800; line-height: 1.12; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.t-b { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; }
.t-d { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.t-d .up, .t-d .dn { font-weight: 700; }
.good-t { color: var(--good-t); } .bad-t { color: var(--bad-t); }
.amp { display: inline-flex; gap: 5px; align-items: center; font-size: 11.5px; font-weight: 600; color: var(--ink-2); padding: 2px 8px 2px 6px; border-radius: 999px; background: var(--surface-2); white-space: nowrap; }
.amp .ai { width: 14px; height: 14px; border-radius: 50%; display: grid; place-items: center; color: #fff; }
.amp .ai svg { width: 10px; height: 10px; }
.amp.good .ai { background: var(--st-good); } .amp.warn .ai { background: var(--st-warn); color: #17181C; } .amp.crit .ai { background: var(--st-crit); }
.spark { display: block; overflow: visible; }
.spark path { fill: none; stroke: var(--v1); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.spark circle { fill: var(--v1); }
.spark .tg { stroke: var(--axis); stroke-width: 1; }

/* Diagrammkarten */
.grid-ch { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.span2 { grid-column: 1 / -1; }
.ch-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 14px 16px 6px; }
.ch-h h2 { font-size: 16px; font-weight: 700; }
.ch-a { display: flex; gap: 6px; align-items: center; flex: none; }
.take { margin: 3px 0 0; font-size: 13px; color: var(--ink-2); }
.take b { color: var(--ink); }
.ch-b { padding: 4px 16px 14px; }
.chart { min-height: 40px; }
.lg { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin: 2px 0 6px; }
.lg span { display: inline-flex; align-items: center; gap: 6px; }
.lg i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; }
.lg i.ln { height: 3px; width: 16px; border-radius: 2px; }
.lg i.tgl { height: 0; width: 16px; border-top: 1.5px solid var(--ink-2); border-radius: 0; }
.c1 { background: var(--v1); } .c2 { background: var(--v2); } .c3 { background: var(--v3); } .c4 { background: var(--v4); } .c5 { background: var(--v5); } .cp { background: var(--vmut); }
svg.viz { display: block; overflow: visible; max-width: 100%; }
.viz text { font-size: 11px; fill: var(--tick); font-family: var(--font-b); }

function insights() {

      out.push({ st: 'crit', sev: 3, t: `OEE <b>${esc(w.linie)}</b> im ${MONL[mM(w.m)]} nur <b>${fPct(w.oee, 0)}</b>${st ? `: ${de(st.min)} Min. ${esc(st.grund)}` : ''}.`, small: 'Produktion', dd: dd(`Stillstände ${w.linie} · ${mLong(w.m)}`, 'stop', flt(D.stop, [w.m]).filter(r => r.linie === w.linie)) });
    }

    out.push({ st: 'warn', sev: 2.5, t: `PPM im ${MONL[mM(ppmM.k)]} bei <b>${de(ppmM.v)}</b>${top ? `, vor allem ${esc(top[0])} (${de(top[1])} Teile)` : ''}.`, small: 'Qualität', dd: dd(`Reklamationen ${mLong(ppmM.k)}`, 'rekla', rk) });

/* ---------- Vertrieb ---------- */
function pageVt() {
  const mss = MSS(), rows = flt(salesRows(), mss), labels = mss.map(mLab), u = sum(rows, r => r.betrag);

  const pgs = hasPg ? [...groupSum(rows, 'pg', 'betrag')].sort((a, b) => b[1] - a[1]).map(x => x[0]) : [];
  const main = pgs.slice(0, 4), other = pgs.slice(4);
  const series = main.map((pg, j) => ({ name: pg, cls: 's' + (j + 1), vals: mss.map(k => sum(rows.filter(r => r.m === k && r.pg === pg), r => r.betrag)) }));
  if (other.length) series.push({ name: other.length === 1 ? other[0] : 'Weitere', cls: 's5', vals: mss.map(k => sum(rows.filter(r => r.m === k && other.includes(r.pg)), r => r.betrag)) });
  const prevRows = flt(salesRows(), vjOf(mss)), gp = groupSum(prevRows, 'pg', 'betrag'), gc = groupSum(rows, 'pg', 'betrag');
  const growth = pgs.map(p => [p, gp.get(p) ? gc.get(p) / gp.get(p) - 1 : null]).filter(x => x[1] != null).sort((a, b) => b[1] - a[1])[0];
  const kun = hasK ? [...groupSum(rows, 'kunde', 'betrag')].sort((a, b) => b[1] - a[1]) : [];
  const reg = hasReg ? [...groupSum(rows, 'region', 'betrag')].sort((a, b) => b[1] - a[1]) : [];

  <div class="grid-ch">
    ${card('v-pg', 'Umsatz nach Produktgruppe', growth ? `Am stärksten gewachsen: <b>${esc(growth[0])}</b> (${signed(growth[1], 0)}).` : hasPg ? '' : 'Ohne Produktgruppe in den Daten.',
      w => hasPg ? barSvg(w, { labels, series, stacked: true, fmt: fTsd, ax: fAx, tipLabels: mss.map(mLong), dd: (i, j) => dd(`${series[j].name} · ${mLong(mss[i])}`, 'sales', rows.filter(r => r.m === mss[i] && (j < main.length ? r.pg === main[j] : other.includes(r.pg)))), aria: 'Umsatz je Monat nach Produktgruppe, gestapelt' })
        : barSvg(w, { labels, series: [{ name: 'Umsatz', cls: 's1', vals: mss.map(k => sum(rows.filter(r => r.m === k), r => r.betrag)) }], fmt: fTsd, ax: fAx, tipLabels: mss.map(mLong), dd: i => dd(`Umsatz ${mLong(mss[i])}`, 'sales', rows.filter(r => r.m === mss[i])), aria: 'Umsatz je Monat' }),
      { head: ['Monat'].concat(series.map(s => s.name + ' €')), rows: mss.map((k, i) => [mLong(k)].concat(series.map(s => s.vals[i]))), num: series.map((_, i) => i + 1) },
      { span: true, legend: hasPg ? legend(series.map(s => ['c' + s.cls.slice(1), s.name])) : '' })}
    ${card('v-kun', 'Top 10 Kunden', top10.length ? `Die Top 10 bringen <b>${fPct(sum(top10, x => x[1]) / (u || 1), 0)}</b> des Umsatzes.` : '',
      () => hasK ? hbars(top10.map(([k, v]) => ({ label: k, val: v, txt: fTsd(v), sub: fPct(v / (u || 1), 0), dd: dd(`Umsatz ${k}`, 'sales', rows.filter(r => r.kunde === k)), tip: `${k}\n${fEur(v)}` }))) : missing('Kunde'),
      { head: ['Kunde', 'Umsatz €', 'Anteil'], rows: kun.map(([k, v]) => [k, v, v / (u || 1)]), num: [1], pct: [2] })}
    ${card('v-reg', 'Umsatz nach Region', reg.length ? `<b>${esc(reg[0][0])}</b> ist die stärkste Region.` : '',
      () => hasReg ? hbars(reg.map(([k, v]) => ({ label: k, val: v, txt: fTsd(v), sub: fPct(v / (u || 1), 0), dd: dd(`Umsatz ${k}`, 'sales', rows.filter(r => r.region === k)), tip: `${k}\n${fEur(v)}` }))) : missing('Region'),
      { head: ['Region', 'Umsatz €', 'Anteil'], rows: reg.map(([k, v]) => [k, v, v / (u || 1)]), num: [1], pct: [2] })}
    ${card('v-ae', 'Auftragseingang und Umsatz', `Book-to-Bill <b>${de(btb, 2)}</b>: ${btb >= 1 ? 'Es kommen mehr Aufträge rein, als fakturiert wird.' : 'Der Auftragsbestand schrumpft.'}`,

      { sample: true, legend: legend([['c1', 'Auftragseingang', 'line'], ['c2', 'Umsatz', 'line']]) })}

    chartBox('Fehlerarten Kundenreklamationen', M + half + 8, y, half, ch, (x, yy, w, h) => hbarPdf(x, yy, w, h, [...groupSum(flt(D.rekla, ms), 'fehlerart', () => 1)].sort((a, b) => b[1] - a[1]).map(([l, v]) => ({ l, v })), v => de(v)));
    const pc = doc.getNumberOfPages();
    for (let i = 1; i <= pc; i++) { doc.setPage(i); font(7, 'normal', RGB.ink2); doc.text(T(`Muster GmbH · Monatsbericht ${mLong(mon)} · erstellt ${fDate(iso(new Date()))}${S.own ? '' : ' · Beispieldaten'}`), M, H - 9); doc.text(`Seite ${i} von ${pc}`, W - M, H - 9, { align: 'right' }); }
    await saveFile(`Monatsbericht_${mon}.pdf`, doc.output('blob'));
  } catch (e) { console.error(e); toast('Der Bericht konnte nicht erstellt werden.'); }
}

/* ---------- Rendern ---------- */
function render() {
  CH = {}; TB = {}; DD = {}; ddN = 0;
  renderFrame();
  const p = S.page;
  $('center').innerHTML = p === 'vt' ? pageVt() : p === 'pr' ? pageProd() : p === 'qu' ? pageQual() : p === 'ek' ? pageEk() : p === 'fi' ? pageFin() : p === 'ziele' ? pageZiele() : p === 'daten' ? pageDaten() : pageUeb();
  document.title = `${TITLES[p] || 'Cockpit'} · Cockpit`;
  drawCharts();
}
function go(p) { S.page = p; closeSheet(); save(); render(); window.scrollTo(0, 0); const h = $('center').querySelector('h1'); if (h) { h.tabIndex = -1; h.focus({ preventScroll: true }); } }
function setF(k, v) {
  S.f[k] = v;
  if (k === 'per' && v === 'custom' && !S.f.from) { const a = ownAnchor(); S.f.from = mAdd(a, -11); S.f.to = a; }
  save();
  const inSheet = !$('overlay').hidden;
  render(); if (inSheet) filterSheet();
}

/* ---------- Ereignisse ---------- */
document.addEventListener('click', e => {
  const ddEl = e.target.closest('[data-dd]');
  if (ddEl && !e.target.closest('[data-action]')) { openDD(ddEl.dataset.dd); return; }
  const a = e.target.closest('[data-action]'); if (!a) return;
  const d = a.dataset;
  switch (d.action) {
    case 'go': go(d.p); break;
    case 'more': moreSheet(); break;
    case 'filters': filterSheet(); break;
    case 'close': closeSheet(); break;
    case 'fclr': setF(d.k, ''); break;
    case 'freset': S.f = Object.assign({}, F0); save(); render(); filterSheet(); break;
    case 'tbl': openTable(d.id); break;
    case 'tbl-xl': exportTable(d.id); break;
    case 'dd-xl': exportDD(d.k); break;
    case 'dd-sort': { const c = +d.c; SORT = SORT.key === d.k && SORT.col === c ? { key: d.k, col: c, dir: -SORT.dir } : { key: d.k, col: c, dir: COLS[DD[d.k].set][c][3] ? -1 : 1 }; $('ddBody').innerHTML = ddBody(d.k); const b = $('ddBody').querySelector(`[data-c="${c}"]`); if (b) b.focus(); break; }
    case 'xl-kpi': exportKpi(); break;
    case 'pdf': pdfReport(); break;
    case 'view-save': viewSheet(); break;
    case 'view-load': loadView(+d.i); break;
    case 'view-del': S.views.splice(+d.i, 1); save(); viewSheet(); render(); toast('Ansicht gelöscht'); break;
    case 'own-off': S.own = null; U = { step: 1, name: '', headers: [], rows: [], map: {} }; save(); render(); toast('Wieder Beispieldaten'); break;
    case 'up-test': testFile(); break;
    case 'up-tpl': templateFile(); break;
    case 'up-cancel': U = { step: 1, name: '', headers: [], rows: [], map: {} }; render(); break;
    case 'up-apply': {
      const { ok } = convertRows(); if (!ok.length) return;
      S.own = { name: U.name, at: iso(new Date()), rows: ok }; S.f = Object.assign({}, F0); U = { step: 1, name: '', headers: [], rows: [], map: {} };
      save(); S.page = 'ueb'; render(); window.scrollTo(0, 0); toast(`${de(ok.length)} Zeilen übernommen`); break;
    }
    case 'ziele-reset': S.ziele = Object.assign({}, ZIELE0); save(); render(); toast('Standardziele gesetzt'); break;
    case 'reset': try { localStorage.removeItem(KEY); } catch (er) {} S = { page: 'ueb', f: Object.assign({}, F0), views: [], ziele: Object.assign({}, ZIELE0), own: null }; U = { step: 1, name: '', headers: [], rows: [], map: {} }; closeSheet(); render(); toast('Demo zurückgesetzt'); break;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.f) { setF(t.dataset.f, t.value); return; }
  if (t.dataset.actionSel === 'view' && t.value !== '') { loadView(+t.value); return; }
  if (t.dataset.map) { U.map[t.dataset.map] = +t.value; render(); const el = $('map-' + t.dataset.map); if (el) el.focus(); return; }
  if (t.id === 'upFile') { readUpload(t.files[0]); t.value = ''; }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'viewF') {
    const n = $('vw-name').value.trim(); if (!n) { $('vw-name').focus(); return; }
    S.views.push({ name: n, f: Object.assign({}, S.f), page: ['daten', 'ziele'].includes(S.page) ? 'ueb' : S.page }); save(); closeSheet(); render(); toast('Ansicht gespeichert');
  } else if (e.target.id === 'zielF') {
    const g = k => parseNum($('z-' + k).value);
    const nz = { umsatz: g('umsatz') * 1e6, ae: g('ae') * 1e6, oee: g('oee') / 100, ppm: g('ppm'), lt: g('lt') / 100, op: g('op') * 1e3, dlz: g('dlz'), dso: g('dso') };
    if (Object.values(nz).some(v => v == null || !isFinite(v) || v <= 0)) { toast('Bitte alle Ziele als positive Zahlen eintragen.'); return; }
    S.ziele = nz; save(); render(); toast('Ziele gespeichert');
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('overlay').hidden) closeSheet(); });
$('overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeSheet(); });
document.addEventListener('dragover', e => { const d = e.target.closest && e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', e => { const d = e.target.closest && e.target.closest('#drop'); if (d) d.classList.remove('over'); });
document.addEventListener('drop', e => { const d = e.target.closest && e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.remove('over'); readUpload(e.dataTransfer.files[0]); } });
let rzT, lastW = window.innerWidth;
window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { if (window.innerWidth !== lastW) { lastW = window.innerWidth; drawCharts(); } }, 150); });

/* ---------- Start ---------- */
document.documentElement.setAttribute('data-skin', 'bunt');
document.documentElement.setAttribute('data-mode', 'auto');
render();
(async () => { try { DL = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { DL = null; } })();

</script>
</body>
