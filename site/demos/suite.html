<title>Workflow und Reklamationen</title>
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head>
<body>
<style>
@font-face { font-family: "Figtree"; font-style: normal; font-weight: 300 900; font-display: swap; src: url(shared-files/figtree-latin-wght-normal.woff2) format("woff2-variations"); }
@font-face { font-family: "Geist"; font-style: normal; font-weight: 100 900; font-display: swap; src: url(shared-files/geist-latin-wght-normal.woff2) format("woff2-variations"); }
@font-face { font-family: "JetBrains Mono"; font-style: normal; font-weight: 100 800; font-display: swap; src: url(shared-files/jetbrains-mono-latin-wght-normal.woff2) format("woff2-variations"); }
</style>
<style>
/* Layout: Navigation links (farbige Kacheln), Inhalt in der Mitte; Startseite und Listen breit, Detail mit Seitenspalte.
   Themes: data-skin (bunt | klar) × data-mode (auto | light | dark) × data-density (normal | kompakt); Firmenfarbe setzt --accent per Script. */
:root {
  --bg: #F6F7F9;
  --surface: #FFFFFF;
  --surface-2: #F4F5F8;
  --line: #E4E6EC;
  --ink: #17181C;
  --ink-2: #5F616B;
  --accent: #3450D1;
  --accent-ink: #FFFFFF;
  --accent-soft: #E7ECFC;
  --wf: #5A4FCF; --wf-soft: #ECEBFB;
  --kr: #0B7A71; --kr-soft: #DFF1EE;
  --lr: #B4540A; --lr-soft: #FBEBDD;
  --good: #1D7445; --good-soft: #DDF1E4;
  --warn: #8F5300; --warn-soft: #FCEBCB;
  --crit: #B42331; --crit-soft: #FBE3E5;
  --info: #2459C4; --info-soft: #E2EAFA;
  --muted-soft: #EEEFF3;
  --bar: #A9B4C4;
  --col-over: #D93644; --col-over-ink: #FFFFFF;
  --col-today: #F4B23F; --col-today-ink: #3A2600;
  --col-week: #2F6FD6; --col-week-ink: #FFFFFF;
  --col-good: #1F8A55; --col-good-ink: #FFFFFF;
  --col-info: #2F6FD6; --col-info-ink: #FFFFFF;
  --col-warn: #F4B23F; --col-warn-ink: #3A2600;
  --col-accent: var(--accent); --col-accent-ink: var(--accent-ink);
  --col-crit: #D93644; --col-crit-ink: #FFFFFF;
  --n-start: var(--accent); --n-wf: var(--wf); --n-kr: var(--kr); --n-lr: var(--lr); --n-aufg: #2F6FD6; --n-md: #7E8496; --n-up: #7E8496; --n-theme: #B8458C;
  --nav-on: var(--surface);
  --a0: #0B7A71; --a1: #5A4FCF; --a2: #B4540A; --a3: #8A3FAE; --a4: #2A6FB0; --a5: #B23355; --a6: #4E7A1E; --a7: #5D6470;
  --card-border: 1px solid var(--line);
  --card-shadow: none;
  --radius: 12px;
  --head-w: 650;
  --scrim: rgba(13, 18, 28, .45);
  --shadow: 0 12px 32px rgba(13, 25, 45, .16);
  --font-d: 'Geist', 'Segoe UI', system-ui, sans-serif;
  --font-b: 'Geist', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-m: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
:root[data-skin="bunt"] {
  --bg: #F3F4FA;
  --line: #E4E6F0;
  --ink: #1C1D2B;
  --ink-2: #5C5F74;
  --accent: #6E4AF2;
  --accent-soft: #EFEBFE;
  --wf: #6E4AF2; --wf-soft: #EFEBFE;
  --kr: #0B7A71; --kr-soft: #DDF1EE;
  --lr: #B94F06; --lr-soft: #FBE8DA;
  --muted-soft: #EEF0F7;
  --nav-on: var(--accent-soft);
  --card-border: 1px solid transparent;
  --card-shadow: 0 1px 3px rgba(28, 29, 43, .08), 0 0 0 1px rgba(28, 29, 43, .03);
  --radius: 16px;
  --head-w: 800;
  --font-d: 'Figtree', 'Segoe UI', system-ui, sans-serif;
  --font-b: 'Figtree', 'Segoe UI', system-ui, -apple-system, sans-serif;
}
/* Dunkel: ausdrücklich gewählt, oder Automatisch und Gerät bzw. Viewer steht auf dunkel */
:root[data-mode="dark"], :root[data-mode="auto"][data-theme="dark"] {
  --bg: #0F1117; --surface: #181B24; --surface-2: #1F2330; --line: #2C3141; --ink: #E8EAF2; --ink-2: #A0A6B8;
  --accent: #7D97F5; --accent-ink: #0B1020; --accent-soft: #1E2748;
  --wf: #A59BF5; --wf-soft: #27244A; --kr: #45C2B4; --kr-soft: #123632; --lr: #F2A36A; --lr-soft: #3A2414;
  --good: #5CCB8B; --good-soft: #15321F; --warn: #EBB25A; --warn-soft: #3A2A0F; --crit: #F47B85; --crit-soft: #3D1A1F; --info: #8DB0F6; --info-soft: #1A2744;
  --muted-soft: #252A38; --bar: #47536A; --nav-on: var(--surface-2);
  --card-border: 1px solid var(--line); --card-shadow: none;
  --scrim: rgba(0, 0, 0, .62); --shadow: 0 12px 32px rgba(0, 0, 0, .55);
  --a0: #1E8C84; --a1: #6F64DA; --a2: #C0601A; --a3: #9B55BE; --a4: #3A82C6; --a5: #C24966; --a6: #5E9128; --a7: #6C7480;
  color-scheme: dark;
}
:root[data-mode="dark"][data-skin="bunt"], :root[data-mode="auto"][data-theme="dark"][data-skin="bunt"] { --accent: #A08BFF; --accent-soft: #2A2350; --wf: #A08BFF; --nav-on: var(--accent-soft); }
@media (prefers-color-scheme: dark) {
  :root[data-mode="auto"]:not([data-theme="light"]) {
    --bg: #0F1117; --surface: #181B24; --surface-2: #1F2330; --line: #2C3141; --ink: #E8EAF2; --ink-2: #A0A6B8;
    --accent: #7D97F5; --accent-ink: #0B1020; --accent-soft: #1E2748;
    --wf: #A59BF5; --wf-soft: #27244A; --kr: #45C2B4; --kr-soft: #123632; --lr: #F2A36A; --lr-soft: #3A2414;
    --good: #5CCB8B; --good-soft: #15321F; --warn: #EBB25A; --warn-soft: #3A2A0F; --crit: #F47B85; --crit-soft: #3D1A1F; --info: #8DB0F6; --info-soft: #1A2744;
    --muted-soft: #252A38; --bar: #47536A; --nav-on: var(--surface-2);
    --card-border: 1px solid var(--line); --card-shadow: none;
    --scrim: rgba(0, 0, 0, .62); --shadow: 0 12px 32px rgba(0, 0, 0, .55);
    --a0: #1E8C84; --a1: #6F64DA; --a2: #C0601A; --a3: #9B55BE; --a4: #3A82C6; --a5: #C24966; --a6: #5E9128; --a7: #6C7480;
    color-scheme: dark;
  }
  :root[data-mode="auto"]:not([data-theme="light"])[data-skin="bunt"] { --accent: #A08BFF; --accent-soft: #2A2350; --wf: #A08BFF; --nav-on: var(--accent-soft); }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-b); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-d); text-wrap: balance; margin: 0; }
.mono { font-family: var(--font-m); font-size: 12px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.muted { color: var(--ink-2); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.i { width: 20px; height: 20px; flex: none; }
.i.s { width: 16px; height: 16px; }

/* Rahmen */
.shell { display: grid; grid-template-columns: 236px minmax(0, 660px) 300px; gap: 24px; justify-content: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.shell.wide { grid-template-columns: 236px minmax(0, 984px); }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: calc(100vh - env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 4px; padding-block: 16px; }
.center { min-width: 0; padding-block: 16px 64px; display: flex; flex-direction: column; gap: 14px; }
.side { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; padding-block: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; max-height: 100vh; overflow-y: auto; }
.shell.wide .side { display: none; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 14px; }
.logo { width: 36px; height: 36px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--font-d); font-weight: 700; font-size: 18px; flex: none; }
.brand-name { font-family: var(--font-d); font-weight: 700; font-size: 18px; line-height: 1.05; }
.brand-sub { font-size: 11.5px; color: var(--ink-2); }
.nav-i { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: none; padding: 10px 12px; border-radius: 12px; font-weight: 600; font-size: 15px; color: var(--ink); text-align: left; position: relative; }
.nav-i:hover { background: var(--surface); }
.nav-i.on { background: var(--surface); box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
.nav-i.on .i { color: var(--accent); }
.nav-i .lbl { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cnt { font-size: 11.5px; font-weight: 700; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--muted-soft); color: var(--ink-2); display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }
.cnt.crit { background: var(--crit); color: #fff; }
.nav-sep { height: 1px; background: var(--line); margin: 8px 12px; }
.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
.me-card { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.me-card select { border: 0; background: none; font-weight: 600; width: 100%; min-width: 0; padding: 0; }
.me-card small { display: block; color: var(--ink-2); font-size: 12px; }
.me-card > div { min-width: 0; flex: 1; }
.bell-btn { position: relative; }
.badge { position: absolute; top: 4px; left: 26px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--crit); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }

.mtop { display: none; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 25; background: var(--surface); border-bottom: 1px solid var(--line); align-items: center; gap: 10px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mtop .brand { padding: 0; margin-right: auto; }
.icon-btn { position: relative; width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; }
.icon-btn .badge { top: -5px; left: auto; right: -5px; }
.tabbar { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); justify-content: space-around; }
.tab-i { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--ink-2); padding: 4px 6px; border-radius: 10px; flex: 1; position: relative; }
.tab-i.on { color: var(--accent); }
.tab-i .cnt { position: absolute; top: -2px; right: calc(50% - 22px); min-width: 17px; height: 17px; font-size: 10.5px; }
.fab { display: none; position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 24; width: 54px; height: 54px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); box-shadow: var(--shadow); place-items: center; }
.fab .i { width: 24px; height: 24px; }

@media (max-width: 1180px) {
  .shell { grid-template-columns: 68px minmax(0, 660px); }
  .shell.wide { grid-template-columns: 68px minmax(0, 1fr); }
  .side { display: none; }
  .rail .lbl, .rail .brand > div, .rail .cnt, .me-card > div { display: none; }
  .rail .nav-i { justify-content: center; padding: 11px; }
  .rail .brand { justify-content: center; padding: 4px 0 14px; }
  .me-card { justify-content: center; padding: 6px; }
  .rail .badge { left: auto; right: 6px; }
}
@media (max-width: 760px) {
  .shell, .shell.wide { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .mtop { display: flex; }
  .tabbar { display: flex; }
  .fab.show { display: grid; }
  .center { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
}

/* Bausteine */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; min-width: 0; }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.card-h h2 { font-size: 16px; }
.card-h p { margin: 2px 0 0; font-size: 12.5px; color: var(--ink-2); }
.card-b { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.page-h { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.page-h h1 { font-size: 26px; line-height: 1.15; }
.page-h p { margin: 4px 0 0; color: var(--ink-2); max-width: 66ch; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 10px; padding: 8px 14px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 13.5px; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--crit); border-color: var(--crit); }
.btn.good { color: var(--good); border-color: var(--good); }
.btn[disabled] { opacity: .5; cursor: not-allowed; filter: none; }
.btn .i { width: 16px; height: 16px; }
.mini { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 3px 9px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.mini:hover { background: var(--surface-2); }
.mini.ok { color: var(--good); border-color: var(--good); }
.mini.acc { color: var(--accent); border-color: var(--accent); }
.linkbtn { background: none; border: 0; color: var(--accent); font-weight: 600; font-size: 13px; padding: 0; text-align: left; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.pill.info { background: var(--info-soft); color: var(--info); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.crit { background: var(--crit-soft); color: var(--crit); }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.pill.muted { background: var(--muted-soft); color: var(--ink-2); }
.pill.line { border: 1px solid var(--line); color: var(--ink-2); }
.pill.wf { background: var(--wf-soft); color: var(--wf); }
.pill.kr { background: var(--kr-soft); color: var(--kr); }
.pill.lr { background: var(--lr-soft); color: var(--lr); }
.code { font-family: var(--font-m); font-size: 11.5px; padding: 1px 6px; border-radius: 5px; background: var(--muted-soft); color: var(--ink); white-space: nowrap; }
.code.free { background: none; border: 1px dashed var(--line); color: var(--ink-2); font-family: var(--font-b); }
.due.over { color: var(--crit); font-weight: 600; }
.due.soon { color: var(--warn); font-weight: 600; }
.due.acc { color: var(--accent); font-weight: 600; }
.due.ok { color: var(--good); font-weight: 600; }
.hint { font-size: 13px; color: var(--ink-2); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.chip.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chip .n { opacity: .7; margin-left: 3px; font-variant-numeric: tabular-nums; font-weight: 500; }
.sel { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 10px; font-size: 13px; max-width: 100%; }
.search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 999px; padding: 0 14px; background: var(--surface); }
.search input { border: 0; background: none; padding: 9px 0; width: 100%; min-width: 0; outline: none; }
.search:focus-within { border-color: var(--accent); }

/* Avatare */
.av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; color: #fff; flex: none; letter-spacing: .02em; }
.av.s { width: 30px; height: 30px; font-size: 11.5px; }
.av.xs { width: 24px; height: 24px; font-size: 10px; }
.av.l { width: 52px; height: 52px; font-size: 18px; }
.av.dept { border-radius: 10px; }
.av.c0 { background: var(--a0); } .av.c1 { background: var(--a1); } .av.c2 { background: var(--a2); } .av.c3 { background: var(--a3); }
.av.c4 { background: var(--a4); } .av.c5 { background: var(--a5); } .av.c6 { background: var(--a6); } .av.c7 { background: var(--a7); }
.av-stack { display: flex; }
.av-stack .av { border: 2px solid var(--surface); margin-left: -8px; }
.av-stack .av:first-child { margin-left: 0; }

/* Start */
.hello { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.hello h1 { font-size: 28px; }
.hello p { margin: 4px 0 0; color: var(--ink-2); }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 620px) { .tiles { grid-template-columns: minmax(0, 1fr); } }
.tile { display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); text-align: left; width: 100%; }
.tile:hover { border-color: var(--ink-2); }
.tile-ic { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; }
.tile-ic .i { width: 24px; height: 24px; }
.tile-ic.wf { background: var(--wf-soft); color: var(--wf); } .tile-ic.kr { background: var(--kr-soft); color: var(--kr); } .tile-ic.lr { background: var(--lr-soft); color: var(--lr); }
.tile-ic.tool { background: var(--muted-soft); color: var(--ink); }
.tile-t { font-family: var(--font-d); font-weight: 700; font-size: 17px; line-height: 1.2; }
.tile-nums { display: flex; gap: 14px; }
.tile-nums div { display: flex; flex-direction: column; }
.tile-nums b { font-family: var(--font-d); font-size: 22px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile-nums b.crit { color: var(--crit); }
.tile-nums span { font-size: 11.5px; color: var(--ink-2); }
.quick { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.quick-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 620px) { .quick-row { grid-template-columns: minmax(0, 1fr); } }
.quick-row .btn { justify-content: flex-start; padding: 10px 12px; }
.quick-wf { color: var(--wf); border-color: var(--wf); background: var(--wf-soft); }
.quick-kr { color: var(--kr); border-color: var(--kr); background: var(--kr-soft); }
.quick-lr { color: var(--lr); border-color: var(--lr); background: var(--lr-soft); }
.quick-row .btn:hover { filter: brightness(.97); }
.tools { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 620px) { .tools { grid-template-columns: minmax(0, 1fr); } }
.tool { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); text-align: left; width: 100%; }
.tool:hover { border-color: var(--ink-2); }
.tool .tile-ic { width: 38px; height: 38px; border-radius: 11px; }

/* Detail */

  const d = daysBetween(TODAY, it.due);
  if (it.status === 'inarbeit') return d < 0 ? { t: `Seit ${tage(-d)} überfällig`, cls: 'over' } : { t: `Erledigen bis ${fmt(it.due)}`, cls: d <= 1 ? 'soon' : '' };
  return d < 0 ? { t: `Freigabe seit ${tage(-d)} überfällig`, cls: 'over' } : { t: d === 0 ? 'Freigabe heute fällig' : `Freigabe bis ${fmt(it.due)}`, cls: d <= 1 ? 'soon' : '' };
}
function nextNr(app) {
  const pre = `${APPS[app].pre}-${YEAR}-`;
  const max = Math.max(0, ...S.items.filter(i => i.nr.startsWith(APPS[app].pre)).map(i => +i.nr.slice(-4)));
  return pre + String(max + 1).padStart(4, '0');
}
const sumKosten = it => it.kosten.reduce((a, k) => a + (Number(k.betrag) || 0), 0);

/* ---------- Benachrichtigungen ---------- */
function notify(to, text, ref, escal) {
  if (!to) return 0;
  if (S.notes.some(n => n.to === to && n.text === text && n.at.slice(0, 10) === TODAY)) return 0;
  S.notes.unshift({ id: `n${TODAY.replace(/-/g, '')}-${hash(to + '|' + text).toString(36)}`, to, text, ref, at: stamp(), read: false, esc: !!escal });
  if (S.notes.length > 300) S.notes.length = 300;
  return 1;
}
const tell = (to, text, ref) => { if (to && to !== me()) notify(to, text, ref); };
const tellStep = (s, text, ref) => { if (!s) return; if (s.kind === 'a') members(s.who).forEach(n => tell(n, text, ref)); else tell(s.who, text, ref); };
const tellFollowers = (it, text) => it.followers.forEach(n => tell(n, text, it.id));
function log(it, text) { it.log.push({ at: stamp(), who: me(), text }); }
function follow(it, n) { if (n && !it.followers.includes(n)) it.followers.push(n); }

/* ---------- Aufgaben über alle Apps ---------- */
function allTasks() {
  const out = [];
  S.items.forEach(it => {
    if (isR(it)) {
      it.massnahmen.forEach(m => out.push({ kind: 'm', it, m, ref: 'm:' + m.id, code: m.code, typ: m.typ + 'maßnahme', text: m.text, owner: m.owner, dept: false, due: m.due, done: m.status === 'erledigt', doneAt: m.doneAt, reminded: m.reminded }));
      if (['neu', 'bewertung'].includes(it.status)) out.push({ kind: 'b', it, ref: 'b', code: '', typ: 'Bewertung', text: `Bewerten: ${it.titel}`, owner: qmName(), dept: false, due: it.kundenfrist && it.kundenfrist < addDays(it.eingang, 1) ? it.kundenfrist : addDays(it.eingang, 1), done: false, doneAt: null, reminded: it.reminded || null });
      if (it.status === 'freigabe') out.push({ kind: 'g', it, ref: 'g', code: '', typ: 'Freigabe', text: `Freigeben: ${it.titel}`, owner: leitName(), dept: false, due: it.steps.D8.due, done: false, doneAt: null, reminded: it.reminded || null });
      if (it.status === 'bearbeitung') STEPS.slice(0, 7).forEach(([k, n]) => { const s = it.steps[k]; out.push({ kind: 's', it, k, ref: 's:' + k, code: k, typ: '8D-Schritt', text: n, owner: s.owner, dept: false, due: s.due, done: s.done, doneAt: s.doneAt, reminded: s.reminded }); });
    } else {
      it.tasks.forEach(t => out.push({ kind: 't', it, t, ref: 't:' + t.id, code: '', typ: 'Aufgabe', text: t.text, owner: t.owner, dept: false, due: t.due, done: t.status === 'erledigt', doneAt: t.doneAt, reminded: t.reminded }));
      const c = wfCur(it);
      if (it.status === 'laeuft' && c) out.push({ kind: 'f', it, ref: 'f', code: '', typ: 'Freigabe', text: `Freigabe: ${it.titel}`, owner: c.who, dept: c.kind === 'a', due: it.due, done: false, doneAt: null, reminded: c.reminded || null });
      if (it.status === 'zurueckgewiesen') out.push({ kind: 'r', it, ref: 'r', code: '', typ: 'Überarbeiten', text: `Überarbeiten: ${it.titel}`, owner: it.creator, dept: false, due: it.due, done: false, doneAt: null, reminded: null });
    }
  });
  return out;
}
const mineTask = (t, n) => t.dept ? deptOf(n) === t.owner : t.owner === n;
const findTask = (id, ref) => allTasks().find(t => t.it.id === id && t.ref === ref);
const isOver = t => !t.done && t.due < TODAY;
const isSoon = t => !t.done && t.due >= TODAY && daysBetween(TODAY, t.due) <= 7;
const taskLabel = t => t.kind === 'm' ? `Maßnahme „${t.text}“` : t.kind === 's' ? `${t.k} ${t.text}` : t.kind === 't' ? `Aufgabe „${t.text}“` : t.text;
const ownerLabel = t => t.dept ? `Abteilung ${t.owner}` : t.owner;
function notifyOwner(t, text, escal) {
  if (t.dept) return members(t.owner).reduce((a, n) => a + notify(n, text, t.it.id, escal), 0);
  return notify(t.owner, text, t.it.id, escal);
}
function setReminded(t) {
  const s = stamp();
  if (t.kind === 'm') t.m.reminded = s; else if (t.kind === 's') t.it.steps[t.k].reminded = s; else if (t.kind === 't') t.t.reminded = s; else if (t.kind === 'f') { const c = wfCur(t.it); if (c) c.reminded = s; } else if (t.kind === 'b' || t.kind === 'g') t.it.reminded = s;
}
function remindTask(t) {
  notifyOwner(t, `Erinnerung von ${me()}: ${taskLabel(t)} (${t.it.nr}), Termin ${fmt(t.due)}`);
  setReminded(t); log(t.it, `Erinnerung an ${ownerLabel(t)}: ${taskLabel(t)}`);
}
function remindOwner(owner) {
  const list = allTasks().filter(t => !t.done && t.owner === owner);
  if (!list.length) return 0;
  const over = list.filter(isOver);
  const pick = (over.length ? over : list).sort((a, b) => a.due.localeCompare(b.due));
  notifyOwner(pick[0], `Erinnerung von ${me()}: ${list.length} offene Aufgaben${over.length ? `, ${over.length} davon überfällig` : ''}. Älteste: ${taskLabel(pick[0])} (${pick[0].it.nr})`);
  pick.forEach(t => { setReminded(t); log(t.it, `Erinnerung an ${ownerLabel(t)}: ${taskLabel(t)}`); });
  return pick.length;
}
function runRules() {
  const r = S.rules; let n = 0;
  allTasks().filter(t => !t.done).forEach(t => {
    const d = daysBetween(TODAY, t.due), lbl = taskLabel(t), it = t.it;
    if (r.vorab && d > 0 && d === Number(r.vorabTage)) n += notifyOwner(t, `Erinnerung: ${lbl} (${it.nr}) ist in ${tage(d)} fällig`);
    if (r.faellig && d === 0) n += notifyOwner(t, `Heute fällig: ${lbl} (${it.nr})`);
    if (d < 0) {
      const od = -d, resp = isR(it) ? it.lead : it.creator;
      if (od >= Number(r.esk1)) n += notifyOwner(t, `Überfällig seit ${tage(od)}: ${lbl} (${it.nr})`, true);
      if (od >= Number(r.esk2) && resp && resp !== t.owner) n += notify(resp, `Eskalation: ${lbl} (${it.nr}) bei ${ownerLabel(t)} seit ${tage(od)} überfällig`, it.id, true);
      if (od >= Number(r.esk3) && t.owner !== leitName()) n += notify(leitName(), `Eskalation: ${lbl} (${it.nr}) bei ${ownerLabel(t)} seit ${tage(od)} überfällig`, it.id, true);
    }
  });
  S.lastAuto = TODAY;
  return n;
}

function feedList(app) {
  const f = S.feedF[app], q = norm(S.q[app]);
  let list = S.items.filter(i => i.app === app);
  if (f === 'mich') list = list.filter(i => involved(i, me()) && isOpen(i));

  if (f === 'ueber') list = list.filter(itemOverdue);
  if (f === 'erledigt') list = list.filter(i => !isOpen(i));
  if (q) list = list.filter(i => norm([i.nr, i.titel, i.beschreibung, isR(i) ? partnerName(i) + matName(i.matNr) : i.typ + i.creator].join(' ')).includes(q));
  return list.sort((a, b) => (isOpen(b) - isOpen(a)) || (itemOverdue(b) - itemOverdue(a)) || ((b.created || '').localeCompare(a.created || '')));
}

function sideApp(app) {

  return `<section class="card"><div class="card-h"><div><h2>Kennzahlen</h2></div></div><div class="kpis">

    <section class="card"><div class="card-h"><div><h2>Deine Aufgaben hier</h2></div></div>${mine.length ? `<ul class="w-list">${mine.slice(0, 6).map(wTask).join('')}</ul>` : '<p class="empty">Keine offenen Aufgaben.</p>'}</section>
    <section class="card"><div class="card-h"><div><h2>Zuletzt aktiv</h2></div></div><ul class="acts">${acts.slice(0, 6).map(a => `<li class="act">${av(a.who, 'xs')}<div class="act-t"><b>${esc(a.who)}</b> · ${esc(a.text)}<small><button class="linkbtn" data-action="open" data-id="${esc(a.it.id)}">${esc(a.it.nr)}</button> · ${esc(ago(a.at))}</small></div></li>`).join('')}</ul></section>`;

/* ---------- Mein Tag (Startseite) ---------- */
function focusTasks() { return allTasks().filter(t => !t.done && mineTask(t, me()) && ['f', 'b', 'g', 'r'].includes(t.kind)).sort((a, b) => a.due.localeCompare(b.due)); }
function verbTitle(t) {
  const ti = t.it.titel;
  if (t.kind === 'f' || t.kind === 'g') return `${ti} freigeben`;
  if (t.kind === 'b') return `${ti} bewerten`;
  if (t.kind === 'r') return `${ti} überarbeiten`;
  if (t.kind === 's') return `${t.k} ${t.text}`;
  return t.text;
}
function dueShort(due) {
  const d = daysBetween(TODAY, due);
  if (d < 0) return { t: `${tage(-d)} drüber`, c: 'over' };
  if (d === 0) return { t: 'heute', c: 'soon' };
  if (d === 1) return { t: 'morgen', c: 'soon' };
  return { t: new Date(due + 'T12:00:00').toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' }), c: 'week' };
}
function taskCard(t) {

    ? `<button class="mini" data-action="task-done" data-id="${esc(t.it.id)}" data-ref="${t.ref}">Erledigt</button>`
    : `<button class="mini acc" data-action="goto" data-id="${esc(t.it.id)}" data-ref="${t.ref}">${{ f: 'Freigeben', g: 'Freigeben', b: 'Bewerten', r: 'Bearbeiten', s: 'Öffnen' }[t.kind]}</button>`;
  const sub = ['s', 'm', 't'].includes(t.kind) ? t.it.titel : isR(t.it) ? partnerName(t.it) : t.it.typ;
  return `<div class="bcard"><div class="bc-top"><span class="apill ${t.it.app}">${APPS[t.it.app].short || 'Workflow'}</span>${av(creatorOf(t.it), 'xs')}</div>

}

function renderFeedList(app) {

/* ---------- Rahmen & Navigation ---------- */
function renderAll() {
  const p = S.route.p;
  applyTheme();
  $('shell').classList.toggle('wide', ['start', 'aufg', 'md', 'up', 'theme'].includes(p) || (!!APPS[p] && !S.route.id && S.av[p] !== 'feed'));
  renderFrame();
  let c = '', s = '';
  if (needGate()) { $('center').innerHTML = gatePage(); $('side').innerHTML = ''; $('fab').classList.remove('show'); return; }
  if (p === 'start') c = pageStart();
  else if (p === 'theme') c = pageTheme();
  else if (APPS[p]) {
    const it = S.route.id ? item(S.route.id) : null;
    c = it ? (isR(it) ? pageRDetail(it) : pageWDetail(it)) : pageFeed(p);
    s = sideApp(p);
  } else if (p === 'aufg') c = pageTasks();
  else if (p === 'md') c = pageMD();
  else if (p === 'up') c = pageUp();
  $('center').innerHTML = c;
  $('side').innerHTML = s;
  if (APPS[p] && !S.route.id) renderFeedList(p);
}
function go(p, id, opt) {
  S.route = { p, id: id || null };
  S.tab = (opt && opt.tab) || '';
  S.openStep = (opt && opt.k) || null;
  if (id && !S.openStep) { const it = item(id); if (it && isR(it) && isOpen(it)) S.openStep = nextOpen(it); }
  save(); renderAll(); window.scrollTo(0, 0);
}
function openItem(id, opt) { const it = item(id); if (it) go(it.app, id, opt); }
function gotoTask(id, ref) {
  const k = ref.split(':')[0];
  if (k === 'm') openItem(id, { tab: 'm' });
  else if (k === 's') openItem(id, { tab: '8d', k: ref.split(':')[1] });
  else if (k === 't') openItem(id, { tab: 't' });
  else if (k === 'b' || k === 'g') openItem(id, { tab: '8d' });
  else openItem(id, { tab: 'c' });
}
let toastT;
function toast(t) { const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 2800); }
function commit(msg) { save(); renderAll(); if (msg) toast(msg); }

/* ---------- Abläufe ---------- */
function addComment(it, text) {
  it.comments.push(CM(me(), stamp(), text, []));
  follow(it, me());
  const mentioned = people().filter(n => n !== me() && text.includes('@' + n));
  mentioned.forEach(n => { notify(n, `${me()} hat dich in ${it.nr} erwähnt: ${text.slice(0, 80)}${text.length > 80 ? '…' : ''}`, it.id); follow(it, n); });
  it.followers.filter(n => !mentioned.includes(n)).forEach(n => tell(n, `${me()} kommentiert ${it.nr}: ${text.slice(0, 80)}${text.length > 80 ? '…' : ''}`, it.id));
}
function setMeasure(it, m) {
  m.status = m.status === 'erledigt' ? 'offen' : 'erledigt'; m.doneAt = m.status === 'erledigt' ? TODAY : null;
  log(it, `Maßnahme „${m.text}“ ${m.status === 'erledigt' ? 'erledigt' : 'wieder offen'}`);
  if (m.status === 'erledigt') { tell(it.lead, `${me()} hat Maßnahme „${m.text}“ (${it.nr}) erledigt`, it.id); if (it.lead !== qmName()) tell(qmName(), `${me()} hat Maßnahme „${m.text}“ (${it.nr}) erledigt`, it.id); }
}
function setTask(it, t) {
  t.status = t.status === 'erledigt' ? 'offen' : 'erledigt'; t.doneAt = t.status === 'erledigt' ? TODAY : null;
  log(it, `Aufgabe „${t.text}“ ${t.status === 'erledigt' ? 'erledigt' : 'wieder offen'}`);
  if (t.status === 'erledigt') tell(it.creator, `${me()} hat „${t.text}“ (${it.nr}) erledigt`, it.id);
}
function wApprove(it, note) {
  const c = wfCur(it); Object.assign(c, { status: 'ok', at: stamp(), by: me(), note: note || '' });
  log(it, `Freigegeben${c.kind === 'a' ? ' für ' + c.who : ''}`); follow(it, me());
  const nx = it.chain[it.chain.indexOf(c) + 1];
  if (nx) { nx.status = 'aktiv'; tellStep(nx, `${it.nr} wartet auf Ihre Freigabe: ${it.titel}`, it.id); tell(it.creator, `${me()} hat ${it.nr} freigegeben, weiter an ${stepLabel(nx)}`, it.id); }
  else { it.status = 'freigegeben'; tellFollowers(it, `${it.nr} ist vollständig freigegeben`); }
}
function wReject(it, note) {
  const c = wfCur(it); Object.assign(c, { status: 'nok', at: stamp(), by: me(), note });
  it.status = 'zurueckgewiesen'; log(it, 'Zurückgewiesen'); follow(it, me());
  notify(it.creator, `${it.nr} wurde zurückgewiesen: ${note}`, it.id);
}
function wResend(it, note) {
  const c = it.chain.find(s => s.status === 'nok');
  if (c) Object.assign(c, { status: 'aktiv', at: null, by: null, note: '' });
  it.status = c ? 'laeuft' : 'inarbeit';
  if (it.due < TODAY) it.due = rel(3);
  it.comments.push(CM(me(), stamp(), 'Überarbeitet: ' + note, []));
  log(it, 'Überarbeitet und neu gesendet');
  if (c) tellStep(c, `${it.nr} wurde überarbeitet und wartet auf Ihre Freigabe`, it.id);
}

function readFile(file) {

    if (typeof XLSX === 'undefined') { toast('Excel-Leser nicht geladen. Bitte als CSV speichern oder einfügen.'); return; }
    const r = new FileReader();
    r.onload = () => {
      try {
        const wb = XLSX.read(new Uint8Array(r.result), { type: 'array' });
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: '' });
        loadParsed({ headers: (rows[0] || []).map(h => String(h).trim()), rows: rows.slice(1).map(x => x.map(c => String(c))) }, name);
      } catch (er) { toast('Die Datei konnte nicht gelesen werden.'); }

/* ---------- Live-Betrieb: gemeinsame Datenbank, Anmeldung, Dateien, PDF, E-Mail ----------
   Läuft die Seite in claude.ai mit freigegebener Datenbank, liegen alle Vorgänge, Stammdaten und
   Benachrichtigungen dort und alle Kolleginnen und Kollegen sehen denselben Stand.
   Ohne Datenbank (Website, abgemeldet) läuft dieselbe Datei als Demo mit Beispieldaten im Browser. */
const UI_KEYS = ['route', 'tab', 'openStep', 'feedF', 'q', 'tf', 'tp', 'tapp', 'mdObj', 'mdQ', 'av', 'thScope'];
const encId = s => String(s).replace(/[^A-Za-z0-9_\-:@+]/g, c => '~' + c.codePointAt(0).toString(16) + '~') || '~';

function stableStr(v) {
  if (Array.isArray(v)) return '[' + v.map(stableStr).join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).filter(k => v[k] !== undefined).sort().map(k => JSON.stringify(k) + ':' + stableStr(v[k])).join(',') + '}';
  return JSON.stringify(v === undefined ? null : v);
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
const lvCols = () => ['cfg', 'items', 'notes', 'uploads', 'pers'].concat(Object.keys(MD).map(o => 'md_' + o));

function blankShared() {
  return { md: Object.fromEntries(Object.keys(MD).map(o => [o, []])), items: [], notes: [], uploads: [], pers: {}, org: Object.assign({}, ORG_DEFAULT), rules: Object.assign({}, RULES_DEFAULT), lastAuto: '' };
}
function saveUI() { try { const o = {}; UI_KEYS.forEach(k => { o[k] = S[k]; }); localStorage.setItem(KEY + '-live-ui', JSON.stringify(o)); } catch (e) {} }
function loadUI() { try { return JSON.parse(localStorage.getItem(KEY + '-live-ui') || '{}') || {}; } catch (e) { return {}; } }

/* Soll-Zustand: welche Dokumente es geben muss */
function desiredDocs() {
  const m = new Map();
  S.items.forEach(it => m.set('items/' + encId(it.id), it));
  Object.keys(MD).forEach(o => (S.md[o] || []).forEach(r => m.set(`md_${o}/${encId(r[MD[o].key])}`, r)));
  S.notes.forEach(n => m.set('notes/' + encId(n.id), n));
  S.uploads.forEach(u => m.set('uploads/' + encId(u.id), u));
  Object.keys(S.pers || {}).forEach(n => m.set('pers/' + encId(n), Object.assign({ _n: n }, S.pers[n])));
  if (LV.seeded) { m.set('cfg/rules', S.rules); m.set('cfg/org', S.org); m.set('cfg/meta', { seeded: true, lastAuto: S.lastAuto || '', ver: 1 }); }
  return m;
}
function lvPush() {
  if (!LV.on || !LV.ready) return;
  const want = desiredDocs(), ops = [];
  want.forEach((obj, p) => { const s = stableStr(obj); if (LV.synced.get(p) !== s) ops.push({ p, s, data: JSON.parse(JSON.stringify(obj)) }); });
  LV.synced.forEach((s, p) => { if (!want.has(p)) ops.push({ p, del: true }); });
  if (!ops.length) return;
  if (LV.ro) { toast('Sie haben nur Lesezugriff. Die Änderung wurde nicht gespeichert.'); lvResync(); return; }
  ops.forEach(o => { if (o.del) LV.synced.delete(o.p); else LV.synced.set(o.p, o.s); lvEnqueue(o); });
}
function lvEnqueue(o) {
  const q = LV.queue.find(x => x.p === o.p);
  if (q) { Object.assign(q, o); if (o.del) delete q.data; else delete q.del; }
  else { o.isNew = !o.del && o.p.startsWith('items/') && !LV.remote.has(o.p) && !LV.pending.has(o.p) && !LV.mine.has(o.p); LV.queue.push(o); LV.pending.set(o.p, (LV.pending.get(o.p) || 0) + 1); }
  lvPump();
}
function lvPump() {
  while (LV.inflight.size < 4) {
    const i = LV.queue.findIndex(o => !LV.inflight.has(o.p));
    if (i < 0) break;
    const o = LV.queue.splice(i, 1)[0];
    LV.inflight.add(o.p);
    lvRun(o).finally(() => {
      LV.inflight.delete(o.p);
      const c = (LV.pending.get(o.p) || 1) - 1; if (c > 0) LV.pending.set(o.p, c); else LV.pending.delete(o.p);
      lvPump();
    });
  }
  lvSyncBadge();
}
async function lvRun(o, attempt = 0) {
  try {
    const ref = LV.db.doc(o.p);
    if (o.del) { await ref.delete(); return; }
    if (o.isNew && attempt === 0) { const s = await ref.get(); const t = s.exists ? s.data() : null; if (t && !(t.created === o.data.created && (t.erfasser || t.creator) === (o.data.erfasser || o.data.creator))) { lvRenumber(o.p, t); return; } }
    await ref.set(o.data); LV.mine.add(o.p);
  } catch (e) {
    const c = e && e.code;
    if (['resource_exhausted', 'unavailable'].includes(c) && attempt < 5) { await sleep(700 * 2 ** attempt); return lvRun(o, attempt + 1); }
    LV.synced.delete(o.p);
    if (c === 'invalid_argument' && LV.canWrite !== true) { LV.ro = true; toast('Sie haben nur Lesezugriff. Änderungen werden nicht gespeichert.'); }
    else if (c === 'quota_exceeded') toast('Die Datenbank ist voll (25.000 Einträge). Bitte alte Vorgänge oder Benachrichtigungen löschen.');
    else toast('Speichern fehlgeschlagen. Bitte die Seite neu laden.');
    setTimeout(() => { lvResync(); lvRender(true); }, 50);
  }
}
/* Zwei Personen haben gleichzeitig dieselbe Nummer vergeben: unsere bekommt die nächste freie */
function lvRenumber(path, theirs) {
  const old = decId(path.split('/')[1]), mine = S.items.find(i => i.id === old);
  LV.remote.set(path, theirs); LV.synced.set(path, stableStr(theirs));
  if (!mine) return;
  S.items.push(JSON.parse(JSON.stringify(theirs)));
  const nn = nextNr(mine.app);
  S.notes.forEach(n => { if (n.ref === old) { n.ref = nn; n.text = n.text.split(old).join(nn); } });
  mine.id = mine.nr = nn; mine.log.push({ at: stamp(), who: me(), text: `Nummer ${old} war gleichzeitig vergeben, neu ${nn}` });
  if (S.route.id === old) S.route.id = nn;
  toast(`${old} war gleichzeitig vergeben. Neue Nummer: ${nn}`);
  lvPush(); lvRender(true);
}
/* Eingehende Änderung in den lokalen Zustand übernehmen */
function lvApply(col, id, data) {
  const p = col + '/' + id;
  if (data) LV.remote.set(p, data); else LV.remote.delete(p);
  if (LV.pending.has(p)) return;
  if (data) LV.synced.set(p, stableStr(data)); else LV.synced.delete(p);
  const x = data ? JSON.parse(JSON.stringify(data)) : null;
  if (col === 'cfg') {
    if (id === 'rules') S.rules = Object.assign({}, RULES_DEFAULT, x || {});
    else if (id === 'org') S.org = Object.assign({}, ORG_DEFAULT, x || {});
    else if (id === 'meta') { LV.seeded = !!(x && x.seeded); S.lastAuto = x ? x.lastAuto || '' : ''; }
    return;
  }
  if (col === 'pers') { const n = x ? x._n : decId(id); if (x) { delete x._n; S.pers[n] = x; } else delete S.pers[n]; return; }
  const md = col.startsWith('md_') ? col.slice(3) : '';
  const arr = md ? S.md[md] : S[col];
  const keyOf = md ? (r => encId(r[MD[md].key])) : (r => encId(r.id));
  const i = arr.findIndex(r => keyOf(r) === id);
  if (x) { if (i >= 0) arr[i] = x; else arr.push(x); } else if (i >= 0) arr.splice(i, 1);
}
function lvResync() {
  Object.assign(S, blankShared());

  [...LV.remote.entries()].forEach(([p, d]) => { const [c, id] = p.split('/'); LV.pending.delete(p); lvApply(c, id, d); });
  LV.queue.length = 0;

}
function lvSort() {
  Object.keys(MD).forEach(o => S.md[o].sort((a, b) => String(a[MD[o].key]).localeCompare(String(b[MD[o].key]), 'de', { numeric: true })));
  S.notes.sort((a, b) => b.at.localeCompare(a.at));

}
let lvRT = null;

/* Start im Live-Betrieb */
async function lvBoot() {
  const hasClaude = !!(window.claude && window.claude.use);

  let db = null;
  try { db = await window.claude.use('db'); } catch (e) { db = null; }
  try { DL = await window.claude.use('downloads'); } catch (e) { DL = null; }
  if (!db) { bootShow(false); renderAll(); return; }
  LV.db = db; LV.on = true;
  try { LV.user = await window.claude.use('user'); } catch (e) { LV.user = null; }
  try { LV.assets = await window.claude.use('assets'); } catch (e) { LV.assets = null; }
  try { LV.mcp = await window.claude.use('mcp'); } catch (e) { LV.mcp = null; }
  if (LV.user) {
    try { LV.uid = await LV.user.id(); } catch (e) {}
    try { LV.prof = await LV.user.me(); } catch (e) {}
    try { LV.owner = await LV.user.isOwner(); } catch (e) {}
    try { LV.canWrite = await LV.user.can('data.write'); } catch (e) { LV.canWrite = null; }
    if (LV.canWrite === false) LV.ro = true;
  }
  const ui = loadUI();

  themeInit();
  const cols = lvCols(), got = new Set();
  cols.forEach(c => {
    LV.unsub.push(db.collection(c).onSnapshot(snap => {
      snap.docChanges().forEach(ch => lvApply(c, ch.doc.id, ch.type === 'removed' ? null : ch.doc.data()));
      if (c === 'notes') S.notes.sort((a, b) => b.at.localeCompare(a.at));
      got.add(c);
      if (!LV.ready && got.size === cols.length) lvReady(); else if (LV.ready) lvRender();
    }, err => {
      if (!LV.ready) { LV.err = err && err.code || 'unavailable'; bootShow(false); LV.ready = true; renderAll(); }
      else toast('Verbindung zur Datenbank unterbrochen. Bitte neu laden.');
    }));
  });
}
function lvReady() {
  LV.ready = true; lvSort(); bootShow(false);

/* Erinnerungen per E-Mail: eine Mail je Person mit allem, was offen ist */
function reminderMails() {
  const open = allTasks().filter(t => !t.done && !t.dept), by = {};
  open.forEach(t => { (by[t.owner] = by[t.owner] || []).push(t); });
  return Object.entries(by).filter(([, l]) => l.some(isOver)).map(([n, l]) => {
    const p = person(n) || {}, ov = l.filter(isOver).sort((a, b) => a.due.localeCompare(b.due)), rest = l.filter(t => !isOver(t)).sort((a, b) => a.due.localeCompare(b.due));
    const line = t => `- ${t.it.nr}: ${taskLabel(t)} (fällig ${fmt(t.due)})`;
    return { n, email: p.email || '', count: l.length, over: ov.length, subject: `Erinnerung: ${ov.length} überfällige ${ov.length === 1 ? 'Aufgabe' : 'Aufgaben'}`,
      body: `Hallo ${n.replace(/^Dr\.\s*/, '').split(' ')[0]},\n\nbei dir ist Folgendes überfällig:\n${ov.map(line).join('\n')}${rest.length ? `\n\nAußerdem offen:\n${rest.slice(0, 15).map(line).join('\n')}` : ''}\n\nBitte erledigen oder einen neuen Termin mit mir abstimmen.${sig()}` };
  });
}
function remindMailSheet() {
  const L = reminderMails(), ok = L.filter(x => x.email), no = L.filter(x => !x.email);
  if (!L.length) { toast('Niemand hat etwas überfällig.'); return; }
  openSheet(`${sheetH('Per E-Mail erinnern')}<form id="remF" novalidate><div class="sheet-b">
    <p>${ok.length} ${ok.length === 1 ? 'E-Mail' : 'E-Mails'}, je Person eine mit allen überfälligen und offenen Aufgaben.</p>
    <ul class="mail-l">${ok.map(x => `<li>${av(x.n, 's')}<span><b>${esc(x.n)}</b><small>${esc(x.email)} · ${x.over} überfällig, ${x.count} offen</small></span></li>`).join('')}</ul>
    ${no.length ? `<p class="hint">Ohne E-Mail-Adresse, werden übersprungen: ${no.map(x => esc(x.n)).join(', ')}. Adresse unter Stammdaten → Mitarbeiter ergänzen.</p>` : ''}
    <details><summary>Vorschau</summary><pre class="mail-pre">${esc(ok[0] ? `Betreff: ${ok[0].subject}\n\n${ok[0].body}` : '')}</pre></details>
    <p class="hint">${canMail() ? 'Versand über Ihr Gmail-Konto.' : 'In der Demo werden keine E-Mails versendet. Im Pilot gehen sie über Ihr Gmail-Konto raus.'}</p>
  </div>${foot(canMail() ? `${ok.length} senden` : 'Verstanden', 'primary')}</form>`, true);
}
async function sendReminders() {
  if (!canMail()) { closeSheet(); return; }
  const L = reminderMails().filter(x => x.email); let ok = 0, fail = 0, lastErr = null;
  closeSheet();
  for (const x of L) {
    toast(`Sende ${ok + fail + 1} von ${L.length} …`);
    try { await sendMail([x.email], x.subject, x.body); ok++; } catch (e) { fail++; lastErr = e; if (e && ['server_not_connected', 'needs_reauth', 'not_granted', 'consent_required', 'blocked_by_policy', 'cancelled'].includes(e.code)) break; }
  }
  if (ok) { L.slice(0, ok).forEach(x => remindOwner(x.n)); commit(`${ok} ${ok === 1 ? 'Erinnerung' : 'Erinnerungen'} per E-Mail gesendet${fail ? `, ${fail} fehlgeschlagen` : ''}`); }
  else toast(mailErr(lastErr));
}

/* Ereignisse des Live-Moduls */
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('[data-action]'); if (!b) return;
  const d = b.dataset, it = S.route.id ? item(S.route.id) : null;
  switch (d.action) {
    case 'claim': { const p = person(d.n); if (!p || p.uid) { toast('Bereits vergeben'); return; } p.uid = LV.uid; commit('Willkommen, ' + p.name); break; }
    case 'xl-list': exportList(S.route.p); break;
    case 'xl-tasks': exportTasks(); break;
    case 'pdf': if (it) downloadPdf(it); break;
    case 'mail-report': if (it) mailReport(it); break;
    case 'mail-alt': if (MAIL && MAIL.onAlt) MAIL.onAlt(); break;
    case 'remind-mail': remindMailSheet(); break;
    case 'doc-del': delDoc(d.aid); break;
    case 'demo-del': removeDemo(); break;
    case 'md-unlink': { const p = person(d.n); if (p) { p.uid = ''; closeSheet(); commit(`Verknüpfung von ${p.name} gelöst`); } break; }
  }
});
document.addEventListener('submit', e => {
  const id = e.target.id;
  if (id === 'setupF') doSetup();
  else if (id === 'joinF') {
    const v = x => $(x).value.trim(), n = v('jn-name'), er = $('jn-err');
    if (!n) { er.textContent = 'Bitte Ihren Namen eingeben.'; er.hidden = false; return; }
    if (person(n)) { er.textContent = 'Den Namen gibt es schon. Bitte oben auswählen oder z. B. mit Abteilung ergänzen.'; er.hidden = false; return; }
    S.md.mitarbeiter.push({ name: n, abteilung: v('jn-abt'), rolle: 'Mitarbeiter', email: v('jn-mail'), uid: LV.uid || '' }); lvSort(); commit('Willkommen, ' + n);
  }
  else if (id === 'mailF') submitMail();
  else if (id === 'remF') sendReminders();
});

/* ---------- Start ---------- */
themeInit();
if (!(window.claude && window.claude.use) && S.lastAuto !== TODAY) { runRules(); save(); }
try { new MutationObserver(() => applyTheme()).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] }); } catch (e) {}
try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); } catch (e) {}
renderAll();
/* Direktlinks: #workflow, #kunden, #lieferanten, #aufgaben, #stammdaten */
{ const h = (location.hash || '').slice(1).toLowerCase(), R = { workflow: 'wf', wf: 'wf', kunden: 'kr', kr: 'kr', kundenreklamation: 'kr', lieferanten: 'lr', lr: 'lr', lieferantenreklamation: 'lr', aufgaben: 'aufg', stammdaten: 'md' }; if (R[h]) { S.route = { p: R[h], id: null }; renderAll(); } }
lvBoot();
</script>
